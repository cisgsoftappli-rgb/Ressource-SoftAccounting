      `apps/softshop/src/index.html`, page qui ne sert qu'au mode autonome

      les trois familles n'étaient donc jamais chargées en production. Le module
      retombait silencieusement sur 'Segoe UI'.
      Le chargement se fait ici plutôt que par un `@import` dans une feuille de
      `styles[]` : Angular concatène ces feuilles en un seul fichier, et un
      `@import` qui ne se retrouve pas en tête de bundle est ignoré par le
      navigateur. Les fichiers de police ne sont téléchargés que si un texte
      rendu les demande — les autres modules n'en paient donc que la requête CSS.
    -->

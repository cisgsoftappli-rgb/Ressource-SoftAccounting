<!--
  Écran « Paramétrages › Administration › Paramétrage des traces ».
  Traçabilité des actions (création, modification, suppression) regroupée par module puis par fonctionnalité existante de la maquette,
  avec la période de rétention des logs (en jours). Chaque fonctionnalité n'offre que les actions qui existent dans l'écran correspondant
  (lettres C M S). Données simulées en mémoire : window.TRACES_CFG = { fonctionnalité : { c, m, s, jours } }.
  Boutons Annuler / Enregistrer relayés par la barre d'actions de page (CFG « traces » dans barre_actions.js).
-->
<style>
.tr{color:#0B1332}
.tr-intro{margin:0 0 12px;font-size:13px;color:#474C58}
.tr-tb{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 14px}
.tr-q{position:relative;flex:1;min-width:220px;max-width:420px}.tr-q i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#747A88;font-size:14px}
.tr-q input{width:100%;box-sizing:border-box;height:36px;border:1px solid #878D9A;border-radius:8px;padding:0 12px 0 32px;font:inherit;font-size:13px;background:#fff}
.tr-par{display:flex;align-items:center;gap:8px;font-size:12px;color:#474C58}
.tr-par input[type=number]{width:84px;height:34px;border:1px solid #878D9A;border-radius:8px;padding:0 8px;font:inherit;font-size:13px;background:#fff}
.tr-b{height:34px;padding:0 12px;border:1px solid #D6D9E0;border-radius:8px;background:#fff;color:#0B1332;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.tr-b:hover{background:#F5F7F9}
.tr-card{background:#fff;border:1px solid #E9EBF0;border-radius:12px;margin:0 0 14px;overflow:hidden}
.tr-ch{display:flex;align-items:center;gap:10px;padding:14px 20px;border:0;background:#fff;width:100%;text-align:left;cursor:pointer;font:inherit}
.tr-ch b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#747A88}.tr-ch small{margin-left:auto;font-size:12px;color:#5B606D}.tr-ch i{color:#747A88;font-size:14px;transition:transform .15s}.tr-card.ferme .tr-ch i{transform:rotate(-90deg)}.tr-card.ferme .tr-t{display:none}
.tr-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}.tr-t th:last-child{white-space:normal;line-height:1.3}.tr-t td:first-child{overflow-wrap:anywhere}
.tr-t th{background:#F5F7F9;border-top:1px solid #E9EBF0;border-bottom:1px solid #E9EBF0;padding:11px 14px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B606D;white-space:nowrap}
.tr-t th:first-child,.tr-t td:first-child{text-align:left;padding-left:20px}
.tr-t td{padding:11px 14px;text-align:center;border-bottom:1px solid #EEF0F4;background:#fff}
.tr-t tr:last-child td{border-bottom:0}
.tr-t td:first-child{font-weight:500}
.tr-t tr.ss td{background:#fff;text-align:left;padding:9px 20px 5px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#2E427B;border-bottom:0}
.tr-t input[type=checkbox]{width:16px;height:16px;cursor:pointer;vertical-align:middle}.tr-t input[type=checkbox]:disabled{cursor:not-allowed;opacity:.35}
.tr-t input[type=number]{width:96px;height:36px;box-sizing:border-box;border:1px solid #878D9A;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;text-align:left;background:#fff}
.tr-t input[type=number]:disabled{background:#F5F7F9;border-color:#D6D9E0;color:#747A88}.tr-t input[type=number].err{border-color:#B63132}
.tr-na{color:#B7BBC6}
.tr-d{display:block;margin-top:2px;font-size:12px;font-weight:400;color:#5B606D}
.tr-switch{-webkit-appearance:none;appearance:none;position:relative;display:inline-block;margin:0;width:36px;height:20px;border:0;border-radius:999px;background:#C9CED8;cursor:pointer;vertical-align:middle;transition:background .15s}
.tr-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tr-t input[type=checkbox].tr-switch{width:36px;height:20px;border-radius:999px}.tr-t input.tr-switch:focus:not(:focus-visible){outline:0;box-shadow:none!important}
.tr-switch:checked{background:#10B981}.tr-switch:checked::after{left:18px}.tr-switch:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 4px #2E427B}
.tr-vide{padding:30px;text-align:center;color:#747A88;font-size:13px}
.tr-act{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tr-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0B1332;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:3000}
</style>
<div class="tr" data-tr>
  <p class="tr-intro">Choisissez, pour chaque fonctionnalité, les actions à tracer et la durée de conservation des logs. Une fonctionnalité sans action cochée n'est pas tracée.</p>
  <div class="tr-tb">
    <div class="tr-q"><i class="ti ti-search"></i><input type="text" placeholder="Rechercher une fonctionnalité…" data-tr-q aria-label="Rechercher une fonctionnalité"></div>
    <div class="tr-par"><span>Rétention par défaut</span><input type="number" min="1" max="3650" value="365" data-tr-def aria-label="Rétention par défaut en jours"><span>jours</span><button type="button" class="tr-b" data-tr-appl>Appliquer à tout</button></div>
    <div class="tr-par"><button type="button" class="tr-b" data-tr-tout="1">Tout tracer</button><button type="button" class="tr-b" data-tr-tout="0">Ne rien tracer</button></div>
  </div>
  <div data-tr-corps></div>
  <div class="tr-act"><button type="button" data-tr-annuler>Annuler</button><button type="button" data-tr-enregistrer>Enregistrer</button></div>
</div>
<script>
(function () {
  var root = document.currentScript.parentElement.querySelector('[data-tr]');
  var q = function (s) { return root.querySelector(s); };
  // [module, [ [sous-module | null, [ [fonctionnalité, actions C/M/S], … ] ], … ]]
  var MODULES = [
    ['Paramétrages', [
      ['Administration', [['Utilisateurs', 'CMS'], ['Gestion des accès', 'CMS'], ['Paramétrage des traces', 'M'], ['Nettoyages', 'S'], ['Alertes', 'CMS']]],
      ['Paramètres généraux', [['Pays', 'CMS'], ['Devise', 'CMS'], ['Unités', 'CMS'], ['Administration de l’entité', 'M'], ['Signataires', 'CMS'], ['Liste des banques', 'CMS']]],
      ['Paramètres comptables', [['Exercices comptables', 'CMS'], ['Configuration des plans', 'M'], ['Saisie des plans', 'CMS'], ['Mode de règlement', 'CMS']]],
      ['Paramètres financiers', [['Devis programme', 'CMS'], ['Procédures financières', 'CMS']]]
    ]],
    ['Comptabilité générale', [[null, [['Compte de tiers', 'CMS'], ['Saisie d’écritures', 'CMS'], ['Journaux', 'CMS'], ['Rapprochement bancaire — Configuration', 'CMS'], ['Rapprochement bancaire — Pointage', 'CM'], ['Rapprochement bancaire — Situation', 'CM'], ['Gestion des cours', 'CM'], ['Petite caisse', 'CMS']]]]],
    ['Comptabilité analytique', [[null, [['Plans analytiques', 'CMS']]]]],
    ['Immobilisations', [[null, [['Paramétrages', 'CMS'], ['Saisies', 'CMS']]]]],
    ['Gestion des contrats', [[null, [['Type de passation', 'CMS'], ['Type de marché', 'CMS'], ['Saisies', 'CMS']]]]],
    ['États comptables', [[null, [['Type de taxe', 'CMS'], ['Modèle d’état', 'CMS'], ['Modèle Listing', 'CMS'], ['Modèle Récapitulatif', 'CMS'], ['Traitement des déclarations', 'CM']]]]],
    ['États financiers', [[null, [['Bilan — paramétrage', 'CMS'], ['Compte de résultat — paramétrage', 'CMS'], ['Emplois et ressources — paramétrage', 'CMS'], ['Tableau de flux de trésorerie — paramétrage', 'CMS'], ['Compte spécial', 'CMS'], ['Utilisation de fonds', 'CMS']]]]],
    ['Comptabilité Projets & Bailleurs', [[null, [['Saisie PAD', 'CMS'], ['Gestion des demandes de remboursement', 'CMS'], ['Modèle récapitulatif', 'CMS'], ['Modèle SOE', 'CMS']]]]]
  ];
  var COLS = '<colgroup><col style="width:38%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:20%"></colgroup>';
  var ACTIONS = [['c', 'Création', 'C'], ['m', 'Modification', 'M'], ['s', 'Suppression', 'S']];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function defaut() { var d = {}; MODULES.forEach(function (m) { m[1].forEach(function (g) { g[1].forEach(function (f) { d[f[0]] = { c: f[1].indexOf('C') >= 0, m: f[1].indexOf('M') >= 0, s: f[1].indexOf('S') >= 0, jours: 365 }; }); }); }); return d; }
  function copie(o) { return JSON.parse(JSON.stringify(o)); }
  var SEC = [['conn', 'Tracer les connexions et échecs d’authentification', 'Ouvertures de session, déconnexions, mots de passe erronés et comptes verrouillés.'],
             ['cons', 'Tracer les consultations d’états sensibles', 'Balances, grand livre, états financiers et déclarations fiscales : qui les a consultés ou exportés, et quand.']];
  var secEnreg = { conn: { on: true, jours: 365 }, cons: { on: true, jours: 365 } }, sec = copie(secEnreg);
  var enreg = defaut(), cfg = copie(enreg), filtre = '', ferme = {};
  window.TRACES_CFG = copie(enreg); window.TRACES_SECURITE = copie(secEnreg);
  function secHtml() {
    var l = SEC.filter(function (x) { return !filtre || x[1].toLowerCase().indexOf(filtre) >= 0 || 'sécurité'.indexOf(filtre) >= 0; });
    if (!l.length) return '';
    var nb = SEC.filter(function (x) { return sec[x[0]].on; }).length;
    return '<section class="tr-card' + (ferme['Sécurité'] ? ' ferme' : '') + '"><button type="button" class="tr-ch" data-tr-m="Sécurité" aria-expanded="' + (ferme['Sécurité'] ? 'false' : 'true') + '"><i class="ti ti-chevron-down"></i><b>Sécurité et accès</b><small>' + nb + ' / ' + SEC.length + ' paramètre(s) actif(s)</small></button>' +
      '<table class="tr-t">' + COLS + '<thead><tr><th>Paramètre</th><th colspan="3">Traçabilité</th><th>Période de rétention des logs (jours)</th></tr></thead><tbody>' +
      l.map(function (x) {
        var c = sec[x[0]];
        return '<tr><td>' + esc(x[1]) + '<span class="tr-d">' + esc(x[2]) + '</span></td><td colspan="3"><label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" class="tr-switch" role="switch" data-tr-sec="' + x[0] + '"' + (c.on ? ' checked' : '') + ' aria-label="' + esc(x[1]) + '"><span>' + (c.on ? 'Activée' : 'Désactivée') + '</span></label></td>' +
          '<td><input type="number" min="1" max="3650" step="1" value="' + esc(c.jours) + '" data-tr-sj="' + x[0] + '"' + (c.on ? '' : ' disabled') + ' aria-label="Rétention des logs en jours — ' + esc(x[1]) + '"></td></tr>';
      }).join('') + '</tbody></table></section>';
  }
  function ops(f) { for (var i = 0; i < MODULES.length; i++) for (var j = 0; j < MODULES[i][1].length; j++) for (var k = 0; k < MODULES[i][1][j][1].length; k++) if (MODULES[i][1][j][1][k][0] === f) return MODULES[i][1][j][1][k][1]; return ''; }
  function trace(f) { var c = cfg[f]; return c.c || c.m || c.s; }
  function dessiner() {
    var h = secHtml(), total = 0;
    MODULES.forEach(function (m, mi) {
      var lignes = '', nb = 0, tr = 0, colTous = { c: [0, 0], m: [0, 0], s: [0, 0] };
      m[1].forEach(function (g) {
        var fs = g[1].filter(function (f) { return !filtre || f[0].toLowerCase().indexOf(filtre) >= 0 || m[0].toLowerCase().indexOf(filtre) >= 0; });
        if (!fs.length) return;
        if (g[0]) lignes += '<tr class="ss"><td colspan="5">' + esc(g[0]) + '</td></tr>';
        fs.forEach(function (f) {
          var c = cfg[f[0]], on = trace(f[0]); nb++; total++; if (on) tr++;
          lignes += '<tr><td>' + esc(f[0]) + '</td>' + ACTIONS.map(function (a) {
            if (f[1].indexOf(a[2]) < 0) return '<td><span class="tr-na" title="Action inexistante dans cet écran">—</span></td>';
            colTous[a[0]][1]++; if (c[a[0]]) colTous[a[0]][0]++;
            return '<td><input type="checkbox" data-tr-c="' + esc(f[0]) + '|' + a[0] + '"' + (c[a[0]] ? ' checked' : '') + ' aria-label="' + a[1] + ' — ' + esc(f[0]) + '"></td>';
          }).join('') + '<td><input type="number" min="1" max="3650" step="1" value="' + esc(c.jours) + '" data-tr-j="' + esc(f[0]) + '"' + (on ? '' : ' disabled') + ' aria-label="Rétention des logs en jours — ' + esc(f[0]) + '"></td></tr>';
        });
      });
      if (!nb) return;
      h += '<section class="tr-card' + (ferme[m[0]] ? ' ferme' : '') + '"><button type="button" class="tr-ch" data-tr-m="' + esc(m[0]) + '" aria-expanded="' + (ferme[m[0]] ? 'false' : 'true') + '"><i class="ti ti-chevron-down"></i><b>' + esc(m[0]) + '</b><small>' + tr + ' / ' + nb + ' fonctionnalité(s) tracée(s)</small></button>' +
        '<table class="tr-t">' + COLS + '<thead><tr><th>Fonctionnalité</th>' + ACTIONS.map(function (a) {
          var t = colTous[a[0]]; return '<th>' + (t[1] ? '<label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" data-tr-col="' + mi + '|' + a[0] + '"' + (t[0] === t[1] ? ' checked' : '') + ' aria-label="Tout cocher : ' + a[1] + '">' : '<label>') + a[1] + '</label></th>';
        }).join('') + '<th>Période de rétention des logs (jours)</th></tr></thead><tbody>' + lignes + '</tbody></table></section>';
    });
    q('[data-tr-corps]').innerHTML = h || '<div class="tr-vide">Aucune fonctionnalité ne correspond à la recherche.</div>';
  }
  function toast(t) { var d = document.createElement('div'); d.className = 'tr-toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2400); }
  function fonctions(mi) { var r = []; MODULES[mi][1].forEach(function (g) { g[1].forEach(function (f) { r.push(f[0]); }); }); return r; }
  root.addEventListener('change', function (e) {
    var t = e.target, p;
    if (t.dataset.trSec) { sec[t.dataset.trSec].on = t.checked; dessiner(); }
    else if (t.dataset.trSj) { sec[t.dataset.trSj].jours = t.value === '' ? '' : +t.value; t.classList.remove('err'); }
    else if (t.dataset.trC) { p = t.dataset.trC.split('|'); cfg[p[0]][p[1]] = t.checked; dessiner(); }
    else if (t.dataset.trCol) { p = t.dataset.trCol.split('|'); fonctions(+p[0]).forEach(function (f) { if (ops(f).indexOf(p[1].toUpperCase()) >= 0 && (!filtre || f.toLowerCase().indexOf(filtre) >= 0)) cfg[f][p[1]] = t.checked; }); dessiner(); }
    else if (t.dataset.trJ) { cfg[t.dataset.trJ].jours = t.value === '' ? '' : +t.value; t.classList.remove('err'); }
  });
  root.addEventListener('input', function (e) { if (e.target.hasAttribute('data-tr-q')) { filtre = e.target.value.trim().toLowerCase(); dessiner(); } });
  root.addEventListener('click', function (e) {
    var t = e.target, b;
    if ((b = t.closest('[data-tr-m]'))) { ferme[b.dataset.trM] = !ferme[b.dataset.trM]; dessiner(); }
    else if (t.closest('[data-tr-appl]')) { var v = +q('[data-tr-def]').value; if (!(v >= 1 && v <= 3650)) { toast('Saisissez une rétention entre 1 et 3650 jours.'); return; } Object.keys(cfg).forEach(function (f) { cfg[f].jours = v; }); Object.keys(sec).forEach(function (k) { sec[k].jours = v; }); dessiner(); toast('Rétention de ' + v + ' jour(s) appliquée à toutes les fonctionnalités.'); }
    else if ((b = t.closest('[data-tr-tout]'))) { var on = b.dataset.trTout === '1'; Object.keys(sec).forEach(function (k) { sec[k].on = on; }); Object.keys(cfg).forEach(function (f) { var o = ops(f); cfg[f].c = on && o.indexOf('C') >= 0; cfg[f].m = on && o.indexOf('M') >= 0; cfg[f].s = on && o.indexOf('S') >= 0; }); dessiner(); }
    else if (t.closest('[data-tr-annuler]')) { cfg = copie(enreg); sec = copie(secEnreg); dessiner(); toast('Modifications annulées.'); }
    else if (t.closest('[data-tr-enregistrer]')) {
      var faux = Object.keys(cfg).filter(function (f) { var j = cfg[f].jours; return trace(f) && !(Number.isInteger(+j) && +j >= 1 && +j <= 3650 && j !== ''); });
      var fauxSec = Object.keys(sec).filter(function (k) { var j = sec[k].jours; return sec[k].on && !(Number.isInteger(+j) && +j >= 1 && +j <= 3650 && j !== ''); });
      if (fauxSec.length) { fauxSec.forEach(function (k) { var n = root.querySelector('[data-tr-sj="' + k + '"]'); if (n) n.classList.add('err'); }); var n1 = root.querySelector('input.err'); if (n1) n1.focus(); toast('Rétention invalide : entre 1 et 3650 jours.'); return; }
      if (faux.length) { faux.forEach(function (f) { var n = root.querySelector('[data-tr-j="' + f.replace(/"/g, '\\"') + '"]'); if (n) n.classList.add('err'); }); var n0 = root.querySelector('input.err'); if (n0) n0.focus(); toast('Rétention invalide : entre 1 et 3650 jours (' + faux.length + ' fonctionnalité(s)).'); return; }
      enreg = copie(cfg); secEnreg = copie(sec); window.TRACES_CFG = copie(enreg); window.TRACES_SECURITE = copie(secEnreg); window.dispatchEvent(new Event('traces-changed'));
      toast('Paramétrage des traces enregistré : ' + Object.keys(enreg).filter(trace.bind(null)).length + ' fonctionnalité(s) tracée(s), ' + Object.keys(secEnreg).filter(function (k) { return secEnreg[k].on; }).length + '/2 paramètre(s) de sécurité actif(s).');
    }
  });
  dessiner();
})();
</script>

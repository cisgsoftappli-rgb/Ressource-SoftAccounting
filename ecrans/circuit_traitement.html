<!--
  Écran « Traitement » (Comptabilité générale › Circuit de validation › Traitement) — tableau de suivi des pièces par état du circuit : une colonne par état
  (SAISIS, puis l'état de chaque étape paramétrée dans « Paramètre Circuit », ex. VALIDE). Barre de recherche : bouton Rechercher, site, période, recherche libre.
  Une pièce passe à l'état suivant par le bouton d'action de l'étape (ex. VALIDER) ou par glisser-déposer vers la colonne suivante, si l'utilisateur est rattaché
  à l'étape. Les pièces enregistrées dans la saisie d'écritures arrivent à l'état SAISIS ; pièces de démonstration en plus (aucune écriture réelle n'alimente la maquette).
  Si l'étape cible porte une CHECKLIST et/ou un COMMENTAIRE OBLIGATOIRE (Paramètre Circuit), une fenêtre s'ouvre avant l'exécution : les points obligatoires doivent être cochés et le commentaire saisi ; le résultat est conservé dans l'historique de la pièce.
  Ne pas nommer de fonction « $$ » (build.cjs).
-->
<style>

</style>

<div class="cvt" data-cvt>
  <div class="cvt-bar">
    <button type="button" class="cvt-go" data-cvt-go><i class="ti ti-search" aria-hidden="true"></i>Rechercher</button>
    <select data-cvt-site aria-label="Site"></select>
    <span class="cvt-dt"><input type="date" data-cvt-d1 aria-label="Du"><button type="button" data-cvt-x1 title="Effacer" aria-label="Effacer la date de début"><i class="ti ti-circle-x-filled"></i></button></span>
    <span>au</span>
    <span class="cvt-dt"><input type="date" data-cvt-d2 aria-label="Au"><button type="button" data-cvt-x2 title="Effacer" aria-label="Effacer la date de fin"><i class="ti ti-circle-x-filled"></i></button></span>
    <span class="cvt-rech"><i class="ti ti-search" aria-hidden="true"></i><input type="search" data-cvt-q placeholder="Rechercher" aria-label="Rechercher"></span>
  </div>
  <div class="cvt-cols" data-cvt-cols></div>
  <div class="cvt-toast" data-cvt-toast hidden></div>
</div>

<script>
(function () {
  var root = document.querySelector('[data-cvt]'); if (!root) return;
  function q(s) { return root.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(n) { return (n || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function frd(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
  var UTIL = 'admin';
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function toast(m) { var t = q('[data-cvt-toast]'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2400); }

  // --- étapes du circuit (Paramètre Circuit) ---
  function etapes() { var E = window.CIRCUIT_ETAPES || [{ num: 1, nom: 'VALIDATION', etat: 'VALIDE', action: 'VALIDER', mi: false, si: true, cmt: false, users: ['admin'], checklist: [] }]; return E.slice().sort(function (a, b) { return a.num - b.num; }); }
  function zeroActif() { return !!(window.CIRCUIT_ZERO && window.CIRCUIT_ZERO.actif); }
  function colonnes() { return (zeroActif() ? [{ etat: 'BROUILLON', etape: null, brouillon: true }] : []).concat([{ etat: 'SAISIS', etape: null }]).concat(etapes().map(function (e) { return { etat: e.etat, etape: e }; })); }
  function vbIndex() { var C = colonnes(), k = -1; C.forEach(function (c, i) { if (c.etape && c.etape.vb) k = i; }); return k; }   // colonne de l'étape « Validation du brouillon »
  function autorise(e) { return !e || e.users.indexOf(UTIL) >= 0 || e.users.indexOf('superadmin') >= 0; }

  // --- pièces : démonstration + pièces enregistrées dans la saisie d'écritures ---
  var etats = {}, histo = {};   // clé journal|pièce → état ; clé → historique des passages (utilisateur, date, points cochés, commentaire)
  function demo() {
    var J = ((window.ECRITURES_REF && window.ECRITURES_REF.journaux) || []).map(function (j) { return j.code; }), L = ['Achat de fournitures de bureau', 'Facture honoraires consultant', 'Règlement fournisseur', 'Frais de mission', 'Approvisionnement de la caisse', 'Commission bancaire', 'Location de bureau', 'Vente diverse encaissée'];
    var base = new Date(2026, 10, 2), out = [];
    for (var i = 0; i < 8; i++) {
      var d = new Date(base.getTime() - (i * 3 + 1) * 86400000), j = J.length ? J[(i * 7) % J.length] : '01ACHAT';
      out.push({ journal: j, piece: j + ('000' + (i + 1)).slice(-4), date: iso(d), site: '01', libelle: L[i], montant: (((i * 37) % 19) + 2) * 185000, lignes: 2, demo: true, etat: i < 5 ? 'SAISIS' : 'VALIDE' });
    }
    [0, 1].forEach(function (k) { var d2 = new Date(base.getTime() - (k + 1) * 86400000), j2 = J.length ? J[(k * 5 + 2) % J.length] : '01ACHAT'; out.push({ journal: j2, piece: j2 + 'BR' + ('00' + (k + 1)).slice(-3), date: iso(d2), site: '01', libelle: ['Brouillon — facture fournisseur à valider', 'Brouillon — frais de déplacement'][k], montant: (k + 3) * 240000, lignes: 2, demo: true, brouillon: true, etat: 'BROUILLON', createur: ['ANDRY', 'HERY'][k] }); });
    return out;
  }
  var DEMO = demo();
  function pieces() {
    var P = DEMO.filter(function (x) { return !x.brouillon || zeroActif(); }), reg = window.ECRITURES_PIECES || [];
    reg.forEach(function (p) {
      var cle = p.journal + '|' + p.piece; if (P.some(function (x) { return x.journal + '|' + x.piece === cle; })) return;
      var m = 0; (p.lignes || []).forEach(function (l) { if (l.sens === 'DEBIT') m += l.montant || 0; });
      P.push({ journal: p.journal, piece: p.piece, date: p.date || '', site: '01', libelle: ((p.lignes || [])[0] || {}).libelle || 'Pièce saisie', montant: m, lignes: (p.lignes || []).length, etat: p.statut === 'Brouillon' && zeroActif() ? 'BROUILLON' : 'SAISIS', createur: p.createur || '' });
    });
    P.forEach(function (p) { var cle = p.journal + '|' + p.piece; if (etats[cle]) p.etat = etats[cle]; });
    return P;
  }

  // --- barre de recherche ---
  var site = q('[data-cvt-site]'), d1 = q('[data-cvt-d1]'), d2 = q('[data-cvt-d2]'), rech = q('[data-cvt-q]');
  function sites() { var S = (window.ECRITURES_REF && window.ECRITURES_REF.sites) || [{ code: '01', label: 'Siege' }]; site.innerHTML = '<option value="">Tous les sites</option>' + S.map(function (s) { return '<option value="' + esc(s.code) + '">' + esc(s.code + ' - ' + s.label) + '</option>'; }).join(''); if (S.length) site.value = S[0].code; }
  sites();
  d1.value = '2026-10-02'; d2.value = '2026-11-02';
  q('[data-cvt-x1]').addEventListener('click', function () { d1.value = ''; dessiner(); });
  q('[data-cvt-x2]').addEventListener('click', function () { d2.value = ''; dessiner(); });

  var colsEl = q('[data-cvt-cols]'), glisse = null;
  function visibles() {
    var t = rech.value.trim().toLowerCase();
    return pieces().filter(function (p) {
      if (site.value && p.site !== site.value) return false;
      if (d1.value && p.date && p.date < d1.value) return false;
      if (d2.value && p.date && p.date > d2.value) return false;
      return !t || (p.journal + ' ' + p.piece + ' ' + p.libelle).toLowerCase().indexOf(t) >= 0;
    });
  }
  function dessiner() {
    var C = colonnes(), P = visibles();
    colsEl.innerHTML = C.map(function (c, i) {
      var L = P.filter(function (p) { return p.etat === c.etat; }), vbi = vbIndex(), suiv = c.brouillon ? C[vbi] : C[i + 1], ia = c.brouillon ? vbi - 1 : i;
      return '<section class="cvt-col" data-i="' + i + '" aria-label="' + esc(c.etat) + '"><div class="cvt-ch">' + esc(c.etat) + '<small>' + L.length + '</small></div><div class="cvt-cb">' +
        (L.length ? L.map(function (p) {
          return '<article class="cvt-card" draggable="true" data-cle="' + esc(p.journal + '|' + p.piece) + '"><div class="cvt-ct"><span>' + esc(p.journal) + ' — ' + esc(p.piece) + '</span><span>' + fmt(p.montant) + '</span></div>' +
            (histo[p.journal + '|' + p.piece] ? '<div class="cvt-cm" title="' + esc(histo[p.journal + '|' + p.piece].map(function (h) { return h.etape + ' : ' + h.commentaire; }).join(' | ')) + '"><i class="ti ti-message" aria-hidden="true"></i> ' + esc((histo[p.journal + '|' + p.piece].slice(-1)[0].retour ? 'Retour — ' : '') + (histo[p.journal + '|' + p.piece].slice(-1)[0].commentaire || ('Étape « ' + histo[p.journal + '|' + p.piece].slice(-1)[0].etape + ' » validée'))) + '</div>' : '') +
            (p.createur ? '<div class="cvt-cm"><i class="ti ti-user" aria-hidden="true"></i> Créé par ' + esc(p.createur) + '</div>' : '') + '<div class="cvt-cm">' + frd(p.date) + ' · ' + p.lignes + ' ligne' + (p.lignes > 1 ? 's' : '') + (p.demo ? ' · démonstration' : '') + '</div><div class="cvt-cl">' + esc(p.libelle) + '</div>' +
            '<div class="cvt-cf">' + (c.etape && c.etape.mi ? '<span class="cvt-lock"><i class="ti ti-lock" aria-hidden="true"></i>Modification impossible</span>' : '<em></em>') +
            '<span class="cvt-btns">' + (i > 0 && c.etape ? '<button type="button" class="cvt-br" data-ret="' + i + '"' + (autorise(c.etape) ? '' : ' disabled title="Retour réservé aux utilisateurs rattachés à l’étape"') + ' title="Renvoyer à l’étape précédente (commentaire obligatoire)">Retour</button>' : '') +
            (suiv && suiv.etape ? '<button type="button" class="cvt-ba" data-act="' + ia + '"' + (autorise(suiv.etape) ? '' : ' disabled title="Action réservée aux utilisateurs rattachés à l’étape"') + '>' + esc(suiv.etape.action) + '</button>' : '') + '</span></div></article>';
        }).join('') : '<div class="cvt-vide">Aucune pièce</div>') + '</div></section>';
    }).join('');
  }
  function passer(cle, vers) {
    var C = colonnes(), p = pieces().filter(function (x) { return x.journal + '|' + x.piece === cle; })[0]; if (!p) return;
    var i = C.map(function (c) { return c.etat; }).indexOf(p.etat), j = vers;
    if (j < i) { retourner(cle, j, p, C, i); return; }
    if (p.etat === 'BROUILLON') {
      var vbi = vbIndex(); if (vbi < 0) { toast('Aucune étape n’est marquée « Validation du brouillon » dans Paramètre Circuit.'); return; }
      if (j !== vbi) { toast('Un brouillon ne peut être validé que par l’étape « Validation du brouillon » (' + C[vbi].etape.nom + ').'); return; }
    } else if (j !== i + 1 || !C[j] || !C[j].etape) { toast(j < i ? 'Retour en arrière non prévu par le circuit.' : 'Passage non prévu : respectez l’ordre des étapes.'); return; }
    if (!autorise(C[j].etape)) { toast('Action « ' + C[j].etape.action + ' » réservée aux utilisateurs rattachés à l’étape.'); return; }
    var et = C[j].etape, ck = et.checklist || [];
    if (ck.length || et.cmt) { ouvrirControle(p, C[j], function (res) { appliquer(cle, j, p, res); }); return; }
    appliquer(cle, j, p, null);
  }
  // retour à l'étape précédente : commentaire obligatoire (motif du rejet), historisé
  function retourner(cle, j, p, C, i) {
    if (j !== i - 1) { toast('Le retour se fait vers l’étape précédente uniquement.'); return; }
    if (!C[i].etape) { toast('Cette pièce est à la première étape : aucun retour possible.'); return; }
    if (!autorise(C[i].etape)) { toast('Retour réservé aux utilisateurs rattachés à l’étape « ' + C[i].etape.nom + ' ».'); return; }
    var O = window.FACTURE_OCR; if (!O || !O.fenetre) return;
    var w = O.fenetre('Retour — pièce ' + p.piece, false, 'arrow-back-up', 'Retour à l’étape précédente');
    w.b.innerHTML = '<p style="margin:0 0 10px;font-size:13px;color:#474C58">Pièce <b>' + esc(p.journal + ' — ' + p.piece) + '</b> (' + fmt(p.montant) + ') : renvoi de l’étape <b>' + esc(C[i].etat) + '</b> vers <b>' + esc(C[j].etat) + '</b>.</p><div class="fo-sec" style="margin-top:0">Motif du retour <b style="color:#B63132">*</b></div><textarea class="fo-in" data-rt-c rows="4" maxlength="500" style="width:100%;height:auto;padding:8px" placeholder="Commentaire obligatoire motivant le retour (anomalie constatée, pièce manquante…)"></textarea><div data-rt-e></div>';
    w.f.innerHTML = '<button type="button" data-rt-x>Annuler</button><button type="button" class="p" data-rt-ok>Retourner la pièce</button>';
    w.f.querySelector('[data-rt-x]').addEventListener('click', O.fermer);
    w.f.querySelector('[data-rt-ok]').addEventListener('click', function () {
      var com = w.b.querySelector('[data-rt-c]').value.trim(); if (!com) { w.b.querySelector('[data-rt-e]').innerHTML = '<div class="fo-ko">Le commentaire est obligatoire pour un retour.</div>'; w.b.querySelector('[data-rt-c]').focus(); return; }
      O.fermer(); etats[cle] = C[j].etat; DEMO.forEach(function (x) { if (x.journal + '|' + x.piece === cle) x.etat = C[j].etat; });
      (histo[cle] = histo[cle] || []).push({ etape: C[i].etape.nom, action: 'RETOUR', retour: true, utilisateur: UTIL, date: new Date().toISOString(), points: [], commentaire: com });
      dessiner(); toast('Pièce ' + p.piece + ' renvoyée à l’étape « ' + C[j].etat + ' ».');
    });
    setTimeout(function () { var t = w.b.querySelector('[data-rt-c]'); if (t) t.focus(); }, 50);
  }
  function appliquer(cle, j, p, res) {
    var C = colonnes(); etats[cle] = C[j].etat; DEMO.forEach(function (x) { if (x.journal + '|' + x.piece === cle) x.etat = C[j].etat; });
    if (res) (histo[cle] = histo[cle] || []).push({ etape: C[j].etape.nom, action: C[j].etape.action, utilisateur: UTIL, date: new Date().toISOString(), points: res.points, commentaire: res.commentaire });
    dessiner(); toast('Pièce ' + p.piece + ' : ' + C[j].etape.action.toLowerCase() + ' effectuée → ' + C[j].etat + '.');
  }
  // contrôle avant exécution de l'étape : checklist (points obligatoires à cocher) et commentaire (obligatoire selon le paramétrage)
  function ouvrirControle(p, col, ok) {
    var O = window.FACTURE_OCR, et = col.etape, ck = et.checklist || []; if (!O || !O.fenetre) { ok({ points: [], commentaire: '' }); return; }
    var w = O.fenetre(et.action + ' — pièce ' + p.piece, false, 'checklist', 'Contrôle avant ' + et.action);
    w.b.innerHTML = '<p style="margin:0 0 10px;font-size:13px;color:#474C58">Pièce <b>' + esc(p.journal + ' — ' + p.piece) + '</b> (' + fmt(p.montant) + ') : confirmez les points de contrôle de l’étape « ' + esc(et.nom) + ' » avant de l’exécuter.</p>' +
      (ck.length ? '<div class="fo-sec" style="margin-top:0">Checklist</div><div data-ct-l style="display:grid;gap:6px">' + ck.map(function (c, i) { return '<label style="display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid #E1E5EE;border-radius:8px;cursor:pointer"><input type="checkbox" data-ct="' + i + '" style="margin-top:2px"><span>' + esc(c.lib) + (c.ob ? ' <b style="color:#B63132">*</b>' : ' <em style="color:#7B8190;font-size:12px">(facultatif)</em>') + '</span></label>'; }).join('') + '</div>' : '') +
      '<div class="fo-sec">Commentaire' + (et.cmt ? ' <b style="color:#B63132">*</b>' : '') + '</div><textarea class="fo-in" data-ct-c rows="3" maxlength="500" style="width:100%;height:auto;padding:8px" placeholder="' + (et.cmt ? 'Commentaire obligatoire pour valider cette étape' : 'Commentaire (facultatif)') + '"></textarea><div data-ct-e></div>';
    w.f.innerHTML = '<button type="button" data-ct-x>Annuler</button><button type="button" class="p" data-ct-ok>' + esc(et.action) + '</button>';
    w.f.querySelector('[data-ct-x]').addEventListener('click', O.fermer);
    w.f.querySelector('[data-ct-ok]').addEventListener('click', function () {
      var manque = [], pts = ck.map(function (c, i) { var on = w.b.querySelector('[data-ct="' + i + '"]').checked; if (c.ob && !on) manque.push(c.lib); return { lib: c.lib, ob: !!c.ob, ok: on }; }), com = w.b.querySelector('[data-ct-c]').value.trim(), er = w.b.querySelector('[data-ct-e]');
      if (manque.length) { er.innerHTML = '<div class="fo-ko">Points obligatoires non cochés : ' + manque.map(esc).join(' ; ') + '.</div>'; return; }
      if (et.cmt && !com) { er.innerHTML = '<div class="fo-ko">Le commentaire est obligatoire pour valider cette étape.</div>'; w.b.querySelector('[data-ct-c]').focus(); return; }
      O.fermer(); ok({ points: pts, commentaire: com });

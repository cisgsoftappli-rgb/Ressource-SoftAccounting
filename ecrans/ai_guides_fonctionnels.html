      etapes: [['Ouvrir Assistance comptable AI : consulter le badge d’anomalies, lancer les contrôles, exporter le plan de correction.', ['aicompta', 'Assistance comptable']], ['Ouvrir Assistance financière AI : lire le diagnostic, les ratios et les recommandations.', ['aifin', 'Assistance financière']], ['Utiliser cette assistance pour les guides pas à pas, les rôles et les impacts entre modules.', null]],
      impacts: ['Lecture seule : les assistances ne modifient aucune donnée.'], erreurs: [], l: [['aicompta', 'Assistance comptable'], ['aifin', 'Assistance financière'], ['aifonc', 'Assistance fonctionnelle']] }

  // ---------- structure « modèle de guide » (cf. GUIDE_WORKFLOW) : définition et objectif, importance, paramétrage, utilisation et règles ----------
  // chaque section : t = titre, ecran = écran concerné (chemin et capture), etapes = [verbe en gras, description], nb = note
  G.modele = {
    demarrer: {
      def: ['Dans SoftAccounting, l’administration de l’entité définit ce que l’entité utilise : identité, modules visibles, procédures financières et produit. Elle remplit les fonctions suivantes :', 'Modules activables : chaque module dispose d’un interrupteur ; un module désactivé disparaît du menu latéral.', 'Personnalisation : choix des procédures financières (IDA, FIDA, FED, FM, BAD) et des options de l’entité.', 'Produits : SoftAccounting ou SoftAccounting Entreprise (sans Gestion des contrats ni Comptabilité Projets & Bailleurs).', 'Informations de l’entité : identité, environnement et éditeur affichés dans l’application.'],
      imp: ['Cohérence du menu avec le métier de l’entité : chaque utilisateur ne voit que ce qui lui est utile.', 'Réduction de la complexité et des risques de mauvaise manipulation.', 'Socle de tous les paramétrages ultérieurs (plans, journaux, circuits).'],
      param: [{ t: 'Activation des modules', ecran: 'entite', etapes: [['Ouvrir', 'Administration de l’entité puis l’onglet Modules.'], ['Activer ou désactiver', 'utiliser l’interrupteur de chaque module ; le menu latéral se met à jour immédiatement.'], ['Contrôler', 'vérifier dans le menu que chaque module actif affiche ses sous-menus.']] }, { t: 'Personnalisation des procédures financières', ecran: 'entite', etapes: [['Ouvrir', 'l’onglet Personnalisation.'], ['Cocher', 'les procédures financières utilisées (IDA, FIDA, FED, FM, BAD).'], ['Enregistrer', 'les options : les procédures décochées disparaissent du module Comptabilité Projets & Bailleurs.']] }, { t: 'Choix du produit', ecran: 'entite', etapes: [['Ouvrir', 'le sélecteur de produit en haut à gauche.'], ['Choisir', 'SoftAccounting Entreprise pour masquer Gestion des contrats, Comptabilité Projets & Bailleurs et leurs paramètres.']] }],
      util: [], regles: ['Module désactivé : il n’est plus accessible depuis le menu, mais ses données ne sont pas supprimées.', 'Procédure décochée : elle disparaît du module et des listes de procédures.', 'Produit Entreprise : masque aussi la personnalisation et les écrans réservés aux projets.'] },
    plans: {
      def: ['Les plans définissent la structure des comptes (plan comptable) et des axes d’analyse (activité, budget, financier, géographique, plans libres). Ils remplissent les fonctions suivantes :', 'Codification maîtrisée : chaque niveau a son libellé, son format (numérique, alphabétique, alphanumérique) et sa longueur.', 'Activation : seuls les plans actifs sont proposés à la saisie.', 'Hiérarchie : le code d’un niveau reprend le code du parent plus son segment.', 'Comportements du dernier niveau : analytique obligatoire, racine de compte, tiers.'],
      imp: ['Qualité et comparabilité des données comptables et analytiques.', 'Base des états, des filtres de la liste des écritures et du suivi budgétaire.', 'Le plan financier alimente le budget de la convention ; le plan d’activité alimente l’utilisation de fonds.'],
      param: [{ t: 'Configuration des niveaux d’un plan', ecran: 'plans', etapes: [['Ouvrir', 'Configuration des plans et sélectionner le plan.'], ['Modifier', 'le libellé, l’abréviation et, pour chaque niveau, le libellé, le format de codification et le nombre de caractères.'], ['Enregistrer', 'la configuration.']], nb: 'Pour le plan financier, définir un niveau de type CONVENTION et un niveau de type CATÉGORIE (un seul niveau par type).' }, { t: 'Saisie du plan comptable', ecran: 'pl_comptable', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'le niveau, le code parent, le code (conforme au format) et le libellé.'], ['Définir', 'la racine de compte rattachée et les comportements du dernier niveau.'], ['Enregistrer', 'la ligne : elle apparaît dans la liste.']] }, { t: 'Saisie d’un plan analytique', ecran: 'pl_activite', etapes: [['Ajouter', 'une ligne : niveau, code parent, code, libellé.'], ['Enregistrer', 'puis répéter pour chaque ligne du plan.']] }],
      util: [{ t: 'Utilisation des plans', ecran: 'ecritures', etapes: [['Saisir', 'une écriture : les plans actifs sont proposés par ligne de charge ou de produit.'], ['Filtrer', 'la liste des écritures par intervalle Du / Au sur chaque plan.']] }],
      regles: ['Format : un code qui ne respecte pas le format ou la longueur du niveau est refusé.', 'Plan inactif : non proposé à la saisie ; son intervalle est grisé dans les filtres.', 'Compte désactivé : non proposé mais lisible dans l’historique.'] },
    exercices: {
      def: ['L’exercice comptable est la période pendant laquelle les écritures sont enregistrées. Sa gestion remplit les fonctions suivantes :', 'Ouverture : dates de début et de fin de l’exercice.', 'Exercice en cours : celui qui reçoit les saisies et sert de période par défaut aux états.', 'Clôture : verrouillage de l’exercice et report des soldes à l’exercice suivant.'],
      imp: ['Les écritures sont rattachées au bon exercice (principe de séparation des exercices).', 'Un exercice clôturé n’accepte plus aucune saisie : protection des comptes arrêtés.'],
      param: [{ t: 'Création d’un exercice', ecran: 'exercices', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'l’année, la date de début et la date de fin.'], ['Définir en cours', 'choisir l’exercice qui reçoit les saisies.'], ['Enregistrer', 'l’exercice.']] }],
      util: [{ t: 'Clôture de l’exercice', ecran: 'clotannuelle', etapes: [['Contrôler', 'rapprochements, lettrages et pièces validées.'], ['Générer', 'les à nouveaux (provisoires puis définitifs).'], ['Clôturer', 'l’exercice : le résultat est reporté et l’exercice suivant s’ouvre.']] }],
      regles: ['Date d’écriture : elle doit se situer dans les bornes de l’exercice.', 'Exercice clôturé : plus de saisie ni de modification.'] },
    journaux: {
      def: ['Les journaux regroupent les écritures par nature d’opération (achats, ventes, banque, caisse, opérations diverses). Ils remplissent les fonctions suivantes :', 'Numérotation : automatique (compteur par journal) ou manuelle.', 'Contrepartie par défaut : compte de banque ou de caisse.', 'Utilisateurs autorisés : qui peut saisir dans quel journal.'],
      imp: ['Traçabilité et continuité de la numérotation des pièces.', 'Le type de journal conditionne les lignes proposées à la saisie (échéances, banque).'],
      param: [{ t: 'Création d’un journal', ecran: 'pl_journaux', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'le code, le libellé et le type du journal.'], ['Choisir', 'la numérotation : automatique ou manuelle.'], ['Enregistrer', 'le journal.']] }],
      util: [{ t: 'Utilisation à la saisie', ecran: 'ecritures', etapes: [['Choisir', 'le journal : le numéro de pièce est proposé selon le compteur.']] }],
      regles: ['Numérotation manuelle : le numéro doit être saisi à la pièce, sinon la pièce est refusée.', 'Continuité : toute rupture de numérotation est signalée par l’assistance comptable.'] },
    tiers: {
      def: ['Les tiers sont les clients, fournisseurs et autres correspondants de l’entité. Leur gestion remplit les fonctions suivantes :', 'Fiche tiers : code, libellé, collectif rattaché.', 'Compte auxiliaire : proposé à la saisie avec son compte collectif.', 'Statut « Utilisé » : un tiers mouvementé ne peut plus être supprimé.'],
      imp: ['Fiabilité du suivi des créances et des dettes (lettrage, échéancier).', 'Une fiche unique par tiers évite les doublons et les erreurs de paiement.'],
      param: [{ t: 'Création d’un tiers', ecran: 'pl_tiers', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'le code, le libellé et le compte collectif.'], ['Compléter', 'les informations d’identification et les conditions de règlement.'], ['Enregistrer', 'la fiche.']] }],
      util: [{ t: 'Utilisation à la saisie', ecran: 'ecritures', etapes: [['Choisir', 'le tiers sur la ligne : le collectif et le compte auxiliaire sont proposés.']] }],
      regles: ['Suppression : impossible pour un tiers déjà mouvementé.', 'Unicité : une seule fiche par tiers.'] },
    cours: {
      def: ['La gestion des cours permet de travailler en devises. Elle remplit les fonctions suivantes :', 'Saisie des cours : devise, date, parité (saisie manuelle ou import Excel).', 'Conversion : calcul d’un montant converti à la date voulue.', 'Contrôle du cours appliqué : comparaison du taux de chaque écriture au cours officiel (seuil ± 3 % par défaut).'],
      imp: ['Exactitude des montants en devises dans les écritures, la caisse et les immobilisations.', 'Détection des écarts de change anormaux avant la clôture.'],
      param: [{ t: 'Activation des devises', ecran: 'devise', etapes: [['Ouvrir', 'Devises et activer les devises utilisées.']] }, { t: 'Saisie des cours', ecran: 'cours', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'la devise, la date et la parité.'], ['Importer', 'un fichier Excel (colonnes Devise, Date, Parité) pour saisir plusieurs cours.'], ['Enregistrer', 'les cours.']] }],
      util: [{ t: 'Conversion', ecran: 'conversion', etapes: [['Choisir', 'la devise, la date et le montant.'], ['Convertir', 'lire le montant converti.']] }, { t: 'Contrôle du cours appliqué', ecran: 'coursapplique', etapes: [['Renseigner', 'l’exercice, la période, le journal et le seuil de tolérance.'], ['Lancer le contrôle', 'cliquer sur « Lancer le contrôle ».'], ['Lire', 'les anomalies (écart au-dessus du seuil) et les lignes « Sans cours ».']] }],
      regles: ['Cours manquant : la ligne est classée « Sans cours ».', 'Écart supérieur au seuil : signalé en anomalie.'] },
    saisie: {
      def: ['La saisie d’écritures enregistre les pièces comptables. Elle remplit les fonctions suivantes :', 'Saisie par journal : date d’écriture, date de pièce, numéro automatique ou manuel.', 'Lignes complètes : compte, tiers, montant, échéance, mode de règlement, axes analytiques.', 'Aides à la saisie : modèles d’écriture, import d’écritures, facture OCR / SoftDocs.', 'Contrôles à l’enregistrement : équilibre débit = crédit, période, axes obligatoires.'],
      imp: ['Fiabilité de la comptabilité : une pièce déséquilibrée ne peut pas être enregistrée.', 'Alimentation de tous les états (balances, grands livres, états financiers).', 'Traçabilité : chaque pièce est numérotée, datée et rattachée à un journal.'],
      param: [{ t: 'Prérequis de paramétrage', ecran: 'pl_journaux', etapes: [['Journaux', 'créer le journal et choisir sa numérotation.'], ['Plans', 'activer les plans analytiques utiles dans Configuration des plans.'], ['Tiers', 'créer les tiers avec leur collectif.'], ['Cours', 'saisir les cours si des devises sont utilisées.']] }],
      util: [{ t: 'Saisie d’une pièce', ecran: 'ecritures', etapes: [['Choisir', 'le journal, la date d’écriture, la date de pièce et le numéro (automatique ou manuel).'], ['Ajouter les lignes', 'compte, tiers (collectif + auxiliaire), libellé, sens et montant ; en devise, le montant converti est calculé avec le cours.'], ['Renseigner', 'l’échéance et le mode de règlement des lignes de tiers.'], ['Compléter les axes', 'analytiques exigés par le compte (activité, budget, financier, géographique).'], ['Gagner du temps', 'appliquer un modèle d’écriture, importer des écritures ou partir d’une facture OCR / SoftDocs.'], ['Enregistrer', 'vérifier Débit = Crédit puis cliquer sur « Enregistrer la pièce » : la pièce reçoit son numéro.']], nb: 'Pour corriger une erreur, contrepasser par une écriture inverse traçable plutôt que supprimer.' }, { t: 'Consultation et impression', ecran: 'listeecritures', etapes: [['Filtrer', 'ouvrir « Filtres » : entête, traitement, plans, informations libres.'], ['Lire', 'le tableau des résultats (filtre et tri par colonne).'], ['Imprimer', 'cocher les lignes puis « Imprimer la fiche d’imputation » ; choisir les signataires.']] }],
      regles: ['Équilibre : Débit = Crédit, sinon l’enregistrement est refusé.', 'Période : une date hors exercice ou en période clôturée est refusée.', 'Axes : un axe analytique obligatoire manquant bloque l’enregistrement.', 'Numérotation manuelle : le numéro de pièce doit être saisi.'] },
    liste: {
      def: ['La liste des écritures permet de retrouver des lignes selon de nombreux critères. Elle remplit les fonctions suivantes :', 'Filtres en fenêtre : entête, traitement (lettrage, rapprochement, validation), plans, informations libres.', 'Résultats : tableau avec filtre et tri par colonne, totaux débit et crédit.', 'Impression : fiche d’imputation avec choix des signataires, export PDF et Excel.'],
      imp: ['Gain de temps pour retrouver et justifier une écriture.', 'Support des contrôles et des audits (lettrage, validation, rapprochement visibles).'],
      param: [],
      util: [{ t: 'Recherche et impression', ecran: 'listeecritures', etapes: [['Filtrer', 'cliquer sur « Filtres » et renseigner les critères utiles.'], ['Rechercher', 'lancer : les lignes s’affichent dans le tableau.'], ['Sélectionner', 'cocher les lignes à imprimer.'], ['Imprimer', 'cliquer sur « Imprimer la fiche d’imputation » puis choisir les signataires.'], ['Exporter', 'PDF ou Excel.']] }],
      regles: ['Lecture seule : aucune donnée n’est modifiée.', 'Plans inactifs : leurs intervalles sont grisés.'] },
    lettrage: {
      def: ['Le lettrage associe les factures et règlements d’un même tiers. Il remplit les fonctions suivantes :', 'Paramètre : comptes lettrables et tolérance d’écart.', 'Lettrage manuel et automatique : rapprochement des lignes dont le solde est nul.', 'Prélettrage : regroupement provisoire avant lettrage définitif.', 'Délettrage : correction d’une erreur de lettrage.'],
      imp: ['Suivi fiable des créances et des dettes (impayés, échéancier).', 'Les lettres apparaissent dans les grands livres et la liste des écritures.'],
      param: [{ t: 'Paramétrage du lettrage', ecran: 'lettparam', etapes: [['Ouvrir', 'Lettrage › Paramètre.'], ['Définir', 'les comptes lettrables et la tolérance d’écart.'], ['Enregistrer', 'le paramétrage.']] }],
      util: [{ t: 'Lettrage manuel', ecran: 'lettmanuel', etapes: [['Choisir', 'le compte et le tiers : les lignes non lettrées s’affichent.'], ['Cocher', 'les lignes à rapprocher : le solde sélectionné doit être nul.'], ['Lettrer', 'cliquer sur « Lettrer » (ou « Lettrage automatique » pour une proposition).'], ['Délettrer', 'en cas d’erreur, sélectionner la lettre puis « Délettrer ».']] }, { t: 'Prélettrage', ecran: 'prelettrage', etapes: [['Sélectionner', 'les lignes à regrouper.'], ['Prélettrer', 'cliquer sur « Prélettrer » ; « Annuler le prélettrage » pour revenir en arrière.']] }],
      regles: ['Solde : les lignes lettrées ensemble doivent s’équilibrer (ou l’écart de règlement être accepté).', 'Tiers : on ne lettre que des lignes d’un même tiers.'] },
    rappro: {
      def: ['Le rapprochement bancaire fait correspondre le relevé de la banque et les écritures de banque. Il remplit les fonctions suivantes :', 'Configuration par compte bancaire : banque et signataires.', 'Pointage : proposition automatique et pointage manuel des lignes.', 'Génération des écritures : à partir des lignes du relevé sans écriture (agios, frais).', 'Situation : solde livres, mouvements non passés, solde du relevé, solde corrigé.'],
      imp: ['Fiabilité de la trésorerie et détection des erreurs ou fraudes.', 'Justification de l’écart entre le solde comptable et le solde bancaire.'],
      param: [{ t: 'Configuration d’un compte bancaire', ecran: 'rapprochement', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'le compte bancaire, la banque et les signataires.'], ['Enregistrer', 'la configuration.']] }],
      util: [{ t: 'Pointage du relevé', ecran: 'releves', etapes: [['Importer', 'le relevé (ou saisir ses lignes) depuis la liste des relevés.'], ['Proposer automatiquement', 'les lignes de même montant sont rapprochées.'], ['Pointer', 'manuellement les lignes restantes : le total des lignes cochées doit être égal de part et d’autre.'], ['Générer les écritures', 'cocher les lignes sans écriture, vérifier la contrepartie proposée puis générer.'], ['Valider', 'cliquer sur « Valider le rapprochement ».']] }, { t: 'Situation du rapprochement', ecran: 'situation', etapes: [['Choisir', 'le compte bancaire et le relevé.'], ['Lire', 'le solde dans les livres, les mouvements non passés et le solde corrigé.']] }],
      regles: ['Égalité : la somme des lignes cochées doit être égale de part et d’autre pour valider.', 'Écart : toute ligne de relevé sans écriture est à justifier.', 'Éléments anciens : à apurer rapidement.'] },
    circuit: {
      def: ['Dans SoftAccounting, le circuit de validation (ou chaîne de traitement) est un mécanisme séquentiel paramétrable qui encadre le parcours d’une pièce comptable. Il remplit les fonctions suivantes :', 'Circuits de validation sur mesure : étapes successives obligatoires (ex. : Saisi ➔ Contrôlé ➔ Approuvé ➔ Validé).', 'Habilitations par étape : seuls les utilisateurs autorisés à une étape peuvent faire évoluer le statut.', 'Verrous de sécurité : modification ou suppression bloquées dès qu’une étape paramétrée est franchie.', 'Check-lists de contrôle : chaque point doit être confirmé avant la transition (points obligatoires bloquants).', 'Commentaire obligatoire : justification exigée à la validation, selon l’étape.'],
      imp: ['Contrôle interne et séparation des fonctions : celui qui saisit n’est pas celui qui valide.', 'Réduction des risques d’erreur et de fraude : pas de saut d’étape, pas de modification d’une pièce validée.', 'Traçabilité : chaque passage d’étape est historisé (utilisateur, date, réponses, commentaire).'],
      param: [{ t: 'Paramétrage d’une étape du circuit', ecran: 'circparam', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner la saisie', 'le Numéro est attribué automatiquement ; saisir le Nom de l’étape (ex. : VALIDATION), l’État atteint (ex. : VALIDE) et l’Action proposée (ex. : VALIDER).'], ['Définir les verrous', 'cocher Modification impossible et/ou Suppression impossible.'], ['Rattacher les utilisateurs', 'dans le panneau Utilisateur(s), cocher les utilisateurs habilités à exécuter l’étape.'], ['Construire la check-list', 'dans la carte Checklist de l’étape, cliquer sur « + Ajouter un point » puis saisir le libellé et cocher Obligatoire si le point est bloquant.'], ['Exiger un commentaire', 'cocher « Commentaire obligatoire à la validation » si nécessaire.'], ['Enregistrer', 'cliquer sur Enregistrer pour valider l’étape.']], nb: 'Répéter l’opération pour chaque étape du circuit (contrôle, approbation, validation…), en respectant l’ordre de passage souhaité.' }],
      util: [{ t: 'Traitement des pièces', ecran: 'circtrait', etapes: [['Filtrer', 'sélectionner le site et la période puis rechercher.'], ['Lire le tableau', 'chaque colonne correspond à une étape du circuit et indique le nombre de pièces qu’elle contient.'], ['Faire avancer', 'ouvrir l’étape suivante d’une pièce : la fenêtre de contrôle s’ouvre.'], ['Répondre à la check-list', 'cocher chaque point (les points obligatoires doivent être cochés) et saisir le commentaire si exigé.'], ['Valider', 'cliquer sur Valider : la pièce passe à l’étape suivante.']], nb: 'L’historique de chaque pièce est affiché sur sa carte (étape, utilisateur, date, réponses).' }],
      regles: ['Habilitations : seuls les utilisateurs rattachés à une étape peuvent y faire passer une pièce.', 'Verrous : une pièce ayant franchi une étape « Modification impossible » ou « Suppression impossible » ne peut plus être modifiée ou supprimée.', 'Points obligatoires : ils doivent être cochés pour poursuivre.', 'Traçabilité : chaque passage d’étape est historisé.'] },
    caisse: {
      def: ['La petite caisse gère les mouvements d’espèces par lot. Elle remplit les fonctions suivantes :', 'Types d’opération : compte général, sens, imputation analytique éventuelle.', 'Modèles de pièce de caisse : import Word / RTF avec champs dynamiques pour l’impression.', 'Lots : numéro unique, journal, compte, devise, solde initial et opérations.', 'PV de caisse : billetage, écart justifié, deux signataires.', 'Génération des écritures comptables du lot.'],
      imp: ['Maîtrise de la caisse : pas de solde négatif ni de dépense sans justificatif.', 'Inventaire physique documenté par le PV validé.', 'Écritures générées automatiquement et cohérentes avec la caisse.'],
      param: [{ t: 'Types d’opération', ecran: 'caissetypes', etapes: [['Ajouter', 'cliquer sur le bouton Ajouter.'], ['Renseigner', 'le libellé, le sens, le compte général et, si nécessaire, l’imputation analytique.'], ['Enregistrer', 'le type.']] }, { t: 'Modèles de pièce de caisse', ecran: 'caissemodeles', etapes: [['Nouveau modèle', 'ou importer un modèle Word / RTF.'], ['Insérer', 'les champs dynamiques (double-clic) dans la zone de conception.'], ['Aperçu', 'contrôler le rendu avec des données d’exemple.'], ['Enregistrer', 'le modèle, éventuellement défini par défaut.']] }],
      util: [{ t: 'Saisie d’un lot', ecran: 'caissesaisie', etapes: [['Ajouter', 'un lot : numéro, journal, compte, devise, solde initial.'], ['Ajouter des opérations', 'type, date, montant, libellé, pièce.'], ['Imprimer', 'la pièce de caisse d’une opération avec le modèle choisi.'], ['Fermer le lot', 'il n’est plus modifiable et ouvre le PV de caisse.']] }, { t: 'PV de caisse', ecran: 'pvcaisse', etapes: [['Renseigner', 'le billetage par valeur.'], ['Justifier', 'l’écart (excédent ou manquant).'], ['Choisir', 'deux signataires différents.'], ['Valider', 'le PV : il est verrouillé.']] }, { t: 'Génération des écritures', ecran: 'caissegen', etapes: [['Proposer le schéma comptable', 'contrôler les écritures proposées.'], ['Générer', 'les écritures rejoignent la saisie.']] }],
      regles: ['Lot fermé : plus de modification ni d’ajout d’opération.', 'Signataires : le signataire 1 et le signataire 2 doivent être différents.', 'Écart de caisse : justification obligatoire.'] },
    clotures: {
      def: ['Les travaux périodiques figent les périodes après contrôle. Ils remplissent les fonctions suivantes :', 'Clôture mensuelle et périodique : verrouillage d’une période.', 'À nouveau et à nouveau analytique : report des soldes à l’exercice suivant.', 'Clôture annuelle : arrêt de l’exercice et reprise du résultat.'],

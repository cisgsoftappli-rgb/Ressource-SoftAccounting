<!--
  Écran « Paramétrages › Administration › Nettoyages » : purge définitive de données (écritures, immobilisations, à-nouveaux, contrats, journal de trace, plan des tiers), filtrable par site et exercice, protégée par le mot de passe PURGE.
  Sélection des tables à purger (cases à cocher), bouton « Lancer la purge (N) » avec confirmation. Données de démonstration en mémoire.
-->
<style>
.nt{color:#0B1332}
.nt-hd{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 16px}
.nt-hd h1{margin:0;font-size:20px;font-weight:700}
.nt-act{display:flex;align-items:center;gap:12px}
.nt-warn{display:inline-flex;align-items:center;gap:8px;border:1px solid #F6C6CC;background:#FDECEE;color:#C0182B;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.nt-go{height:36px;border:0;border-radius:8px;background:#2E427B;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:0 16px;cursor:pointer}
.nt-go[disabled]{opacity:.45;cursor:not-allowed}
.nt-card{background:#fff;border:1px solid #E9EBF0;border-radius:12px;overflow:hidden}
.nt-ch{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #E9EBF0;font-size:15px;font-weight:700}
.nt-ch i{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#EEF1FA;color:#2E427B;font-size:16px}
.nt-t{width:100%;border-collapse:collapse;font-size:13px}
.nt-t th{background:#F5F7F9;border-bottom:1px solid #E9EBF0;padding:11px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B606D;white-space:nowrap}
.nt-t td{padding:11px 14px;border-bottom:1px solid #EEF0F4;background:#fff}
.nt-t tbody tr:hover td{background:#F5F7F9}
.nt-t .c{width:44px;text-align:center}.nt-t .a{text-align:right;width:140px}
.nt-t .n{text-align:right}
.nt-ov{position:fixed;inset:0;background:rgba(11,19,50,.45);display:none;align-items:center;justify-content:center;z-index:50}
.nt-ov.on{display:flex}
.nt-m{background:#fff;border-radius:12px;width:460px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.nt-m h3{margin:0;padding:16px 20px;border-bottom:1px solid #E9EBF0;font-size:16px}
.nt-m p{margin:0;padding:16px 20px;font-size:13px;line-height:1.5}
.nt-m footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #E9EBF0}
.nt-b{height:34px;border-radius:8px;border:1px solid #878D9A;background:#fff;color:#0B1332;font:inherit;font-size:13px;font-weight:600;padding:0 14px;cursor:pointer}
.nt-b.p{background:#C0182B;border-color:#C0182B;color:#fff}
.nt-fl{display:flex;gap:16px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid #E9EBF0;background:#F5F7F9}.nt-fl label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#5B606D}.nt-fl input[type=date]{height:36px;min-width:160px;border:1px solid #C8CCD6;border-radius:8px;background:#fff;font:inherit;font-size:13px;padding:0 10px;color:#0B1332}.nt-fl input.bad{border-color:#C0182B}.nt-pe{align-self:flex-end;font-size:12px;color:#C0182B;min-height:36px;display:flex;align-items:center}
.nt-fl select{height:36px;min-width:220px;border:1px solid #C8CCD6;border-radius:8px;background:#fff;font:inherit;font-size:13px;padding:0 10px;color:#0B1332}
.nt-pw{margin:0 20px 16px!important;padding:0!important}.nt-pw input{width:100%;height:36px;border:1px solid #C8CCD6;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;margin-top:6px;box-sizing:border-box}.nt-pw .er{color:#C0182B;font-size:12px;margin-top:4px;display:none}
.nt-ok{margin:12px 18px 0;padding:10px 14px;border-radius:8px;background:#E7F6EC;color:#136C34;font-size:13px;display:none}
</style>
<div class="nt" data-nt>
  <div class="nt-hd">
    <h1>Nettoyages des données</h1>
    <div class="nt-act">
      <span class="nt-warn"><i class="ti ti-alert-circle"></i> La purge est irréversible.</span>
      <button type="button" class="nt-go" data-nt-go disabled>Lancer la purge (0)</button>
    </div>
  </div>
  <div class="nt-card">
    <div class="nt-ch"><i class="ti ti-database-x"></i> Sélection des données à purger</div>
    <div class="nt-fl"><label>Site<select data-nt-site><option value="">Tous les sites</option><option>Siège — Antananarivo</option><option>Agence Toamasina</option><option>Agence Mahajanga</option></select></label><label>Exercice<select data-nt-ex><option value="">Tous les exercices</option><option>2026</option><option>2025</option><option>2024</option><option>2023</option></select></label><label>Période — début<input type="date" data-nt-du></label><label>Période — fin<input type="date" data-nt-au></label><span class="nt-pe" data-nt-pe></span></div>
    <div class="nt-ok" data-nt-ok></div>
    <table class="nt-t" data-pg-min="360">
      <thead><tr><th class="c"><input type="checkbox" data-nt-all aria-label="Tout sélectionner"></th><th>Données</th><th class="n">Lignes</th><th>Description</th><th class="a">Actions</th></tr></thead>
      <tbody data-nt-body></tbody>
    </table>
  </div>
  <div class="nt-ov" data-nt-ov>
    <div class="nt-m" role="dialog" aria-modal="true">
      <h3>Confirmer la purge</h3>
      <p class="nt-pw" style="padding-top:16px!important"><label><input type="password" data-nt-pw autocomplete="off" placeholder="Mot de passe" aria-label="Mot de passe"></label><span class="er" data-nt-er>Mot de passe incorrect.</span></p>
      <footer><button type="button" class="nt-b" data-nt-no>Annuler</button><button type="button" class="nt-b p" data-nt-yes>Purger définitivement</button></footer>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.querySelector('[data-nt]'); if (!root) return;
  var B = [
    ['Écritures comptables', 48620, 'Pièces et lignes d’écritures comptables', 1, 1],
    ['Immobilisations', 1240, 'Fiches d’immobilisation et plans d’amortissement', 1, 1],
    ['À nouveaux', 3180, 'Écritures de report à nouveau', 1, 1],
    ['Contrats', 215, 'Contrats, avenants et imputations', 1, 1],
    ['Journal de trace', 69865, 'Traces de manipulation, connexion, export et impression', 1, 1],
    ['Plan des tiers', 860, 'Tiers (clients, fournisseurs, collaborateurs) — non liés à un exercice', 1, 0]
  ];
  var SF = { 'Siège — Antananarivo': .6, 'Agence Toamasina': .25, 'Agence Mahajanga': .15 }, EF = { '2026': .35, '2025': .3, '2024': .2, '2023': .15 };
  var purge = {}, T = [];
  var fs_ = root.querySelector('[data-nt-site]'), fe_ = root.querySelector('[data-nt-ex]');
  var du_ = root.querySelector('[data-nt-du]'), au_ = root.querySelector('[data-nt-au]'), pe_ = root.querySelector('[data-nt-pe]');
  function jours(a, b) { return Math.max(0, Math.round((b - a) / 864e5) + 1); }
  function pfact() {
    var e1 = fe_.value, d = du_.value, a = au_.value; pe_.textContent = ''; du_.classList.remove('bad'); au_.classList.remove('bad');
    if (!d && !a) return 1;
    if (d && a && d > a) { pe_.textContent = 'La date de début doit précéder la date de fin.'; du_.classList.add('bad'); au_.classList.add('bad'); return null; }
    var m0 = new Date(e1 ? e1 + '-01-01' : '2023-01-01'), m1 = new Date(e1 ? e1 + '-12-31' : '2026-12-31'), x0 = d ? new Date(d) : m0, x1 = a ? new Date(a) : m1;
    var o0 = x0 > m0 ? x0 : m0, o1 = x1 < m1 ? x1 : m1;
    return o1 < o0 ? 0 : jours(o0, o1) / jours(m0, m1);
  }
  function pkey() { return du_.value + '>' + au_.value; }
  function calc() {
    var s1 = fs_.value, e1 = fe_.value, pf = pfact(); if (pf === null) pf = 0;
    T = B.map(function (b) { var r = b[1] * (s1 ? SF[s1] : 1) * (e1 && b[4] ? EF[e1] : 1) * (b[4] ? pf : 1); return [b[0], Math.max(0, Math.round(r) - (purge[b[0] + '|' + s1 + '|' + (b[4] ? e1 + '|' + pkey() : '')] || 0)), b[2]]; });
  }
  var sel = {}, body = root.querySelector('[data-nt-body]'), go = root.querySelector('[data-nt-go]'),
    ov = root.querySelector('[data-nt-ov]'), ok = root.querySelector('[data-nt-ok]'), all = root.querySelector('[data-nt-all]'), pending = null, pw = root.querySelector('[data-nt-pw]'), er = root.querySelector('[data-nt-er]');
  function nf(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function key(t) { var b = B.filter(function (x) { return x[0] === t[0]; })[0]; return t[0] + '|' + fs_.value + '|' + (b[4] ? fe_.value + '|' + pkey() : ''); }
  function count() { return T.filter(function (t) { return sel[t[0]]; }).length; }
  function draw() {
    calc(); [].forEach.call(Object.keys(sel), function (k) { });
    body.innerHTML = T.map(function (t, i) {
      return '<tr><td class="c"><input type="checkbox" data-nt-i="' + i + '"' + (sel[t[0]] ? ' checked' : '') + '></td><td>' + t[0] + '</td><td class="n">' + nf(t[1]) + '</td><td>' + t[2] + '</td><td class="a"><button type="button" class="nt-b" data-nt-one="' + i + '">Purger</button></td></tr>';
    }).join('');
    var n = count(); go.textContent = 'Lancer la purge (' + n + ')'; go.disabled = !n; all.checked = n === T.length && n > 0;
  }
  function ask(list) {
    if (pfact() === null) return;
    pending = list;
    var l = list.reduce(function (s, t) { return s + t[1]; }, 0);
    var _m =  'Vous allez supprimer définitivement ' + nf(l) + ' ligne(s) : ' + list.map(function (t) { return t[0]; }).join(', ') + ' — ' + (fs_.value || 'tous les sites') + ', ' + (fe_.value ? 'exercice ' + fe_.value : 'tous les exercices') + '. Cette action est irréversible.';
    pw.value = ''; er.style.display = 'none';
    ov.classList.add('on');
  }
  body.addEventListener('change', function (e) { var i = e.target.getAttribute('data-nt-i'); if (i === null) return; sel[T[i][0]] = e.target.checked; draw(); });
  body.addEventListener('click', function (e) { var b = e.target.closest('[data-nt-one]'); if (b) ask([T[+b.getAttribute('data-nt-one')]]); });
  all.addEventListener('change', function () { T.forEach(function (t) { sel[t[0]] = all.checked; }); draw(); });
  go.addEventListener('click', function () { ask(T.filter(function (t) { return sel[t[0]]; })); });
  root.querySelector('[data-nt-no]').addEventListener('click', function () { ov.classList.remove('on'); pending = null; });
  root.querySelector('[data-nt-yes]').addEventListener('click', function () {
    if (!pending) return;
    if (pw.value !== 'PURGE') { er.style.display = 'block'; pw.focus(); return; }
    var noms = pending.map(function (t) { return t[0]; });
    pending.forEach(function (t) { var b = B.filter(function (x) { return x[0] === t[0]; })[0], k = key(t); purge[k] = (purge[k] || 0) + t[1]; delete sel[t[0]]; });
    ov.classList.remove('on'); pending = null;
    ok.textContent = noms.length + ' jeu(x) de données purgé(s) définitivement (' + noms.join(', ') + ').'; ok.style.display = 'block'; draw();
  });
  fs_.addEventListener('change', function () { sel = {}; draw(); }); fe_.addEventListener('change', function () { sel = {}; draw(); });
  du_.addEventListener('change', function () { sel = {}; draw(); }); au_.addEventListener('change', function () { sel = {}; draw(); });
  draw();
})();
</script>

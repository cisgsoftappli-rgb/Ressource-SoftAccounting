<app-personnalisation-entite>
<!--
  Administration de l'entité › onglet « Personnalisation » : paramètres propres à l'entité (référentiel comptable, checklist de clôture, gestion des devis programmes,
  monnaies locale et devises 1 à 3). Les champs sont les mêmes qu'auparavant dans « Informations générales » (scripts ENTITE_OPTIONS dans informations_generales.html).
  Réutilise les styles ig-* de informations_generales.html.
-->
<div class="ig-wrap">
<div class="ig-card"><div class="ig-bd">
<div class="ig-sec"><span class="ig-t">Comptabilité</span><div class="ig-g">
<div class="ig-f ig-s4" style="align-self:end"><label class="ig-l" style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0"><input type="checkbox" data-ig-checklist checked style="width:16px;height:16px;accent-color:#2E427B"> Checklist clôture d'exercice</label></div>
<div class="ig-f ig-s4" style="align-self:end"><label class="ig-l" style="display:flex;align-items:center;gap:10px;cursor:pointer;text-transform:none;letter-spacing:0"><span class="ig-sw"><input type="checkbox" role="switch" aria-label="Activer la gestion des devis programmes" data-ig-gestiondp></span> Gestion des devis programmes</label><span hidden style="display:none" data-ig-gestiondp-l>Désactivée : le champ DP n'apparaît pas dans la saisie des écritures.</span></div>
</div></div>
<div class="ig-sec"><span class="ig-t">Monnaies</span>
<div class="ig-g">
<div class="ig-f ig-s4"><label class="ig-l">Monnaie de tenue de compte (M1) <b style="color:#B63132">*</b></label><select class="form-input ig-in" data-mon="m1"></select></div>
<div class="ig-f ig-s4"><label class="ig-l">Monnaie de reporting 2 (M2)</label><select class="form-input ig-in" data-mon="m2"></select></div>
<div class="ig-f ig-s4"><label class="ig-l">Monnaie de reporting 3 (M3)</label><select class="form-input ig-in" data-mon="m3"></select></div>
</div>
<span data-mon-msg role="status" style="display:block;margin-top:6px;font-size:12px;color:#B63132;min-height:16px"></span>
</div>
<div class="ig-sec"><span class="ig-t">Procédures financières</span><div class="ig-g">
<div class="ig-f" style="grid-column:1/-1"><label class="ig-l">Procédures financières activées</label>
<div class="ig-procs" data-ig-procs><label class="ig-pr"><span class="ig-sw"><input type="checkbox" role="switch" data-ig-proc="IDA" aria-label="Activer la procédure IDA"></span> IDA</label><label class="ig-pr"><span class="ig-sw"><input type="checkbox" role="switch" data-ig-proc="FIDA" aria-label="Activer la procédure FIDA"></span> FIDA</label><label class="ig-pr"><span class="ig-sw"><input type="checkbox" role="switch" data-ig-proc="FED" aria-label="Activer la procédure FED"></span> FED</label><label class="ig-pr"><span class="ig-sw"><input type="checkbox" role="switch" data-ig-proc="FM" aria-label="Activer la procédure FM"></span> FM</label><label class="ig-pr"><span class="ig-sw"><input type="checkbox" role="switch" data-ig-proc="BAD" aria-label="Activer la procédure BAD"></span> BAD</label></div>
</div>
</div></div>
</div>
<div class="ig-ft"><button type="button" class="ig-bt">Annuler</button><button type="button" class="ig-bt ig-ok">Enregistrer</button></div>
</div></div>
</app-personnalisation-entite>
<script>(function(){var c=document.querySelector("[data-ig-checklist]");if(!c)return;window.ENTITE_OPTIONS=window.ENTITE_OPTIONS||{checklistCloture:true};try{var sv=localStorage.getItem("softcompta.checklistCloture");if(sv!==null)window.ENTITE_OPTIONS.checklistCloture=sv==="1";}catch(e){}c.checked=!!window.ENTITE_OPTIONS.checklistCloture;c.addEventListener("change",function(){window.ENTITE_OPTIONS.checklistCloture=c.checked;try{localStorage.setItem("softcompta.checklistCloture",c.checked?"1":"0");}catch(e){}window.dispatchEvent(new Event("entite-options-changed"));});})();</script>

<script>(function(){var b=document.querySelector("[data-ig-gestiondp]");if(!b)return;var l=document.querySelector("[data-ig-gestiondp-l]");window.ENTITE_OPTIONS=window.ENTITE_OPTIONS||{checklistCloture:true};try{var sv=localStorage.getItem("softcompta.gestionDP");window.ENTITE_OPTIONS.gestionDP=sv==="1";}catch(e){window.ENTITE_OPTIONS.gestionDP=false;}
function maj(){var a=!!window.ENTITE_OPTIONS.gestionDP;document.documentElement.classList.toggle("sans-dp",!a);if(!a&&location.hash==="#dp")location.hash="#entite";b.checked=a;l.textContent=a?"Activée : le champ DP est proposé dans la saisie des écritures et les états.":"Désactivée : le champ DP n'apparaît pas dans la saisie des écritures.";}
b.addEventListener("change",function(){window.ENTITE_OPTIONS.gestionDP=b.checked;try{localStorage.setItem("softcompta.gestionDP",window.ENTITE_OPTIONS.gestionDP?"1":"0");}catch(e){}maj();window.dispatchEvent(new Event("entite-options-changed"));});maj();})();</script>
<style>.ig-procs{display:flex;flex-wrap:wrap;gap:10px 28px;padding:6px 0}.ig-pr{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#0B1332;cursor:pointer}
html.sans-proc-IDA [data-proc="IDA"]{display:none!important}html.sans-proc-FIDA [data-proc="FIDA"]{display:none!important}html.sans-proc-FED [data-proc="FED"]{display:none!important}html.sans-proc-FM [data-proc="FM"]{display:none!important}html.sans-proc-BAD [data-proc="BAD"]{display:none!important}</style>
<script>(function(){var cs=[].slice.call(document.querySelectorAll("[data-ig-proc]"));if(!cs.length)return;var L=["IDA","FIDA","FED","FM","BAD"];window.ENTITE_OPTIONS=window.ENTITE_OPTIONS||{checklistCloture:true};
var o={IDA:true,FIDA:true,FED:false,FM:false,BAD:false};try{var sv=JSON.parse(localStorage.getItem("softcompta.procedures")||"null");if(sv&&typeof sv==="object")L.forEach(function(p){if(typeof sv[p]==="boolean")o[p]=sv[p];});}catch(e){}
window.ENTITE_OPTIONS.procedures=o;window.PROCEDURES_ACTIVES=function(){return L.filter(function(p){return o[p];});};
function maj(){cs.forEach(function(c){c.checked=!!o[c.getAttribute("data-ig-proc")];});L.forEach(function(p){document.documentElement.classList.toggle("sans-proc-"+p,!o[p]);});}
cs.forEach(function(c){c.addEventListener("change",function(){o[c.getAttribute("data-ig-proc")]=c.checked;try{localStorage.setItem("softcompta.procedures",JSON.stringify(o));}catch(e){}maj();window.dispatchEvent(new Event("entite-options-changed"));});});maj();})();</script>

<script>(function(){
  var LS='softcompta.monnaies', d={m1:'MGA',m2:'USD',m3:'',cours2:'jour',cours3:'jour'};
  try{var sv=JSON.parse(localStorage.getItem(LS)||'null'); if(sv&&typeof sv==='object') Object.keys(d).forEach(function(k){ if(typeof sv[k]==='string') d[k]=sv[k]; });}catch(e){}
  window.ENTITE_OPTIONS=window.ENTITE_OPTIONS||{checklistCloture:true}; window.ENTITE_OPTIONS.monnaies=d;
  // monnaies de la comptabilité : M1 tenue de compte, M2 / M3 reporting (lues par la saisie d'écritures, les états et les journaux)
  window.ENTITE_MONNAIES=function(){ return {m1:d.m1,m2:d.m2,m3:d.m3,cours2:d.cours2,cours3:d.cours3,codes:[d.m1,d.m2,d.m3].filter(Boolean)}; };
  var S={}; [].forEach.call(document.querySelectorAll('app-personnalisation-entite [data-mon]'),function(s){ S[s.getAttribute('data-mon')]=s; });
  if(!S.m1) return;
  function liste(){ var L=(window.DEVISES||[]).filter(function(x){return x.actif!==false;}); if(!L.length) L=[{code:'MGA',libelle:'Ariary'},{code:'USD',libelle:'Dollar américain'},{code:'EUR',libelle:'Euro'}]; return L; }
  function remplir(){
    ['m1','m2','m3'].forEach(function(k){ var s=S[k], o=(k==='m1'?'':'<option value="">-- Aucune --</option>'); liste().forEach(function(x){ o+='<option value="'+x.code+'">'+x.code+' — '+(x.libelle||'')+'</option>'; }); s.innerHTML=o; s.value=d[k]; });
    S.m3.disabled=!d.m2;
    S.m1.title='Monnaie légale de la comptabilité : non modifiable une fois des écritures saisies.';
  }
  function msg(t){ var m=document.querySelector('[data-mon-msg]'); if(m) m.textContent=t||''; }
  [].forEach.call(Object.keys(S),function(k){ S[k].addEventListener('change',function(){
    var v=S[k].value, n={m1:d.m1,m2:d.m2,m3:d.m3};
    if(k==='m1'||k==='m2'||k==='m3'){ n[k]=v; if(!n.m2) n.m3='';
      if((n.m2&&n.m2===n.m1)||(n.m3&&(n.m3===n.m1||n.m3===n.m2))){ msg('Les monnaies M1, M2 et M3 doivent être différentes.'); remplir(); return; } d.m1=n.m1; d.m2=n.m2; d.m3=n.m3; }
    else d[k]=v;
    msg(''); try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){} remplir(); window.dispatchEvent(new Event('entite-options-changed')); }); });
  window.addEventListener('devises-changed',remplir); window.addEventListener('journaux-changed',remplir); remplir();
})();</script>

  (champ / ancienne valeur / nouvelle valeur). Un DICTIONNAIRE traduit les termes techniques des logs (champs, entités, actions, types)
  en libellés lisibles et formate les valeurs (montants, dates, oui/non, valeurs codées). Le dictionnaire est modifiable (bouton « Dictionnaire »)

    else { L.module = 'Paramétrages'; L.entite = 'Pays'; L.type = 'Parametrage'; L.ref = pick(['Madagascar', 'France', 'Belgique']); L.action = 'Update'; L.champs = [['Libelle', L.ref + ' (ancien libellé)', L.ref], ['Actif', 'false', 'true'], ['DateModificationFiche', '2026-03-12T00:00:00', ts]]; }
    return L;
  }
  for (var i = 0; i < 160; i++) LOGS.push(nouveau(i));

  // ---------- Résumé en clair : phrase générée automatiquement à partir du dictionnaire ----------
  function art(e) { var d = dico.entites[e]; return ((d && d.a) || 'le ') + lib('entites', e).toLowerCase(); }
  function enClair(l) {
    var u = l.user, r = l.ref.replace(' — ', ' – '), p = l.champs;
    function un(c, i) { return libC(c[0]) + ' : ' + valeur(c[0], c[i]); }
    function cl(k) { return p.filter(function (c) { return c[0] === k; })[0]; }
    switch (l.action) {
      case 'Login': return u + ' s’est connecté(e) à l’application.';
      case 'LoginFailed': var mo = cl('MotifEchec'); return 'Connexion refusée pour ' + u + (mo ? ' (' + valeur('MotifEchec', mo[2]).toLowerCase() + ')' : '') + '.';
      case 'View': return u + ' a consulté l’état « ' + l.ref + ' ».';
      case 'Export': var fm = cl('FormatExport'); return u + ' a exporté l’état « ' + l.ref + ' »' + (fm ? ' au format ' + valeur('FormatExport', fm[2]) : '') + '.';
      case 'Create': return u + ' a créé ' + art(l.entite) + ' ' + r + (p.length ? ' (' + p.slice(0, 3).map(function (c) { return un(c, 2); }).join(' ; ') + (p.length > 3 ? ' …' : '') + ')' : '') + '.';
      case 'Delete': return u + ' a supprimé ' + art(l.entite) + ' ' + r + (p.length ? ' (' + p.slice(0, 2).map(function (c) { return un(c, 1); }).join(' ; ') + (p.length > 2 ? ' …' : '') + ')' : '') + '.';
      case 'Update': return u + ' a modifié ' + art(l.entite) + ' ' + r + ' : ' + p.slice(0, 3).map(function (c) { return libC(c[0]).toLowerCase() + ' de « ' + valeur(c[0], c[1]) + ' » à « ' + valeur(c[0], c[2]) + ' »'; }).join(' ; ') + (p.length > 3 ? ' …' : '') + '.';
    }
    return u + ' : ' + lib('actions', l.action) + ' ' + r + '.';
  }

  // ---------- Filtres et tableau ----------
  var F = { du: '', au: '', module: '', user: '', action: '', type: '' }, affiche = 40, ouvert = null, technique = false, resume = true;
  function remplir() {
    function opt(sel, vide, items) { var s = q(sel), v = s.value; s.innerHTML = '<option value="">' + vide + '</option>' + items.map(function (x) { return '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>'; }).join(''); s.value = v; }
    var mods = {}, users = {}, acts = {}, typs = {}; LOGS.forEach(function (l) { mods[l.module] = 1; users[l.user] = 1; acts[l.action] = 1; typs[l.type] = 1; });
    opt('[data-jt-f="module"]', 'Tous', Object.keys(mods).sort().map(function (k) { return [k, k]; }));
    opt('[data-jt-f="user"]', 'Tous', Object.keys(users).sort().map(function (k) { return [k, k]; }));
    opt('[data-jt-f="action"]', 'Toutes', Object.keys(acts).map(function (k) { return [k, lib('actions', k)]; }));
    opt('[data-jt-f="type"]', 'Tous', Object.keys(typs).map(function (k) { return [k, lib('types', k)]; }));
  }
  function filtrer() {
    return LOGS.filter(function (l) {
      var j = l.dt.slice(0, 10);
      return (!F.du || j >= F.du) && (!F.au || j <= F.au) && (!F.module || l.module === F.module) && (!F.user || l.user === F.user) && (!F.action || l.action === F.action) && (!F.type || l.type === F.type);
    });
  }
  function dessiner() {
    var L = filtrer();
    q('[data-jt-n]').textContent = L.length + ' résultat(s)';
    q('[data-jt-rows]').innerHTML = L.slice(0, affiche).map(function (l) {
      var a = dico.actions[l.action] || { l: l.action, c: 'a' }, ref = l.ref.indexOf(' — ') > 0 ? l.ref.split(' — ') : [l.ref, ''];
      return '<tr tabindex="0" data-jt-r="' + l.id + '" title="Double-clic pour voir les détails"><td class="jt-mono">' + esc(fmtDate(l.dt.slice(0, 16)).replace(' ', ' ')) + '</td><td>' + esc(l.user) + '</td><td>' + esc(l.module) + '</td>' +
        '<td>' + esc(lib('entites', l.entite)) + ' <b>' + esc(ref[0]) + '</b>' + (ref[1] ? '<span class="jt-sub">' + esc(ref[1]) + '</span>' : '') + (resume ? '<span class="jt-sub" style="color:#2E427B">' + esc(enClair(l)) + '</span>' : '') + '</td><td><span class="jt-pill ' + (a.c || 'a') + '">' + esc(a.l) + '</span></td><td>' + esc(lib('types', l.type)) + '</td></tr>';
    }).join('') || '<tr><td colspan="6" class="jt-vide">Aucune manipulation ne correspond aux filtres.</td></tr>';
    q('[data-jt-plus]').hidden = L.length <= affiche;
  }

  // ---------- Détail ----------
  function detail(id) {
    var l = LOGS.filter(function (x) { return x.id === +id; })[0]; if (!l) return; ouvert = l;
    var a = dico.actions[l.action] || { l: l.action, c: 'a' };
    var lignes = l.champs.map(function (c) {
      var e = dico.champs[c[0]], nom = technique ? c[0] : (e ? e.l : humaniser(c[0]));
      var o = valeur(c[0], c[1], technique), n = valeur(c[0], c[2], technique);
      return '<tr><td>' + esc(nom) + (technique ? '' : '<span class="jt-tech">' + esc(c[0]) + '</span>') + (!technique && e && e.d ? '<span class="jt-def">' + esc(e.d) + '</span>' : '') + (!e && !technique ? '<span class="jt-def" style="color:#8A5A00">Libellé généré automatiquement — à valider dans le dictionnaire</span>' : '') + '</td>' +
        '<td class="o' + (o === '' ? ' vd' : '') + '">' + esc(o) + '</td><td class="n' + (n === '' ? ' vd' : '') + '">' + esc(n) + '</td></tr>';
    }).join('');
    q('[data-jt-md]').innerHTML = '<div class="jt-mh"><h2>Détail de la manipulation</h2><span class="jt-pill ' + (a.c || 'a') + '">' + esc(a.l) + '</span><span class="sp"></span><button type="button" class="jt-x" data-jt-fermer aria-label="Fermer">✕</button></div>' +
      '<div class="jt-claire"><b>En clair</b>' + esc(enClair(l)) + '</div>' +
      '<div class="jt-meta"><div><small>Date / heure</small>' + esc(fmtDate(l.dt.slice(0, 16))) + '</div><div><small>Utilisateur</small>' + esc(l.user) + '</div><div><small>Module</small>' + esc(l.module) + '</div>' +
      '<div><small>Entité</small>' + esc(technique ? l.entite : lib('entites', l.entite)) + '</div><div><small>Référence</small>' + esc(l.ref) + '</div><div><small>Type</small>' + esc(technique ? l.type : lib('types', l.type)) + '</div></div>' +
      '<div class="jt-mb"><table class="jt-d"><colgroup><col style="width:34%"><col style="width:33%"><col style="width:33%"></colgroup><thead><tr><th>Champ</th><th>Ancienne valeur</th><th>Nouvelle valeur</th></tr></thead><tbody>' + lignes + '</tbody></table></div>' +
      '<div class="jt-mf"><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-jt-tech' + (technique ? ' checked' : '') + '> Afficher les noms techniques</label><span style="flex:1"></span><button type="button" class="jt-b" data-jt-dico>Dictionnaire</button><button type="button" class="jt-b ok" data-jt-fermer>Fermer</button></div>';
    q('[data-jt-ov]').hidden = false; var x = q('[data-jt-fermer]'); if (x) x.focus();
  }
  function fermer() { q('[data-jt-ov]').hidden = true; ouvert = null; }

  // ---------- Dictionnaire (consultable et modifiable) ----------
  var onglet = 'champs', dq = '', brouillon = null, ajoutOn = false;
  function usage() { var u = {}, ex = {}; LOGS.forEach(function (l) { l.champs.forEach(function (c) { (u[c[0]] = u[c[0]] || {})[l.entite] = 1; if (!ex[c[0]]) { var v = c[2] !== '' ? c[2] : c[1]; if (v !== '') ex[c[0]] = v; } }); }); return { u: u, ex: ex }; }
  var FORMATS = [['texte', 'Texte'], ['code', 'Code'], ['montant', 'Montant'], ['date', 'Date'], ['bool', 'Oui / Non'], ['pourcent', 'Pourcentage'], ['enum', 'Valeur codée'], ['id', 'Identifiant technique']];
  var NOMS = { champs: 'Champs', entites: 'Entités', actions: 'Actions', types: 'Types' };
  function manquants(b) { var us = usage(); return Object.keys(us.u).filter(function (k) { return !b.champs[k]; }); }
  function dicoModal() {
    if (!brouillon) brouillon = copie(dico);
    var g = onglet, us = usage(), mq = manquants(brouillon), cles = Object.keys(brouillon[g]).filter(function (k) { return !dq || (k + ' ' + (brouillon[g][k].l || '')).toLowerCase().indexOf(dq) >= 0; });
    var h = '<div class="jt-mh"><h2>Dictionnaire des logs</h2><span class="sp"></span><button type="button" class="jt-x" data-jt-fermer aria-label="Fermer">✕</button></div>' +
      '<div class="jt-tabs">' + Object.keys(NOMS).map(function (k) { return '<button type="button" data-jt-on="' + k + '" class="' + (k === g ? 'on' : '') + '">' + NOMS[k] + ' (' + Object.keys(brouillon[k]).length + ')</button>'; }).join('') + '</div>' +
      '<p class="jt-claire" style="margin:0"><b>Dictionnaire de données</b>Il traduit automatiquement les noms techniques des logs en libellés, formate les valeurs et rédige le résumé en clair. ' + (mq.length ? '<span style="color:#8A5A00">' + mq.length + ' terme(s) rencontré(s) dans les logs ne sont pas documentés : ' + mq.map(esc).join(', ') + '.</span> <button type="button" class="jt-b" data-jt-auto>Compléter automatiquement</button>' : 'Tous les termes rencontrés dans les logs sont documentés.') + '</p>' +
      '<div class="jt-dq"><input type="text" placeholder="Rechercher un terme technique ou un libellé…" value="' + esc(dq) + '" data-jt-dq aria-label="Rechercher dans le dictionnaire">' + (ajoutOn ? '<input type="text" placeholder="Terme technique (ex. MontantTva)" data-jt-new aria-label="Nouveau terme technique" style="max-width:240px;height:34px;border:1px solid #878D9A;border-radius:8px;padding:0 10px;font:inherit;font-size:13px"><button type="button" class="jt-b ok" data-jt-addok>Ajouter</button>' : '<button type="button" class="jt-b" data-jt-add>Ajouter un terme</button>') + '</div>' +
      '<div class="jt-mb"><table class="jt-d"><colgroup>' + (g === 'champs' ? '<col style="width:17%"><col style="width:18%"><col style="width:13%"><col style="width:22%"><col style="width:15%"><col style="width:15%">' : '<col style="width:24%"><col style="width:26%"><col style="width:50%">') + '</colgroup><thead><tr><th>Terme technique</th><th>Libellé affiché</th>' + (g === 'champs' ? '<th>Type de donnée</th><th>Description</th><th>Utilisé dans</th><th>Exemple</th>' : '<th></th>') + '</tr></thead><tbody>' +
      cles.map(function (k) {
        var e = brouillon[g][k];
        return '<tr><td class="jt-mono">' + esc(k) + '</td><td><input class="jt-di" value="' + esc(e.l) + '" data-jt-e="' + esc(k) + '|l" aria-label="Libellé de ' + esc(k) + '"></td>' +
          (g === 'champs' ? '<td><select class="jt-di" data-jt-e="' + esc(k) + '|f">' + FORMATS.map(function (f) { return '<option value="' + f[0] + '"' + (e.f === f[0] ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('') + '</select></td><td><input class="jt-di" value="' + esc(e.d || '') + '" data-jt-e="' + esc(k) + '|d" aria-label="Description de ' + esc(k) + '"></td><td style="font-size:12px;color:#474C58">' + esc(Object.keys(us.u[k] || {}).map(function (x) { return lib('entites', x); }).join(', ') || '—') + '</td><td class="jt-mono" style="font-size:12px;color:#474C58">' + esc(us.ex[k] != null ? valeur(k, us.ex[k], false) : '—') + '</td>' : '<td></td>') + '</tr>';
      }).join('') + (cles.length ? '' : '<tr><td colspan="4" class="jt-vide">Aucun terme.</td></tr>') + '</tbody></table></div>' +
      '<div class="jt-mf"><span>Les libellés servent à l’affichage des détails ; les noms techniques restent consultables.</span><span style="flex:1"></span><button type="button" class="jt-b" data-jt-dreset>Rétablir le dictionnaire d’origine</button><button type="button" class="jt-b" data-jt-fermer>Annuler</button><button type="button" class="jt-b ok" data-jt-dsave>Enregistrer</button></div>';
    q('[data-jt-md]').innerHTML = h; q('[data-jt-ov]').hidden = false;
  }
  function toast(t) { var d = document.createElement('div'); d.className = 'jt-toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2400); }

  root.addEventListener('change', function (e) {
    var t = e.target, k;
    if (t.hasAttribute('data-jt-res')) { resume = t.checked; dessiner(); return; }
    if ((k = t.dataset.jtF)) { F[k] = t.value; affiche = 40; dessiner(); }
    else if (t.hasAttribute('data-jt-tech')) { technique = t.checked; detail(ouvert.id); }
    else if (t.dataset.jtE) { var p = t.dataset.jtE.split('|'); brouillon[onglet][p[0]][p[1]] = t.value; }
  });
  root.addEventListener('input', function (e) {
    var t = e.target; if (t.hasAttribute('data-jt-dq')) { dq = t.value.trim().toLowerCase(); dicoModal(); var n = q('[data-jt-dq]'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    else if (t.dataset.jtE) { var p = t.dataset.jtE.split('|'); brouillon[onglet][p[0]][p[1]] = t.value; }
  });
  root.addEventListener('click', function (e) {
    var t = e.target, b;
    if (t.closest('[data-jt-plus]')) { affiche += 40; dessiner(); }
    else if (t.closest('[data-jt-reset]')) { F = { du: '', au: '', module: '', user: '', action: '', type: '' }; qa('[data-jt-f]').forEach(function (x) { x.value = ''; }); affiche = 40; dessiner(); }
    else if (t.closest('[data-jt-dico]')) { brouillon = copie(dico); dq = ''; ajoutOn = false; dicoModal(); }
    else if (t.closest('[data-jt-fermer]') || t === q('[data-jt-ov]')) { fermer(); brouillon = null; }
    else if ((b = t.closest('[data-jt-on]'))) { onglet = b.dataset.jtOn; dq = ''; dicoModal(); }
    else if (t.closest('[data-jt-add]')) { ajoutOn = true; dicoModal(); var nn = q('[data-jt-new]'); if (nn) nn.focus(); }
    else if (t.closest('[data-jt-addok]')) { var n2 = q('[data-jt-new]'), k = n2 ? n2.value.trim() : ''; if (!k) { if (n2) n2.focus(); return; } if (brouillon[onglet][k]) { toast('Ce terme existe déjà.'); return; } brouillon[onglet][k] = onglet === 'champs' ? { l: k, f: 'texte', d: '' } : { l: k }; ajoutOn = false; dq = ''; dicoModal(); }
    else if (t.closest('[data-jt-auto]')) { manquants(brouillon).forEach(function (k) { var ex = usage().ex[k]; brouillon.champs[k] = { l: humaniser(k), f: devine(ex == null ? '' : ex), d: 'Libellé généré automatiquement à partir du nom technique ; à valider.' }; }); dicoModal(); toast('Termes ajoutés au dictionnaire (à enregistrer).'); }
    else if (t.closest('[data-jt-dreset]')) { brouillon = copie(DICO0); dicoModal(); toast('Dictionnaire d’origine rétabli (à enregistrer).'); }
    else if (t.closest('[data-jt-dsave]')) { Object.keys(dico).forEach(function (g) { dico[g] = brouillon[g]; }); window.DICTIONNAIRE_LOGS = dico; brouillon = null; fermer(); remplir(); dessiner(); toast('Dictionnaire enregistré.'); }
    else if ((b = t.closest('[data-jt-r]')) && e.detail === 2) detail(b.dataset.jtR);
  });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !q('[data-jt-ov]').hidden) { fermer(); brouillon = null; }
    else if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-jt-r]')) detail(e.target.dataset.jtR);
  });
  // ---------- Exports PDF / XLSX, sans ou avec détails (tout le résultat filtré, libellés du dictionnaire) ----------
  function exporter(mode, details) {
    var X = window.EXPORT_TABLEAU; if (!X) { toast('Module d’export indisponible.'); return; }
    var L = filtrer(); if (!L.length) { toast('Rien à exporter.'); return; }
    var dt = function (l) { return fmtDate(l.dt.slice(0, 16)); }, base = function (l) { return [dt(l), l.user, l.module, lib('entites', l.entite), l.ref, lib('actions', l.action), lib('types', l.type)]; };
    var tete = ['Date/heure', 'Utilisateur', 'Module', 'Entité', 'Référence', 'Action', 'Type'], rows;
    if (!details) { tete.push('Résumé'); rows = L.map(function (l) { return base(l).concat([enClair(l)]); }); }
    else { tete = tete.concat(['Champ', 'Ancienne valeur', 'Nouvelle valeur']); rows = []; L.forEach(function (l) { if (!l.champs.length) rows.push(base(l).concat(['', '', ''])); l.champs.forEach(function (c) { rows.push(base(l).concat([libC(c[0]), valeur(c[0], c[1]), valeur(c[0], c[2])])); }); }); }
    var filtres = [F.du && 'du ' + fmtDate(F.du), F.au && 'au ' + fmtDate(F.au), F.module, F.user, F.action && lib('actions', F.action), F.type && lib('types', F.type)].filter(Boolean);
    var sous = L.length + ' manipulation(s)' + (details ? ' · ' + rows.length + ' ligne(s) de détail' : '') + (filtres.length ? ' · ' + filtres.join(' · ') : '');
    var nom = 'journal_traces' + (details ? '_details' : '');
    if (mode === 'pdf') X.pdf(nom + '.pdf', 'Journal de traces' + (details ? ' (avec détails)' : ''), sous, tete, rows); else X.xlsx(nom + '.xlsx', 'Journal de traces', tete, rows);
    toast('Export ' + (mode === 'pdf' ? 'PDF' : 'Excel (XLSX)') + (details ? ' avec détails' : '') + ' généré : ' + rows.length + ' ligne(s).');
  }
  root.addEventListener('click', function (e) { var b = e.target.closest('[data-jt-x]'); if (b) { var k = b.dataset.jtX; exporter(k.indexOf('pdf') === 0 ? 'pdf' : 'xlsx', /d$/.test(k)); } });
  remplir(); dessiner();
})();

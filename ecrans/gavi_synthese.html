<!--
  Écran « Synthèse » de la procédure financière GAVI (Comptabilité Projets & Bailleurs › GAVI › Synthèse) — édition.
  Même charte que les éditions des états financiers et même principe que « Emplois et ressources », avec les types de ligne GAVI :
  Ressources, Emplois - 1, Emplois - 2, Emplois - 3, Trésorerie, Avances non liquidés. Les lignes viennent du paramétrage (Numéro Paramètre, bouton « Paramétrage »).
  Critères : numéro de paramètre, année en cours, périodicité, numéro (période calculée), budget dépenses / recettes, type de dépenses, centre de saisie, subvention,
  journal, cumul, « Ressources / journal de trésorerie », état en milliers, monnaie.
  Résultat (fichier ExploitationGaviSynthese.xlsx) : Réel – Antérieur (avec le cumul), Budget et Réel par trimestre, Total annuel (budget, réel, variance, variance %), Réel – Cumulé.
  Données : valeurs de démonstration du fichier sur les lignes du paramètre, complétées par les écritures saisies (fourchettes de comptes et d'axes de la ligne).
  Emplois - 1 et Emplois - 2 suivent la règle « type de dépenses » (décaissement : classes 2, 4, 6 en journaux de trésorerie ; engagement : classes 2 et 6, tous journaux, avec imputation analytique).
  Natures : Grille = fourchettes ; Regroupement = somme des lignes de grille qui le suivent ; Total = somme des lignes de grille du même type depuis le total précédent.
-->

    var txt = c === n ? 'Tous sélectionnés (' + n + ')' : c === 0 ? 'Aucune sélection' : c + ' sélectionné(s) sur ' + n;

  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

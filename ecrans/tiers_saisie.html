<!--
  Écran « Saisie des tiers » (Paramétrages › Gestion des plans › Saisie des plans › Tiers) — onglets Saisie / Liste.
  Liste : Compte collectif (classe 4), Code (tri), Intitulé, Type (pastille), Adresse, Téléphone, NIF, Statut (Actif / Utilisé) ; filtres par colonne et pagination.
  Saisie : Identité (code*, intitulé*, type*, compte collectif*), Coordonnées (adresse, région, pays, téléphone, NIF, STAT, RCS),
  Coordonnées bancaires (banque, code banque, code agence, numéro de compte, clé, SWIFT, adresse et pays de la banque), Correspondance bancaire (mêmes champs), Paiement et site.
  Données : Plans_consolides.xlsx (feuille Tiers, Projet PARN) — %%DONNEES%% = { tiers:[[compte, code, nom]], det:{index:{…}}, collectifs, sites } (import_plans/gen.cjs).
  Un tiers « Utilisé » dans une pièce ne peut plus être supprimé ; son code et son compte collectif sont verrouillés. Ne pas nommer de fonction « $$ » (build.cjs).
-->

        <div class="ti-sec">Paiement et site</div>

<script>
(function () {
  var root = document.querySelector('[data-ti]'); if (!root) return;
  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ti-sb]'); if (!b) return;
    [].forEach.call(root.querySelectorAll('[data-ti-sb]'), function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    [].forEach.call(root.querySelectorAll('[data-ti-sp]'), function (p) { p.hidden = p.dataset.tiSp !== b.dataset.tiSb; });
  });
  function q(s) { return root.querySelector(s); } function qa(s) { return [].slice.call(root.querySelectorAll(s)); }
  var D = %%DONNEES%%;
  var SOUS = { FR: 'Fournisseur', CL: 'Client', SA: 'Salarié' };
  var ABR = { 'Fournisseur': 'FR', 'Client': 'CL', 'Salarié': 'SA' };
  // type déduit du compte collectif (fournisseurs 401-409, personnel 421 et avances de mission 463, ONG / partenaires 466-467)
  function sousDe(c) { return /^40[1-9]/.test(c) ? 'Fournisseur' : /^(41|46[67])/.test(c) ? 'Client' : /^(42|463)/.test(c) ? 'Salarié' : ''; }
  var CHAMPS = ['adr', 'reg', 'pays', 'tel', 'web', 'geo', 'nif', 'stat', 'rcs', 'cin', 'dcin', 'lcin', 'banque', 'cb', 'ca', 'num', 'cle', 'swift', 'adrb', 'paysb', 'c_banque', 'c_cb', 'c_ca', 'c_num', 'c_cle', 'c_swift', 'c_adrb', 'c_paysb', 'modalite', 'site'];
  // Saisie de plusieurs comptes par tiers : coordonnées bancaires (bq) et correspondances bancaires (cr), chacune sous forme de cartes ajoutables et détachables.
  var BF = ['banque', 'cb', 'ca', 'num', 'cle', 'swift', 'adrb', 'paysb'], MAXL = { banque: 60, cb: 10, ca: 10, num: 30, cle: 4, swift: 11, adrb: 200, paysb: 40 }, W = { '': [], 'c_': [] };
  function cleListe(pre) { return pre ? 'cr' : 'bq'; }
  function cleCompte(o) { return [o.banque, o.cb, o.ca, o.num, o.cle].join('|'); }
  function vide(o) { return !BF.some(function (f) { return o[f]; }); }
  function normaliser(r) {
    ['', 'c_'].forEach(function (pre) {
      var k = cleListe(pre); if (!r[k]) r[k] = [];
      var o = {}; BF.forEach(function (f) { o[f] = (r[pre + f] || '').trim(); });
      if (!vide(o) && !r[k].some(function (x) { return cleCompte(x) === cleCompte(o); })) r[k].push(o);
    });
  }
  function copier(l) { return l.map(function (o) { var c = {}; BF.forEach(function (f) { c[f] = o[f] || ''; }); return c; }); }
  var LIB = { banque: 'Banque', swift: 'SWIFT', paysb: 'Pays de la banque', adrb: 'Adresse de la banque', cb: 'Code banque', ca: 'Code agence', num: 'Numéro de compte', cle: 'Clé' };
  function champ(pre, i, f, span, o, ed) { return '<label class="bp-champ" style="grid-column:span ' + span + '"><span>' + LIB[f] + '</span><input class="bp-in" data-bi="' + pre + ':' + i + ':' + f + '" maxlength="' + MAXL[f] + '" value="' + esc(o[f]) + '" autocomplete="off"' + (ed ? '' : ' disabled') + '></label>'; }
  function dessinerComptes() {
    var ed = mode !== 'consultation';
    ['', 'c_'].forEach(function (pre) {
      var L = W[pre], nom = pre ? 'Correspondance bancaire' : 'Coordonnée bancaire';
      q('[data-ti-bl="' + pre + '"]').innerHTML = L.length ? L.map(function (o, i) {
        return '<div class="ti-grp ti-cd"><div class="ti-ch"><b>' + nom + ' n° ' + (i + 1) + '</b>' + (i === 0 ? '<span class="ti-pr">Principal</span>' : '') + '<span style="flex:1"></span>' +
          '<button type="button" class="ti-bt" data-ti-iban="' + pre + ':' + i + '"><i class="ti ti-shield-check"></i> Tester le compte</button>' +
          '<button type="button" class="ti-ic" data-ti-bdel="' + pre + ':' + i + '" title="Détacher ce compte" aria-label="Détacher ce compte"' + (ed ? '' : ' disabled') + '><i class="ti ti-trash"></i></button></div>' +
          '<div class="ti-sg">Banque</div><div class="ti-g4" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px">' + champ(pre, i, 'banque', 2, o, ed) + champ(pre, i, 'swift', 1, o, ed) + champ(pre, i, 'paysb', 1, o, ed) + champ(pre, i, 'adrb', 4, o, ed) + '</div>' +
          '<div class="ti-sg">Compte bancaire</div><div class="ti-g4" style="grid-template-columns:repeat(4,minmax(0,1fr))">' + champ(pre, i, 'cb', 1, o, ed) + champ(pre, i, 'ca', 1, o, ed) + champ(pre, i, 'num', 1, o, ed) + champ(pre, i, 'cle', 1, o, ed) + '</div>' +
          '<div class="ti-ib" role="status" data-ti-ibr="' + pre + ':' + i + '" hidden></div></div>';
      }).join('') : '<div class="ti-vd">Aucun compte saisi pour ce tiers' + (ed ? '. Cliquez sur « Ajouter un compte ».' : '.') + '</div>';
      q('[data-ti-add="' + pre + '"]').disabled = !ed;
      q('[data-ti-bn="' + pre + '"]').textContent = L.length;
    });
  }
  root.addEventListener('input', function (e) { var d = e.target.dataset && e.target.dataset.bi; if (!d) return; var v = d.split(':'), pre = v[0] === 'c_' ? 'c_' : '', o = W[pre][+v[1]]; if (o) o[v[2]] = e.target.value.trim(); });
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'), pre, v; if (!b || b.disabled) return;
    if (b.hasAttribute('data-ti-add')) { pre = b.dataset.tiAdd; var o = {}; BF.forEach(function (f) { o[f] = ''; }); W[pre].push(o); dessinerComptes(); var c = root.querySelectorAll('[data-ti-bl="' + pre + '"] .ti-cd'); var dern = c[c.length - 1]; if (dern) { var f = dern.querySelector('input'); if (f) f.focus(); } }
    else if (b.hasAttribute('data-ti-bdel')) { v = b.dataset.tiBdel.split(':'); pre = v[0] === 'c_' ? 'c_' : ''; W[pre].splice(+v[1], 1); dessinerComptes(); toast('Compte détaché.'); }
    else if (b.hasAttribute('data-ti-iban')) { v = b.dataset.tiIban.split(':'); testerCompte(v[0] === 'c_' ? 'c_' : '', +v[1]); }
  });
  // Adresse web et géolocalisation (latitude, longitude en degrés décimaux)
  var RE_WEB = /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i;

      if (r.utilise) { toast('Suppression impossible : ce tiers est utilisé dans des pièces.'); return; }
      if (!window.confirm('Supprimer le tiers « ' + r.code + ' — ' + r.nom + ' » ?')) return;
      synchroniser({ code: r.code, compte: r.compte }, null); rows.splice(sel, 1); sel = -1; form(null); etat(); liste(); toast('Tiers supprimé.'); return;
    }
    if (b.hasAttribute('data-ti-imprimer')) { window.print(); return; }
    if (b.hasAttribute('data-ti-exporter')) { toast('Export des tiers (maquette)'); return; }
  });
  window.addEventListener('load', function () { if (mode === 'consultation') form(sel >= 0 ? rows[sel] : null); etat(); });
  form(null); etat(); onglet('liste');
})();
</script>

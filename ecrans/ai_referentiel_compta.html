        if (i.sortie && !i.sortie.date) add('ANA-IMM-001', 'Sortie d’actif sans date', ref);
      });
    }
    // Clôtures : mois échus de l’exercice courant non clôturés (clôture mensuelle activée)
    var cfgC = window.CLOTURE_CFG || {};
    if (cfgC.mensuelle !== false) {
      var an = new Date().getFullYear(), mo = new Date().getMonth(), pcl = window.PERIODES_CLOTUREES || {}, cm = pcl[an] || pcl[String(an)] || {}, noms = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
      var perio = (window.CLOTURES_PERIODIQUES || []).map(function (c) { return [c.du, c.au]; });
      dispo['ANA-CLO-001'] = 'exercice ' + an;
      for (var m = 0; m < mo; m++) { var k = an + '-' + (m < 9 ? '0' : '') + (m + 1); if (!cm[k] && !enPeriodeCloturee(k + '-15', perio)) add('ANA-CLO-001', 'Période de ' + noms[m] + ' ' + an + ' échue et non clôturée', 'Période ' + k); }
    }
    // Circuit de validation : window.CIRCUIT_ETAPES
    var cir = Array.isArray(window.CIRCUIT_ETAPES) ? window.CIRCUIT_ETAPES : [];
    if (cir.length) {
      dispo['ANA-CIR-001'] = cir.length + ' étape(s) de circuit';
      cir.forEach(function (e) {
        var ref = 'Étape ' + e.num + ' ' + e.nom;
        if (!(e.users || []).length) add('ANA-CIR-001', 'Aucun utilisateur autorisé à exécuter l’étape', ref);
        if (!(e.checklist || []).length) add('ANA-CIR-001', 'Aucune checklist de contrôle paramétrée', ref);
        else if (!(e.checklist || []).some(function (c) { return c.ob; })) add('ANA-CIR-001', 'Aucun point de contrôle obligatoire', ref);
      });
      if (cir.length > 1) (cir[0].users || []).filter(function (u) { return cir.every(function (e) { return (e.users || []).indexOf(u) >= 0; }); }).forEach(function (u) { add('ANA-CIR-001', 'Séparation des tâches : l’utilisateur « ' + u + ' » peut exécuter toutes les étapes du circuit', 'Circuit'); });
    }
    // Traces : window.TRACES_CFG
    var tr = window.TRACES_CFG;
    if (tr && typeof tr === 'object' && Object.keys(tr).length) {
      dispo['ANA-CTL-001'] = Object.keys(tr).length + ' fonctionnalité(s) paramétrée(s), contrôle des fonctionnalités comptables';
      Object.keys(tr).filter(function (k) { return /(écriture|ecriture|journal|plan|lettrage|rapprochement|cl[ôo]ture|caisse|immobilis|tiers|exercice|circuit|facture|banque|devise|cours)/i.test(k); }).forEach(function (k) { var t = tr[k]; if (t && !(t.r || t.c || t.m || t.s)) add('ANA-CTL-001', 'Aucune trace activée sur « ' + k + ' » (création ' + (t.c ? 'oui' : 'non') + ', modification ' + (t.m ? 'oui' : 'non') + ', suppression ' + (t.s ? 'oui' : 'non') + ')', k); });
    }
    var srcMod = { 'ANA-TRE-001': 'Rapprochement bancaire', 'ANA-TRE-002': 'Petite caisse', 'ANA-IMM-001': 'Immobilisations', 'ANA-CLO-001': 'Clôtures', 'ANA-CIR-001': 'Circuit de validation', 'ANA-CTL-001': 'Traces' };
    var srcPieces = reel.length ? 'Saisie d’écritures (' + reel.length + ' pièce(s))' : 'Jeu de démonstration (aucune pièce saisie)';
    var resultats = R.controles.filter(function (c) { return c.auto; }).map(function (c) {
      var d = res[c.code] || [], mod = srcMod[c.code], na = mod ? !dispo[c.code] : false;
      return { c: c, n: d.length, details: d, na: na, src: mod ? (na ? mod + ' — aucune donnée' : mod + ' : ' + dispo[c.code]) : srcPieces };
    });
    var pAno = {}; resultats.forEach(function (r) { r.details.forEach(function (x) { if (/^ANA-CPT-(001|002|003|004|005|008)$/.test(r.c.code) || true) pAno[x.piece] = 1; }); });
    var justif = pieces.filter(function (p) { return String(p.reference || '').trim() || String(p.facture || '').trim(); }).length;
    var kpi = { pieces: pieces.length, lignes: lignes.length, justification: pieces.length ? justif / pieces.length * 100 : 0, anomalies: pieces.length ? Object.keys(pAno).filter(function (k) { return k && pieces.some(function (p) { return p.piece === k; }); }).length / pieces.length * 100 : 0, enSuspens: resultats.reduce(function (a, r) { return a + r.n; }, 0) };
    var tl = 0, tr2 = 0; rels.forEach(function (r) { (r.lignes || []).forEach(function (x) { tl++; if (x.r) tr2++; }); }); kpi.rapprochement = tl ? tr2 / tl * 100 : null;
    kpi.suspensCritiques = resultats.filter(function (r) { return r.c.type === 'Bloquant'; }).reduce(function (a, r) { return a + r.n; }, 0);
    var rep = { source: reel.length ? 'saisies' : 'demo', pieces: pieces.length, resultats: resultats, kpi: kpi, date: new Date() };
    R.dernier = rep; return rep;
  };
})();

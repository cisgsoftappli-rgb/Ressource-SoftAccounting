<!--
  Écran « Mode de règlement » (Paramètres comptables › Mode de règlement) — onglets Saisie / Liste : liste filtrable des modes de règlement,
  saisie (Code mode de paiement *, Libellé *, Type, Statut). Boutons dans la barre d'actions (Ajouter, Modifier, Supprimer, Enregistrer,
  Annuler, Imprimer, PDF, Excel). Données en mémoire ; liste des modes actifs exposée en window.MODES_REGLEMENT (événement « modes-reglement-changed »).
  S'appuie sur les styles bp-* de l'écran « Paramétrage du bilan ». Ne pas nommer de fonction « $$ » (build.cjs).
-->
<style>
.mr-badge{display:inline-flex;align-items:center;padding:2px 10px;border:1px solid;border-radius:6px;font-size:12px;font-weight:600}
.mr-badge.on{background:#ECFDF5;border-color:#A7F3D0;color:#047857}.mr-badge.off{background:#F5F7F9;border-color:#D6D9E0;color:#5B606D}
.mr-code{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.mr-help{font-size:12px;color:#5B606D}
.mr-er{display:none;font-size:12px;color:#B63132}.mr-er.show{display:block}
.bp-in.err,.bp-sel.err{border-color:#B63132}
</style>

<div class="bp-root" data-mr>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0">Mode de règlement</h1>

  <div class="no-print" data-mr-actions>
    <button type="button" data-mr-ajouter>Ajouter</button>
    <button type="button" data-mr-modifier>Modifier</button>
    <button type="button" data-mr-supprimer>Supprimer</button>
    <button type="button" data-mr-enregistrer>Enregistrer</button>
    <button type="button" data-mr-annuler>Annuler</button>
    <button type="button" data-mr-imprimer>Imprimer</button>
    <button type="button" data-mr-pdf>PDF</button>
    <button type="button" data-mr-xlsx>Excel (XLSX)</button>
  </div>

  <div class="bp-tabs" role="tablist">
    <button type="button" role="tab" class="on" data-mr-tab="saisie">Saisie</button>
    <button type="button" role="tab" data-mr-tab="liste">Liste <span class="bp-n" data-mr-compte></span></button>
  </div>

  <div class="bp-grid">
    <section class="bp-pan" aria-label="Liste des modes de règlement" data-mr-pan="liste" hidden>
      <h2>Modes de règlement <small>Double-clic ou « Modifier » pour ouvrir la ligne en saisie</small></h2>
      <div style="overflow:auto;max-height:560px">
        <table class="bp-tb" style="min-width:560px"><thead>
          <tr><th>Code</th><th>Libellé</th><th>Type</th><th>Statut</th></tr>
          <tr class="flt"><th><input class="bp-in" data-fc="0" aria-label="Filtrer Code"></th><th><input class="bp-in" data-fc="1" aria-label="Filtrer Libellé"></th>
            <th><select class="bp-sel" data-fc="2" aria-label="Filtrer Type"><option value=""></option><option value="banque">Banque</option><option value="caisse">Caisse</option><option value="-">Non précisé</option></select></th>
            <th><select class="bp-sel" data-fc="3" aria-label="Filtrer Statut"><option value=""></option><option value="actif">Actif</option><option value="inactif">Inactif</option></select></th></tr>
        </thead><tbody data-mr-lignes></tbody></table>
      </div>
      <div class="bp-vide" data-mr-vide hidden>Aucun mode de règlement : utilisez « Ajouter ».</div>
    </section>

    <section class="bp-pan" aria-label="Saisie d'un mode de règlement" data-mr-pan="saisie">
      <form class="bp-form" data-mr-form onsubmit="return false" novalidate>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <label class="bp-champ"><span>Code mode de paiement <b>*</b></span><input class="bp-in" data-f="code" maxlength="10" autocomplete="off" placeholder="VIR"><span class="mr-help">Lettres et chiffres, 10 caractères au plus. Non modifiable après création.</span><span class="mr-er" data-er="code"></span></label>
          <label class="bp-champ"><span>Libellé <b>*</b></span><input class="bp-in" data-f="lib" maxlength="80" autocomplete="off" placeholder="Virement bancaire"><span class="mr-er" data-er="lib"></span></label>
          <label class="bp-champ"><span>Type</span><select class="bp-sel" data-f="type"><option value="">— Non précisé —</option><option value="Banque">Banque</option><option value="Caisse">Caisse</option></select><span class="mr-help">Banque : règlement via un compte bancaire ; Caisse : règlement en numéraire ou monnaie mobile.</span></label>
          <div class="bp-chk" style="align-self:end"><label><input type="checkbox" data-f="actif" checked>Actif</label><span class="mr-help" style="display:block">Un mode inactif n'est plus proposé à la saisie.</span></div>
        </div>
      </form>
    </section>
  </div>
  <div class="bp-toast" role="status" hidden data-mr-toast></div>
</div>

<script>
(function () {
  var root = document.querySelector('[data-mr]'); if (!root) return;
  function q(s) { return root.querySelector(s); } function qa(s) { return [].slice.call(root.querySelectorAll(s)); }
  var data = [
    { code: 'VIR', lib: 'Virement bancaire', type: 'Banque', actif: true },
    { code: 'CHQ', lib: 'Chèque', type: 'Banque', actif: true },
    { code: 'ESP', lib: 'Espèces', type: 'Caisse', actif: true },
    { code: 'MVO', lib: 'Mobile money (MVola)', type: 'Caisse', actif: true }
  ];
  var sel = -1, mode = 'consultation';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m) { var t = q('[data-mr-toast]'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2500); }
  function err(k, m) { var e = q('[data-er="' + k + '"]'); e.textContent = m || ''; e.classList.toggle('show', !!m); }
  function publier() { window.MODES_REGLEMENT = data.filter(function (m) { return m.actif; }).map(function (m) { return { code: m.code, libelle: m.lib, type: m.type }; }); window.dispatchEvent(new Event('modes-reglement-changed')); }
  function filtrer() {
    var F = []; qa('[data-fc]').forEach(function (e) { F[+e.dataset.fc] = e.value.trim().toLowerCase(); });
    qa('[data-mr-lignes] tr').forEach(function (tr) { tr.hidden = F.some(function (v, k) { if (!v) return false; var td = tr.children[k]; var t = (td.dataset.v || td.textContent).toLowerCase(); return k >= 2 ? t !== v : t.indexOf(v) < 0; }); });
  }
  qa('[data-fc]').forEach(function (e) { e.addEventListener('input', filtrer); e.addEventListener('change', filtrer); });
  function liste() {
    q('[data-mr-compte]').textContent = data.length ? data.length + (data.length > 1 ? ' lignes' : ' ligne') : '';
    q('[data-mr-vide]').hidden = data.length > 0;
    q('[data-mr-lignes]').innerHTML = data.map(function (m, i) {
      return '<tr data-i="' + i + '"' + (i === sel ? ' class="sel"' : '') + '><td><span class="mr-code">' + esc(m.code) + '</span></td><td>' + esc(m.lib) + '</td><td data-v="' + (m.type ? m.type.toLowerCase() : '-') + '">' + (m.type ? esc(m.type) : '—') + '</td>' +
        '<td class="c" data-v="' + (m.actif ? 'actif' : 'inactif') + '"><span class="mr-badge ' + (m.actif ? 'on' : 'off') + '">' + (m.actif ? 'Actif' : 'Inactif') + '</span></td></tr>';
    }).join(''); filtrer();
  }
  function form(m) {
    m = m || { code: '', lib: '', type: '', actif: true };
    q('[data-f=code]').value = m.code; q('[data-f=lib]').value = m.lib; q('[data-f=type]').value = m.type || ''; q('[data-f=actif]').checked = m.actif !== false;
    err('code'); err('lib'); q('[data-f=code]').classList.remove('err'); q('[data-f=lib]').classList.remove('err');
  }
  function etat() {
    var ed = mode !== 'consultation';
    qa('[data-mr-form] input,[data-mr-form] select').forEach(function (e) { e.disabled = !ed; });
    q('[data-f=code]').disabled = mode !== 'creation';
    var a = q('[data-mr-actions]');
    a.querySelector('[data-mr-ajouter]').disabled = ed; a.querySelector('[data-mr-modifier]').disabled = ed || sel < 0; a.querySelector('[data-mr-supprimer]').disabled = ed || sel < 0;
    a.querySelector('[data-mr-enregistrer]').disabled = !ed; a.querySelector('[data-mr-annuler]').disabled = !ed;
    ['imprimer', 'pdf', 'xlsx'].forEach(function (k) { a.querySelector('[data-mr-' + k + ']').disabled = !data.length; });
  }
  function onglet(n) { qa('[data-mr-pan]').forEach(function (p) { p.hidden = p.dataset.mrPan !== n; }); qa('[data-mr-tab]').forEach(function (t) { var on = t.dataset.mrTab === n; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); }); }
  function choisir(i) { if (mode !== 'consultation') return; sel = i; liste(); form(data[i]); etat(); }
  qa('[data-mr-tab]').forEach(function (t) { t.addEventListener('click', function () { onglet(t.dataset.mrTab); }); });
  var tb = q('[data-mr-lignes]');
  tb.addEventListener('click', function (e) { var tr = e.target.closest('tr[data-i]'); if (tr) choisir(+tr.dataset.i); });
  tb.addEventListener('dblclick', function (e) { var tr = e.target.closest('tr[data-i]'); if (tr) { choisir(+tr.dataset.i); onglet('saisie'); } });
  q('[data-f=code]').addEventListener('input', function () { this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  function enregistrer() {
    var code = q('[data-f=code]').value.trim(), lib = q('[data-f=lib]').value.trim(), ok = true, ancien = mode === 'edition' ? data[sel].code : null;
    err('code'); err('lib'); q('[data-f=code]').classList.remove('err'); q('[data-f=lib]').classList.remove('err');
    if (!code) { err('code', 'Le code mode de paiement est obligatoire.'); q('[data-f=code]').classList.add('err'); ok = false; }
    else if (data.some(function (x) { return x.code === code && x.code !== ancien; })) { err('code', 'Ce code existe déjà.'); q('[data-f=code]').classList.add('err'); ok = false; }
    if (!lib) { err('lib', 'Le libellé est obligatoire.'); q('[data-f=lib]').classList.add('err'); ok = false; }
    if (!ok) return;
    var rec = { code: code, lib: lib, type: q('[data-f=type]').value, actif: q('[data-f=actif]').checked };
    if (mode === 'creation') { data.push(rec); sel = data.length - 1; } else data[sel] = rec;
    mode = 'consultation'; liste(); form(data[sel]); etat(); onglet('liste'); publier(); toast(ancien ? 'Mode de règlement modifié.' : 'Mode de règlement enregistré.');
  }
  // exports : tableau complet, filtres de la liste compris
  function table() { var L = data.filter(function (m, i) { var tr = tb.children[i]; return !tr || !tr.hidden; }); return { tete: ['Code', 'Libellé', 'Type', 'Statut'], lignes: L.map(function (m) { return [m.code, m.lib, m.type || '—', m.actif ? 'Actif' : 'Inactif']; }) }; }
  function exporter(k) {
    var X = window.EXPORT_TABLEAU, t = table(); if (!X) { toast('Module d’export indisponible.'); return; } if (!t.lignes.length) { toast('Rien à exporter.'); return; }
    if (k === 'pdf') X.pdf('modes_reglement.pdf', 'Modes de règlement', t.lignes.length + ' ligne(s)', t.tete, t.lignes); else X.xlsx('modes_reglement.xlsx', 'Modes de règlement', t.tete, t.lignes);
    toast('Export ' + (k === 'pdf' ? 'PDF' : 'Excel (XLSX)') + ' généré : ' + t.lignes.length + ' ligne(s).');
  }
  function imprimer() {
    var t = table(), w = window.open('', '_blank'); if (!w) { toast('Autorisez les fenêtres pop-up pour imprimer.'); return; }
    w.document.write('<!doctype html><meta charset="utf-8"><title>Modes de règlement</title><style>body{font:13px system-ui,sans-serif;color:#0B1332;margin:24px}h1{font-size:18px}table{border-collapse:collapse;width:100%}th{background:#2E427B;color:#fff;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}td{padding:8px 10px;border-bottom:1px solid #D6D9E0}</style><h1>Modes de règlement</h1><table><thead><tr>' +
      t.tete.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + t.lignes.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
    w.document.close(); w.focus(); setTimeout(function () { w.print(); }, 300);
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.hasAttribute('data-mr-ajouter')) { onglet('saisie'); mode = 'creation'; sel = -1; liste(); form(null); etat(); q('[data-f=code]').focus(); return; }
    if (b.hasAttribute('data-mr-modifier')) { onglet('saisie'); mode = 'edition'; etat(); q('[data-f=lib]').focus(); return; }
    if (b.hasAttribute('data-mr-annuler')) { mode = 'consultation'; liste(); form(sel >= 0 ? data[sel] : null); etat(); return; }
    if (b.hasAttribute('data-mr-enregistrer')) { enregistrer(); return; }
    if (b.hasAttribute('data-mr-supprimer')) {
      var m = data[sel]; if (!m) return;
      if (!window.confirm('Supprimer le mode de règlement « ' + m.lib + ' » ? Cette action est définitive.')) return;
      data.splice(sel, 1); sel = -1; liste(); form(null); etat(); publier(); toast('Mode de règlement supprimé.'); return;
    }
    if (b.hasAttribute('data-mr-imprimer')) { imprimer(); return; }
    if (b.hasAttribute('data-mr-pdf')) { exporter('pdf'); return; }
    if (b.hasAttribute('data-mr-xlsx')) { exporter('xlsx'); return; }
  });
  liste(); form(null); etat(); onglet('liste'); publier();
})();
</script>

<!--
  Base de connaissances et moteur d'analyse de « Assistance financière AI » : transpose le document « Référentiel avancé d'analyse financière »
  (rentabilité, structure financière, liquidité et solvabilité, flux de trésorerie, BFR, investissements et financement, référentiel des ratios et seuils,
  performance opérationnelle, risques et qualité des résultats, budget et scénarios, tableau de bord, méthodologie, format de recommandation, gouvernance, checklist).
  Exposé par window.AI_FIN, lu par ai_assistance.html (écran aifin). Moteur : window.AI_FIN.calculer() calcule les ratios (exercices N et N-1), évalue les seuils d'alerte,
  détecte les signaux d'alerte, classe le risque et produit des recommandations au format standard.
  Base de calcul : balance issue des écritures saisies (window.ECRITURES_PIECES) si elles couvrent produits et charges, sinon jeu de démonstration (MGA, millions).
  Compléments branchés sur les modules : investissements (window.FICHES_IMMOBILISATION), soldes bancaires et caisse (window.RELEVES, window.CAISSE_LOTS).
  Ne pas nommer de fonction « $$ » (build.cjs).
-->
<script>
(function () {
  var F = window.AI_FIN = {};
  F.params = { wacc: 12, tauxImpot: 20, tva: 20 };
  F.avertissement = 'Les seuils de ratios sont des repères indicatifs, pas des normes universelles : l’interprétation doit tenir compte du secteur, du modèle économique, de la taille, de la saisonnalité, du pays, du référentiel comptable et des conditions de financement.';
  F.objectifs = ['Diagnostiquer la performance économique et financière de l’entreprise.', 'Évaluer la rentabilité, la structure financière, la liquidité et la solvabilité.', 'Identifier les risques, les tensions de trésorerie et les signaux d’alerte.', 'Analyser les besoins de financement, les investissements et la capacité de remboursement.', 'Construire des tableaux de bord utiles à la décision.', 'Formuler des recommandations argumentées, priorisées et suivies.'];
  F.perimetre = 'L’analyse doit préciser la période, le périmètre de consolidation, la devise, le référentiel comptable, les méthodes de valorisation, les retraitements opérés et les éventuelles limites de données. Les comparaisons entre entreprises ne sont pertinentes que si les définitions et les bases de calcul sont homogènes.';
  F.architecture = ['Analyse de la rentabilité et des marges', 'Analyse de la structure financière', 'Analyse de la liquidité et de la solvabilité', 'Analyse des flux de trésorerie', 'Analyse du besoin en fonds de roulement (BFR)', 'Analyse des investissements et du financement', 'Référentiel des ratios : formules, interprétations et seuils d’alerte', 'Analyse de la performance opérationnelle', 'Analyse des risques financiers et de la qualité des résultats', 'Analyse budgétaire, prévisionnelle et scénarios', 'Tableaux de bord et pilotage financier', 'Méthodologie d’analyse, gouvernance et recommandations'];

  // ---------- données de démonstration (MGA, millions) ----------
  var DEMO = {
    N: { ca: 3150, achats: 1680, personnel: 760, ext: 410, dot: 95, cf: 62, imp: 32, except: 0, immo: 1240, stocks: 210, clients: 520, autres: 95, treso: 381, cp: 1301, df: 620, dfct: 90, fourn: 330, fisc: 140, adet: 55, fluxOp: 206, capex: 155, empr: 40, remb: 20, div: 0, interets: 62 },
    N1: { ca: 2780, achats: 1450, personnel: 700, ext: 370, dot: 90, cf: 60, imp: 22, except: 0, immo: 1180, stocks: 185, clients: 470, autres: 90, treso: 310, cp: 1190, df: 600, dfct: 80, fourn: 295, fisc: 105, adet: 45, fluxOp: 170, capex: 100, empr: 30, remb: 30, div: 0, interets: 60 },
    budget: { ca: 3300, ebitda: 340, rn: 140, capex: 200 }
  };
  function derive(b) {
    if (!b) return null;
    var o = {}; for (var k in b) o[k] = b[k];
    o.ebitda = o.ca - o.achats - o.personnel - o.ext; o.ebit = o.ebitda - o.dot; o.rn = o.ebit - o.cf - o.imp + (o.except || 0);
    o.actifCourant = o.stocks + o.clients + o.autres + o.treso; o.actif = o.immo + o.actifCourant;
    o.passifCourant = o.fourn + o.fisc + o.adet + o.dfct;
    o.dfLT = o.df - o.dfct; o.detteNette = o.df - o.treso;
    o.frng = (o.cp + o.dfLT) - o.immo; o.bfr = o.stocks + o.clients + o.autres - o.fourn - o.fisc - o.adet;
    o.fcf = o.fluxOp - o.capex; o.chargesExpl = o.achats + o.personnel + o.ext;
    return o;
  }
  // balance issue des écritures saisies : comptes de classe 1 à 7 (montants en millions)
  function depuisSaisies() {
    var P = (Array.isArray(window.ECRITURES_PIECES) ? window.ECRITURES_PIECES : []).filter(function (p) { return p && p.lignes && p.lignes.length; });
    if (!P.length) return null;
    var s = {}; P.forEach(function (p) { p.lignes.forEach(function (l) { var c = String(l.compte || ''), v = (/^d/i.test(l.sens) ? 1 : -1) * (Number(l.montant) || 0) / 1e6; s[c] = (s[c] || 0) + v; }); });
    function som(re, signe) { return Object.keys(s).filter(function (c) { return re.test(c); }).reduce(function (a, c) { return a + s[c]; }, 0) * (signe || 1); }
    var ca = som(/^70/, -1) + som(/^7[1-5]/, -1), ach = som(/^60/) + som(/^61/) * 0, pers = som(/^64/), ext = som(/^6[1-3]/) + som(/^65/), dot = som(/^68/), cf = som(/^66/) - som(/^76/, -1), imp = som(/^69/);
    if (!(ca > 0) || !(ach + pers + ext > 0)) return null;
    var cl = som(/^41/), fo = som(/^40/, -1);
    return { src: 'saisies', pieces: P.length, N: { ca: ca, achats: ach, personnel: pers, ext: ext, dot: dot, cf: Math.max(cf, 0), imp: imp, except: 0, immo: som(/^2/), stocks: som(/^3/), clients: Math.max(cl, 0), autres: Math.max(som(/^4[2-9]/), 0), treso: som(/^5/), cp: som(/^1[0-4]/, -1) || 0, df: som(/^1[5-9]/, -1) || 0, dfct: 0, fourn: Math.max(fo, 0), fisc: 0, adet: 0, fluxOp: NaN, capex: NaN, empr: 0, remb: 0, div: 0, interets: Math.max(cf, 0) }, N1: null, budget: null };
  }
  function mods() {
    var o = { capex: null, banques: null, caisse: null, fiches: 0 };
    var fi = Array.isArray(window.FICHES_IMMOBILISATION) ? window.FICHES_IMMOBILISATION : [];
    if (fi.length) { var an = String(new Date().getFullYear()); o.fiches = fi.length; o.capex = fi.filter(function (x) { return String(x.dateAcquisition || '').slice(0, 4) === an; }).reduce(function (a, x) { return a + (Number(x.valeur) || 0); }, 0) / 1e6; }
    var rl = Array.isArray(window.RELEVES) ? window.RELEVES : [];
    if (rl.length) { var last = {}; rl.forEach(function (r) { if (!last[r.compte] || (r.au || r.date) > (last[r.compte].au || last[r.compte].date)) last[r.compte] = r; }); o.banques = Object.keys(last).reduce(function (a, c) { return a + (Number(last[c].soldeFin) || 0); }, 0) / 1e6; o.comptes = Object.keys(last).length; }
    var lots = Array.isArray(window.CAISSE_LOTS) ? window.CAISSE_LOTS : [];
    if (lots.length) o.caisse = lots.reduce(function (a, l) { var rec = 0, dep = 0; (l.ops || []).forEach(function (x) { rec += Number(x.rec) || 0; dep += Number(x.dep) || 0; }); return a + (Number(l.solde) || 0) + rec - dep; }, 0) / 1e6;
    return o;
  }
  // ---------- ratios : id, domaine, intitulé, formule, interprétation, calcul, unité, repère, évaluation ----------
  function pc(a, b) { return b ? a / b * 100 : null; }
  function rt(a, b) { return b ? a / b : null; }
  function moy(a, b, k) { return b ? (a[k] + b[k]) / 2 : a[k]; }
  var R = F.ratios = [
    { id: 'mbrute', d: 'rentabilite', t: 'Marge brute', f: 'Marge brute / chiffre d’affaires', i: 'Rentabilité après coûts directs ; définition à adapter à l’activité.', u: '%', rep: 'Référence sectorielle', alerte: 'Baisse persistante', c: function (x) { return pc(x.ca - x.achats, x.ca); }, ev: 'baisse' },
    { id: 'mebitda', d: 'rentabilite', t: 'Marge EBITDA', f: 'EBITDA / chiffre d’affaires × 100', i: 'Performance opérationnelle avant amortissements.', u: '%', rep: 'Référence sectorielle', alerte: 'Baisse persistante ou EBITDA ≤ 0', c: function (x) { return pc(x.ebitda, x.ca); }, ev: 'baisse' },
    { id: 'mebit', d: 'rentabilite', t: 'Marge EBIT', f: 'EBIT / chiffre d’affaires × 100', i: 'Rentabilité opérationnelle après amortissements.', u: '%', rep: 'Référence sectorielle', alerte: 'Baisse persistante', c: function (x) { return pc(x.ebit, x.ca); }, ev: 'baisse' },
    { id: 'mnette', d: 'rentabilite', t: 'Marge nette', f: 'Résultat net / chiffre d’affaires × 100', i: 'Rentabilité finale après charges financières et impôts.', u: '%', rep: 'Référence sectorielle', alerte: 'Baisse persistante ou volatilité anormale', c: function (x) { return pc(x.rn, x.ca); }, ev: 'baisse' },
    { id: 'roa', d: 'rentabilite', t: 'ROA', f: 'Résultat opérationnel après impôt / actif économique moyen', i: 'Rendement des actifs économiques.', u: '%', rep: 'Référence sectorielle', alerte: '—', c: function (x, y) { return pc(x.ebit * (1 - F.params.tauxImpot / 100), moy(x, y, 'actif')); }, ev: 'baisse' },
    { id: 'roce', d: 'rentabilite', t: 'ROCE', f: 'EBIT / capital employé moyen × 100', i: 'Rentabilité du capital investi dans l’activité.', u: '%', rep: 'Supérieur au WACC', alerte: 'Durablement inférieur au WACC', c: function (x, y) { var ce = function (z) { return z.cp + z.df; }; return pc(x.ebit, y ? (ce(x) + ce(y)) / 2 : ce(x)); }, ev: function (v) { return v == null ? 'na' : v < F.params.wacc ? 'alerte' : 'ok'; } },
    { id: 'roe', d: 'rentabilite', t: 'ROE', f: 'Résultat net / capitaux propres moyens × 100', i: 'Rendement des capitaux propres.', u: '%', rep: 'Référence sectorielle', alerte: '—', c: function (x, y) { return pc(x.rn, moy(x, y, 'cp')); }, ev: 'baisse' },
    { id: 'autonomie', d: 'structure', t: 'Autonomie financière', f: 'Capitaux propres / total bilan', i: 'Part du financement assurée par les fonds propres.', u: '%', rep: '30 % ou plus parfois recherché', alerte: 'Inférieure à 20 % ; dépendance aux dettes', c: function (x) { return pc(x.cp, x.actif); }, ev: function (v) { return v == null ? 'na' : v < 20 ? 'alerte' : v < 30 ? 'attention' : 'ok'; } },
    { id: 'gearing', d: 'structure', t: 'Gearing', f: 'Dette financière nette / capitaux propres', i: 'Endettement net relatif aux fonds propres.', u: '%', rep: 'Selon contrats de financement', alerte: 'Supérieur à 100 % à investiguer', c: function (x) { return pc(x.detteNette, x.cp); }, ev: function (v) { return v == null ? 'na' : v > 100 ? 'attention' : 'ok'; } },
    { id: 'levier', d: 'structure', t: 'Levier financier', f: 'Total actif / capitaux propres', i: 'Intensité du financement par capitaux propres.', u: 'x', rep: 'Selon secteur', alerte: '—', c: function (x) { return rt(x.actif, x.cp); }, ev: function () { return 'info'; } },
    { id: 'dnebitda', d: 'structure', t: 'Dette nette / EBITDA', f: 'Dette financière nette / EBITDA', i: 'Capacité de désendettement ; sensible à la définition de l’EBITDA.', u: 'x', rep: 'Inférieure à 3 souvent recherchée', alerte: 'Supérieure à 4 ; vérifier stabilité EBITDA et échéances', c: function (x) { return x.ebitda > 0 ? x.detteNette / x.ebitda : null; }, ev: function (v) { return v == null ? 'na' : v > 4 ? 'alerte' : v > 3 ? 'attention' : 'ok'; } },
    { id: 'couvint', d: 'structure', t: 'Couverture des intérêts', f: 'EBIT / charges financières nettes', i: 'Capacité opérationnelle à couvrir les intérêts.', u: 'x', rep: 'Supérieure à 3 souhaitable', alerte: 'Inférieure à 1,5 ; inférieure à 1 : couverture insuffisante par l’EBIT', c: function (x) { return x.cf > 0 ? x.ebit / x.cf : null; }, ev: function (v) { return v == null ? 'na' : v < 1 ? 'critique' : v < 1.5 ? 'alerte' : v < 3 ? 'attention' : 'ok'; } },
    { id: 'frng', d: 'structure', t: 'FRNG', f: 'Ressources stables − emplois stables', i: 'Excédent de ressources stables après financement des immobilisations.', u: 'M', rep: 'Positif', alerte: 'Négatif : actifs longs financés par des dettes courtes', c: function (x) { return x.frng; }, ev: function (v) { return v == null ? 'na' : v < 0 ? 'alerte' : 'ok'; } },
    { id: 'liqgen', d: 'liquidite', t: 'Liquidité générale', f: 'Actifs courants / passifs courants', i: 'Couverture des dettes courantes par les actifs courants.', u: 'x', rep: 'Souvent 1,2 à 2 selon activité', alerte: 'Inférieure à 1 ou dégradation rapide', c: function (x) { return rt(x.actifCourant, x.passifCourant); }, ev: function (v) { return v == null ? 'na' : v < 1 ? 'alerte' : v < 1.2 ? 'attention' : 'ok'; } },
    { id: 'liqred', d: 'liquidite', t: 'Liquidité réduite', f: '(Actifs courants − stocks) / passifs courants', i: 'Couverture hors stocks, souvent moins rapidement mobilisables.', u: 'x', rep: 'Autour de 1 ou plus selon modèle', alerte: 'Inférieure à 1 ; qualité des créances à vérifier', c: function (x) { return rt(x.actifCourant - x.stocks, x.passifCourant); }, ev: function (v) { return v == null ? 'na' : v < 1 ? 'alerte' : 'ok'; } },
    { id: 'liqimm', d: 'liquidite', t: 'Liquidité immédiate', f: 'Disponibilités / passifs courants', i: 'Couverture immédiate, sans encaissements futurs.', u: 'x', rep: 'Selon cycle d’exploitation', alerte: 'Très faible : calendrier réel des échéances à vérifier', c: function (x) { return rt(x.treso, x.passifCourant); }, ev: function (v) { return v == null ? 'na' : v < 0.3 ? 'attention' : 'ok'; } },

    { id: 'fcf', d: 'flux', t: 'Free Cash Flow (FCF)', f: 'Flux opérationnel − investissements nets', i: 'Préciser CAPEX brut/net et traitement des cessions.', u: 'M', rep: 'Positif ou investissement financé', alerte: 'Négatif sur plusieurs exercices sans stratégie financée', c: function (x) { return isNaN(x.fcf) ? null : x.fcf; }, ev: function (v) { return v == null ? 'na' : v < 0 ? 'attention' : 'ok'; } },
    { id: 'cashconv', d: 'flux', t: 'Cash conversion', f: 'Flux opérationnel / EBITDA', i: 'Interpréter sur plusieurs périodes et selon les normes de flux.', u: '%', rep: 'Proche ou supérieur à 70 % selon secteur', alerte: 'Inférieur à 50 %', c: function (x) { return isNaN(x.fluxOp) ? null : pc(x.fluxOp, x.ebitda); }, ev: function (v) { return v == null ? 'na' : v < 50 ? 'attention' : 'ok'; } },
    { id: 'csd', d: 'flux', t: 'Couverture du service de la dette', f: 'Flux disponible pour la dette / service de la dette', i: 'Définir précisément flux, intérêts et principal.', u: 'x', rep: 'Supérieure à 1,2', alerte: 'Inférieure à 1', c: function (x) { var sd = (x.interets || 0) + (x.remb || 0); return isNaN(x.fluxOp) ? null : rt(x.fluxOp, sd); }, ev: function (v) { return v == null ? 'na' : v < 1 ? 'alerte' : v < 1.2 ? 'attention' : 'ok'; } },

    { id: 'cycle', d: 'bfr', t: 'Cycle de conversion de trésorerie (jours)', f: 'DIO + DSO − DPO', i: 'Plus il est long, plus le besoin de financement est élevé.', u: 'j', rep: 'Selon secteur', alerte: 'Hausse persistante', c: function (x, y) { var a = R[24].c(x, y), b = R[23].c(x, y), c = R[25].c(x, y); return a == null ? null : a + b - c; }, ev: 'hausse' }
  ];
  // sécurité : les indices utilisés par le cycle (dio, dso, dpo)
  (function () { var ix = {}; R.forEach(function (r, i) { ix[r.id] = i; }); R[ix.cycle].c = function (x, y) { var a = R[ix.dio].c(x, y), b = R[ix.dso].c(x, y), c = R[ix.dpo].c(x, y); return a == null || b == null || c == null ? null : a + b - c; }; })();
  F.domaines = [
    { id: 'rentabilite', t: 'Rentabilité et marges', k: /rentabilit|marges?|ebitda|ebit\b|\broe\b|\broa\b|\broce\b|r[ée]sultat net|croissance/, ind: ['mbrute', 'mebitda', 'mebit', 'mnette', 'roa', 'roce', 'roe'],

    return S.map(function (s) { var ca = N.ca * (1 + s[1]), m = N.ebitda / N.ca + s[2], eb = ca * m, ebit = eb - N.dot, rn = ebit - N.cf - Math.max(0, (ebit - N.cf)) * F.params.tauxImpot / 100; return { nom: s[0], hyp: 'CA ' + (s[1] >= 0 ? '+' : '') + s[1] * 100 + ' %, marge EBITDA ' + (s[2] >= 0 ? '+' : '') + Math.round(s[2] * 1000) / 10 + ' pt', ca: ca, ebitda: eb, rn: rn, flux: isNaN(N.fluxOp) ? NaN : N.fluxOp + (eb - N.ebitda) * 0.7 }; });
  };
  // VAN, TRI, payback à partir de flux saisis
  F.van = function (inv, flux, taux) {
    var van = -inv; flux.forEach(function (f, i) { van += f / Math.pow(1 + taux / 100, i + 1); });
    var cum = -inv, pay = null; flux.forEach(function (f, i) { var avant = cum; cum += f; if (pay == null && cum >= 0) pay = i + (f ? -avant / f : 0); });
    var lo = -0.99, hi = 10, tri = null, fn = function (t) { var v = -inv; flux.forEach(function (f, i) { v += f / Math.pow(1 + t, i + 1); }); return v; };
    if (fn(lo + 0.0001) * fn(hi) < 0) { for (var k = 0; k < 100; k++) { var mid = (lo + hi) / 2; if (fn(lo) * fn(mid) <= 0) hi = mid; else lo = mid; } tri = (lo + hi) / 2 * 100; }
    var gain = flux.reduce(function (a, b) { return a + b; }, 0) - inv;
    return { van: van, tri: tri, payback: pay, roi: inv ? gain / inv * 100 : null };
  };
  // ---- Contrôles de cohérence des états financiers (égalité actif = passif, résultat, trésorerie, N / N-1, qualité des données) ----
  F.controlesCoherence = function () {
    var r = F.dernier || F.calculer(), N = r.N, N1 = r.N1, L = [], u = r.reel ? 'millions' : 'millions';
    var fm = function (v) { return (Math.round(v * 10) / 10).toLocaleString('fr-FR'); };
    function ctl(code, theme, obj, regle, fn) { var o = { code: code, theme: theme, objectif: obj, regle: regle, st: 'ok', details: [] }; try { var d = fn(); if (d === null) o.st = 'na'; else if (d.length) { o.st = 'anomalie'; o.details = d; } } catch (e) { o.st = 'na'; } L.push(o); }
    var tol = function (a, b) { return Math.max(0.5, Math.abs(a) * 0.005); };
    ctl('FC-01', 'Cohérence des états financiers', 'Égalité actif = passif', 'Total actif = capitaux propres + dettes financières + dettes d’exploitation (' + u + ').', function () {
      var a = N.actif, p = N.cp + N.df + N.fourn + N.fisc + N.adet, e = a - p; return Math.abs(e) > tol(a) ? ['Actif ' + fm(a) + ' ≠ passif ' + fm(p) + ' (écart ' + fm(e) + ')'] : [];
    });
    ctl('FC-02', 'Cohérence des états financiers', 'Concordance du résultat du compte de résultat et du bilan', 'Variation des capitaux propres N − N-1 = résultat net − dividendes versés.', function () {
      if (!N1) return null; var e = (N.cp - N1.cp) - (N.rn - (N.div || 0)); return Math.abs(e) > tol(N.rn) ? ['Variation des capitaux propres ' + fm(N.cp - N1.cp) + ' ≠ résultat net ' + fm(N.rn) + ' − dividendes ' + fm(N.div || 0) + ' (écart ' + fm(e) + ')'] : [];
    });
    ctl('FC-03', 'Cohérence des états financiers', 'Variation de trésorerie du tableau de flux et des soldes bancaires', 'Variation de la trésorerie du bilan = flux d’exploitation − investissements + emprunts − remboursements − dividendes.', function () {
      if (!N1 || isNaN(N.fluxOp)) return null; var flux = N.fluxOp - N.capex + (N.empr || 0) - (N.remb || 0) - (N.div || 0), e = (N.treso - N1.treso) - flux; return Math.abs(e) > tol(flux) ? ['Variation de trésorerie ' + fm(N.treso - N1.treso) + ' ≠ flux du tableau ' + fm(flux) + ' (écart ' + fm(e) + ')'] : [];
    });
    ctl('FC-04', 'Cohérence des états financiers', 'Cohérence entre N et N-1 (capitaux propres d’ouverture)', 'Les capitaux propres d’ouverture de N reprennent la clôture de N-1 (hors résultat et dividendes).', function () {
      if (!N1) return null; var d = []; if (N1.cp > 0 && N.cp < 0) d.push('Capitaux propres devenus négatifs (N-1 : ' + fm(N1.cp) + ' ; N : ' + fm(N.cp) + ')'); if (N1.cp > 0 && Math.abs(N.cp / N1.cp - 1) > 0.5) d.push('Capitaux propres : variation de ' + Math.round((N.cp / N1.cp - 1) * 100) + ' % entre N-1 et N, à justifier'); return d;
    });
    ctl('FC-05', 'Prévisionnels et budgets', 'Équilibre du plan de financement', 'Emplois = ressources sur chaque période (investissements, remboursements, dividendes = flux, emprunts, apports).', function () {
      if (!r.budget || r.budget.capex == null || isNaN(N.fluxOp)) return null; var emplois = r.budget.capex + (N.remb || 0) + (N.div || 0), ressources = N.fluxOp + (N.empr || 0), e = ressources - emplois;
      return e < 0 ? ['Plan de financement déséquilibré : ressources ' + fm(ressources) + ' < emplois ' + fm(emplois) + ' (besoin de financement ' + fm(-e) + ')'] : [];
    });
    ctl('FC-06', 'Évaluation des investissements', 'Recalcul de la VAN, du TRI et du délai de récupération', 'Les indicateurs d’investissement sont recalculés à partir des flux saisis dans l’analyse (« VAN », « TRI »).', function () { return null; });
    ctl('FC-07', 'Qualité des données', 'Valeurs manquantes, signes inversés et unités', 'Aucune valeur manquante ; stocks, clients, fournisseurs et chiffre d’affaires positifs ; pas de saut d’unité (×1 000) entre N-1 et N.', function () {
      var d = [], cles = ['ca', 'achats', 'personnel', 'ext', 'immo', 'stocks', 'clients', 'treso', 'cp', 'df', 'fourn']; cles.forEach(function (c) { if (N[c] == null || isNaN(N[c])) d.push('Valeur manquante : ' + c); });
      ['ca', 'stocks', 'clients', 'fourn', 'immo'].forEach(function (c) { if (N[c] < 0) d.push('Signe inversé probable : ' + c + ' = ' + fm(N[c])); });
      if (N1) cles.forEach(function (c) { if (N1[c] > 0 && N[c] > 0 && (N[c] / N1[c] > 200 || N[c] / N1[c] < 1 / 200)) d.push('Unité incohérente entre N-1 et N pour ' + c + ' (rapport ' + Math.round(N[c] / N1[c]) + ')'); });
      return d;
    });
    ctl('FC-08', 'Qualité des données', 'Traçabilité entre chiffre présenté et donnée source', 'Chaque agrégat provient d’écritures saisies ou d’un jeu identifié.', function () { return r.reel ? [] : ['Chiffres issus du jeu de démonstration : aucune écriture saisie exploitable pour tracer les agrégats']; });
    var out = { source: r.src, date: new Date(), lignes: L, nbAnomalies: L.reduce(function (a, x) { return a + x.details.length; }, 0), nbNa: L.filter(function (x) { return x.st === 'na'; }).length };
    F.dernierCoherence = out; return out;
  };
})();
</script>

<!--
  Écran « Procédure FIDA › États RFI › Édition des états RFI » — édition des six rapports RFI, indépendante de l'État de dépense : pop-up de critères
  (Convention / instrument FIDA, Rapport I à VI, Période du … au …, Monnaie du compte désigné), puis le rapport tel que défini dans le Designer de déclaration
  (modèles RFI I à VI : lignes de catégories et de composantes générées depuis le plan, formules et contrôles d'équilibre). Exports PDF et Excel.
  Les catégories affichées suivent « Paramètres RFI ». Montants de démonstration. Préfixe re / data-re. Ne pas nommer de fonction « $$ » (build.cjs).
-->
<style>
[data-re]{width:100%;color:#353944;font-size:12px}
[data-re] .re-ov{position:fixed;inset:0;z-index:50;background:rgba(11,19,50,.5);display:flex;align-items:center;justify-content:center;padding:16px}[data-re] .re-ov[hidden]{display:none}
[data-re] .re-dlg{width:100%;max-width:640px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 12px 32px -8px rgba(11,19,50,.3)}
[data-re] .re-dh{display:flex;justify-content:flex-end;padding:8px 12px 0}
[data-re] .re-x{width:36px;height:36px;border:0;border-radius:8px;background:none;color:#474C58;font-size:16px;cursor:pointer}[data-re] .re-x:hover{background:#E9EBF0}
[data-re] .re-db{overflow:auto;padding:8px 20px 16px;display:grid;gap:16px}
[data-re] .re-pan{background:#fff;border:1px solid #E9EBF0;border-radius:12px}[data-re] .re-pan>h2{margin:0;padding:12px 16px;border-bottom:1px solid #E9EBF0;font-family:var(--font-heading);font-size:14px;font-weight:600;color:#0B1332}
[data-re] .re-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px}[data-re] .re-g .w{grid-column:1/-1}
@media (max-width:700px){[data-re] .re-g{grid-template-columns:1fr}}
[data-re] .re-c{display:flex;flex-direction:column;gap:4px;min-width:0}[data-re] .re-c>span{font-size:12px;font-weight:600;color:#474C58}
[data-re] .re-in,[data-re] .re-sel{width:100%;box-sizing:border-box;height:36px;border:1px solid #878D9A;border-radius:8px;background:#fff;color:#353944;font:inherit;font-size:12px;padding:0 12px}
[data-re] .re-in:focus-visible,[data-re] .re-sel:focus-visible,[data-re] .re-b:focus-visible,[data-re] .re-x:focus-visible{outline:3px solid #2E427B;outline-offset:2px}
[data-re] .re-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #E9EBF0}
[data-re] .re-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid #D6D9E0;border-radius:8px;background:#fff;color:#474C58;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
[data-re] .re-b:hover{background:#E9EBF0}[data-re] .re-b.pri{background:#2E427B;border-color:#2E427B;color:#fff}[data-re] .re-b.pri:hover{background:#243569}
[data-re] .re-vide{padding:48px 16px;text-align:center;color:#5B606D;font-size:14px}[data-re] .re-vide[hidden]{display:none}
[data-re] .re-ok{font-size:12px;color:#2E427B;margin-left:8px}[data-re] .re-er{display:none;color:#B63132;font-size:12px}[data-re] .re-er.show{display:block}
[data-re] .re-res{background:#fff;border:1px solid #E9EBF0;border-radius:12px;padding:16px;overflow:auto}[data-re] .re-res[hidden]{display:none}
[data-re] .rfi-t td{overflow:hidden;text-overflow:ellipsis}
</style>

<div class="bp-root" data-re>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0">Édition des états RFI</h1>

  <div class="no-print">
    <button type="button" data-re-criteres>Critères</button>
    <button type="button" data-re-pdf>PDF</button>
    <button type="button" data-re-xlsx>Excel (XLSX)</button>
    <span class="re-ok" data-re-msg role="status"></span>
  </div>

  <div class="re-ov" data-re-ov hidden>
    <div class="re-dlg" role="dialog" aria-modal="true" aria-label="Critères d'édition — États RFI">
      <div class="re-dh"><button type="button" class="re-x" data-re-fermer aria-label="Fermer"><i class="ti ti-x"></i></button></div>
      <div class="re-db">
        <section class="re-pan" aria-label="Critères de sélection"><h2>Critères de sélection</h2>
          <div class="re-g">
            <label class="re-c w"><span>Convention (instrument FIDA) <b style="color:#B63132">*</b></span><select class="re-sel" data-c="conv"></select></label>
            <label class="re-c w"><span>Rapport <b style="color:#B63132">*</b></span><select class="re-sel" data-c="rapport"></select></label>
            <label class="re-c"><span>Période du</span><input class="re-in" type="date" data-c="du"></label>
            <label class="re-c"><span>Au</span><input class="re-in" type="date" data-c="au"></label>
            <label class="re-c w"><span>Monnaie du compte désigné</span><select class="re-sel" data-c="monnaie"></select></label>
          </div>
          <div class="re-er" data-re-er role="alert" style="padding:0 16px 12px"></div></section>
      </div>
      <div class="re-df"><button type="button" class="re-b" data-re-reset><i class="ti ti-refresh"></i>Réinitialiser</button><button type="button" class="re-b" data-re-fermer>Annuler</button><button type="button" class="re-b pri" data-re-consulter><i class="ti ti-search"></i>Rechercher</button></div>
    </div>
  </div>

  <div class="re-vide" data-re-vide>Aucun état édité. Utilisez « Critères » pour lancer l'édition.</div>
  <section class="re-res" data-re-res hidden></section>
</div>

<script>
(function () {
  var root = document.querySelector('[data-re]'); if (!root) return;
  function q(s) { return root.querySelector(s); } function qa(s) { return [].slice.call(root.querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function msg(t) { q('[data-re-msg]').textContent = t || ''; }
  function c(n) { return q('[data-c="' + n + '"]'); }
  function maj(s) { if (s && s.__combo && s.__combo.maj) s.__combo.maj(); }
  var RAPPORTS = [['RFI_I', 'I — PTBA et plan de trésorerie'], ['RFI_II', 'II — Sources et utilisations des fonds'], ['RFI_III', 'III — Activité du compte désigné'], ['RFI_IV', 'IV — Écart de l’utilisation des fonds par trimestre'], ['RFI_V', 'V — Écart de l’utilisation des fonds, exercice'], ['RFI_VI', 'VI — Écart de l’utilisation des fonds, cumulé']];
  var etat = null;
  function plan() { return (window.PLANS_CFG || []).filter(function (p) { return p.code === 'PLAN3'; })[0] || { niveaux: [] }; }
  function lignes() { var L = window.PLANS_LIGNES && window.PLANS_LIGNES.PLAN3; return (L && L.rows ? L.rows : []).filter(function (r) { return r.actif !== false; }); }
  function conventions() {
    var L = lignes(), nv = plan().niveaux;
    return L.filter(function (r) { var d = 0, p = r.parent, g = 0; while (p && g++ < 10) { d++; p = (L.filter(function (x) { return x.code === p; })[0] || {}).parent; } return nv[d] && nv[d].type === 'CONVENTION' && /fida/i.test(r.extra || ''); });
  }
  function dt(d) { return d ? d.split('-').reverse().join('/') : ''; }
  function devises() { var d = (window.DEVISES || []).filter(function (x) { return x.actif !== false && x.code !== 'MGA'; }).map(function (x) { return x.code; }); return ['MGA'].concat(d); }

  var ov = q('[data-re-ov]');
  function remplir() {
    var C = conventions(), v = c('conv').value, r = c('rapport').value;
    c('conv').innerHTML = C.map(function (x) { return '<option value="' + esc(x.code) + '">' + esc(x.code) + ' — ' + esc(x.libelle) + '</option>'; }).join('');
    c('conv').value = C.some(function (x) { return x.code === v; }) ? v : (C[0] || {}).code || '';
    c('rapport').innerHTML = RAPPORTS.map(function (x) { return '<option value="' + x[0] + '">' + esc(x[1]) + '</option>'; }).join(''); c('rapport').value = r || 'RFI_I';
    c('monnaie').innerHTML = devises().map(function (x) { return '<option>' + x + '</option>'; }).join('');
    ['conv', 'rapport', 'monnaie'].forEach(function (k) { maj(c(k)); });
  }
  function ouvrir() { remplir(); ov.hidden = false; c('rapport').focus(); }
  function fermer() { ov.hidden = true; }
  qa('[data-re-fermer]').forEach(function (b) { b.addEventListener('click', fermer); });
  q('[data-re-criteres]').addEventListener('click', ouvrir);
  root.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !ov.hidden) fermer(); });
  function initDates() { c('du').value = '2026-01-01'; c('au').value = '2026-03-31'; }
  q('[data-re-reset]').addEventListener('click', function () { initDates(); c('rapport').value = 'RFI_I'; maj(c('rapport')); etat = null; q('[data-re-res]').hidden = true; q('[data-re-vide]').hidden = false; q('[data-re-er]').classList.remove('show'); msg(''); });

  function consulter() {
    var er = q('[data-re-er]'); er.classList.remove('show');
    if (!c('conv').value) { er.textContent = 'Aucune convention FIDA dans le plan financier.'; er.classList.add('show'); return; }
    if (c('du').value && c('au').value && c('du').value > c('au').value) { er.textContent = 'La période est incohérente : la date de début dépasse la date de fin.'; er.classList.add('show'); return; }
    if (c('monnaie').value !== 'MGA') { er.textContent = 'Aucun cours en vigueur pour ' + c('monnaie').value + ' : l’édition se fait en monnaie locale.'; er.classList.add('show'); return; }
    if (!window.__ddGrid || !window.__ddGrid.rfiHtml) { er.textContent = 'Le moteur des modèles n’est pas chargé.'; er.classList.add('show'); return; }
    var conv = conventions().filter(function (x) { return x.code === c('conv').value; })[0] || {}, code = c('rapport').value;
    window.__rfiConv = conv.code;
    window.__ejcdCtx = Object.assign({}, window.__ejcdCtx || {}, { 'Période du': dt(c('du').value), 'Période au': dt(c('au').value), 'Instrument FIDA': (conv.libelle || 'Prêt FIDA'), 'Instrument n°': conv.code || '01', 'Monnaie compte désigné': c('monnaie').value, 'Situation au': dt(c('au').value) });
    etat = { code: code, nom: (RAPPORTS.filter(function (x) { return x[0] === code; })[0] || [])[1] || code, conv: conv };
    q('[data-re-res]').innerHTML = window.__ddGrid.rfiHtml(code); q('[data-re-res]').hidden = false; q('[data-re-vide]').hidden = true; fermer(); msg('Rapport RFI ' + etat.nom.split(' ')[0] + ' édité.');
  }
  q('[data-re-consulter]').addEventListener('click', consulter);

  function exporter(k) {
    if (!etat) { ouvrir(); msg('Lancez d’abord l’édition (Critères).'); return; }
    var X = window.EXPORT_TABLEAU; if (!X) { msg('Module d’export indisponible.'); return; }
    var d = window.__ddGrid.rfiRows(etat.code), ligne = d.lignes.filter(function (l) { return l.some(function (x) { return String(x).trim(); }); });
    var tete = []; for (var i = 0; i < d.cols; i++) tete.push(i === 0 ? 'Désignation' : 'Colonne ' + i);
    if (k === 'pdf') X.pdf('rfi_' + etat.code.slice(4) + '.pdf', 'RFI ' + etat.nom, ligne.length + ' ligne(s)', tete, ligne); else X.xlsx('rfi_' + etat.code.slice(4) + '.xlsx', 'RFI ' + etat.nom, tete, ligne);
    msg('Export ' + (k === 'pdf' ? 'PDF' : 'Excel (XLSX)') + ' généré.');
  }
  q('[data-re-pdf]').addEventListener('click', function () { exporter('pdf'); }); q('[data-re-xlsx]').addEventListener('click', function () { exporter('xlsx'); });
  function auto() { if (location.hash === '#rfiedit' && ov.hidden && !etat) setTimeout(ouvrir, 700); }
  window.addEventListener('hashchange', auto);
  initDates(); auto();
})();
</script>

<!--
  Écran « Paramétrage du tableau de flux de trésorerie » (États financiers › Tableau de flux de trésorerie › Paramétrages) — modèles du TFT,
  lignes (nature Grille / Regroupement / Formule / Titre, style, type, type de mouvement, ligne de rupture), liste filtrable et saisie en onglets.
  Même mise en page que le paramétrage du bilan. Données en mémoire. Ne pas nommer de fonction « $$ » (build.cjs).
-->
<style>
.bp-root{width:100%;color:#353944;font-size:12px}
.bp-eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#706000}
.bp-h1{margin:0;font-family:var(--font-heading);font-size:24px;font-weight:600;line-height:1.2;color:#0B1332}
.bp-sub{margin:4px 0 16px;color:#5B606D;font-size:14px}
.bp-modele{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;padding:12px 0 16px;border-top:1px solid #E9EBF0}
.bp-champ{display:flex;flex-direction:column;gap:4px;min-width:0}
.bp-champ>span,.bp-lab{font-size:12px;font-weight:600;color:#474C58}
.bp-champ>span b,.bp-lab b{color:#B63132;font-weight:600}
.bp-in,.bp-sel,.bp-ta{width:100%;box-sizing:border-box;border:1px solid #878D9A;border-radius:8px;background:#fff;color:#353944;font:inherit;font-size:12px;padding:0 12px}
.bp-in,.bp-sel{height:36px}
.bp-ta{padding:8px 12px;min-height:64px;resize:vertical}
.bp-in:disabled,.bp-sel:disabled,.bp-ta:disabled{background:#F5F7F9;border-color:#D6D9E0;color:#747A88;cursor:not-allowed}
.bp-in:focus-visible,.bp-sel:focus-visible,.bp-ta:focus-visible,.bp-b:focus-visible{outline:3px solid #2E427B;outline-offset:2px}
.bp-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:1px solid #D6D9E0;border-radius:8px;background:#fff;color:#474C58;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.bp-b:hover:not(:disabled){background:#E9EBF0}.bp-b:disabled{opacity:.5;cursor:not-allowed}
.bp-b.ico{width:36px;padding:0}
.bp-grid{display:block}
.bp-pan[hidden]{display:none}
.bp-pan[data-bp-pan=saisie]>h2{display:none}
.bp-tabs{display:flex;gap:4px;border-bottom:1px solid #E9EBF0;margin-bottom:16px}
.bp-tabs button{height:36px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:none;font:inherit;font-size:12px;font-weight:600;color:#5B606D;cursor:pointer}
.bp-tabs button.on{color:#2E427B;border-bottom-color:#2E427B}
.bp-tabs button:focus-visible{outline:3px solid #2E427B;outline-offset:-3px}
.bp-n{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:#E9EBF0;color:#474C58;font-weight:600}
.bp-n:empty{display:none}
.bp-pan{background:#fff;border:1px solid #E9EBF0;border-radius:12px;overflow:hidden}
.bp-pan>h2{margin:0;padding:12px 16px;border-bottom:1px solid #E9EBF0;font-family:var(--font-heading);font-size:14px;font-weight:600;color:#0B1332;display:flex;justify-content:space-between;align-items:center}
.bp-pan>h2 small{font:400 12px var(--font-sans);color:#5B606D}
.bp-tb{width:100%;border-collapse:collapse}
.bp-tb th{padding:8px 12px;background:#F5F7F9;border-bottom:1px solid #E9EBF0;text-align:left;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5B606D;white-space:nowrap}
.bp-tb td{padding:8px 12px;border-bottom:1px solid #E9EBF0}
.bp-tb tbody tr{cursor:pointer}.bp-tb tbody tr:hover td{background:#F4F7FE}
.bp-tb tbody tr.sel td{background:#E3EBFE;box-shadow:inset 3px 0 0 #2E427B}
.bp-tb tbody tr.sel td:not(:first-child){box-shadow:none}
.bp-tb{min-width:1200px}
.bp-tb th:nth-child(2),.bp-tb td:nth-child(2){min-width:280px}
.bp-tb th:nth-child(1),.bp-tb td:nth-child(1){min-width:70px}
.bp-tb th{text-align:center;text-transform:none;letter-spacing:0;font-size:12px;color:#0B1332}
.bp-tb td{text-align:left}
.bp-tb td.c,.bp-tb th.c{text-align:center}
.bp-tb tr.flt th{padding:4px;background:#F5F7F9;font-weight:400}
.bp-tb tr.flt input,.bp-tb tr.flt select{width:100%;min-width:0;border-color:#D6D9E0;padding:0 6px}
.bp-tb tr.t-titre td:nth-child(2),.bp-tb tr.t-total td:nth-child(2){font-weight:700}
.bp-tb input[type=checkbox]{width:16px;height:16px;accent-color:#2E427B;margin:0;pointer-events:none}
.bp-pill{display:inline-block;padding:2px 8px;border-radius:6px;background:#E9EBF0;color:#474C58;font-size:12px;font-weight:600}
.bp-pill.actif{background:#E3EBFE;color:#243569}.bp-pill.passif{background:#F9F8E7;color:#706000}
.bp-vide{padding:32px 16px;text-align:center;color:#5B606D}
.bp-form{padding:16px;display:grid;gap:16px}
.bp-l3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bp-l3 .bp-span2{grid-column:span 2}
@media (max-width:700px){.bp-l3{grid-template-columns:1fr}.bp-l3 .bp-span2{grid-column:auto}}
.bp-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.bp-2{grid-template-columns:1fr}}
.bp-2[hidden],.bp-champ[hidden]{display:none!important}
.bp-gr{display:grid;gap:8px;min-width:0}
.bp-gr h3{margin:0;font-size:12px;font-weight:700;color:#0B1332}
.bp-gb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bp-gtools{display:flex;gap:4px}
.bp-gw{border:1px solid #D6D9E0;min-height:220px;background:#fff}
.bp-gt{width:100%;border-collapse:collapse;table-layout:fixed}
.bp-gt td .bp-in,.bp-gt td .bp-sel{border-color:transparent;background:transparent;text-align:center;padding:0 4px}
.bp-gt td .bp-in:hover:not(:disabled),.bp-gt td .bp-sel:hover:not(:disabled),.bp-gt td .bp-in:focus,.bp-gt td .bp-sel:focus{border-color:#878D9A;background:#fff}
.bp-gt td .bp-in:disabled,.bp-gt td .bp-sel:disabled{background:transparent;border-color:transparent;color:#353944}
.bp-gt td .bp-sel{appearance:none;-webkit-appearance:none}
.bp-gt td .bp-b.ico{border-color:transparent;color:#2E427B}
.bp-gt th{padding:8px;border:1px solid #E9EBF0;background:#fff;font-size:12px;font-weight:700;text-align:center;color:#0B1332}
.bp-gt td{padding:4px;border:1px solid #E9EBF0}
.bp-gt th:last-child,.bp-gt td:last-child{width:44px;text-align:center}
.bp-gt th:nth-child(3),.bp-gt td:nth-child(3){width:72px}
.bp-gt .bp-in,.bp-gt .bp-sel{border-color:#D6D9E0}
.bp-ge{min-height:150px;display:flex;align-items:center;justify-content:center;color:#747A88;font-size:16px}
.bp-ge[hidden]{display:none}
.bp-aide{margin:0;padding:10px 12px;border-left:3px solid #2E427B;background:#F5F7F9;color:#474C58;font-size:12px}
.bp-radios{display:flex;flex-wrap:wrap;gap:6px 16px}
.bp-radios label,.bp-chk label{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.bp-radios input,.bp-chk input{width:16px;height:16px;accent-color:#2E427B;margin:0}
.bp-sect{border:1px solid #E9EBF0;border-radius:8px;padding:12px;display:grid;gap:8px}
.bp-sect>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bp-sect>.hd strong{font-size:12px;font-weight:700;color:#0B1332}
.bp-note{margin:0;font-size:12px;color:#5B606D}
.bp-opt-t{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;font-size:12px;font-weight:700;color:#2E427B;cursor:pointer;height:36px}
.bp-opt{display:grid;gap:12px;padding-top:4px}
.bp-chk{display:flex;flex-wrap:wrap;gap:8px 16px}
.bp-ov{position:fixed;inset:0;z-index:50;background:rgba(11,19,50,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.bp-ov[hidden]{display:none}
.bp-dlg{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:20px;display:grid;gap:12px;box-shadow:0 12px 32px -8px rgba(11,19,50,.3)}
.bp-dlg h3{margin:0;font-family:var(--font-heading);font-size:16px;font-weight:600;color:#0B1332}
.bp-dlg .ft{display:flex;justify-content:flex-end;gap:8px}
.bp-b.pri{background:#2E427B;border-color:#2E427B;color:#fff}.bp-b.pri:hover:not(:disabled){background:#243569}
.bp-toast{position:fixed;top:16px;right:16px;z-index:50;background:#0B1332;color:#fff;border-radius:8px;padding:10px 16px;font-size:12px;font-weight:600}
.bp-toast[hidden]{display:none}
</style>
<style>
.bp-box{border:1px solid #D6D9E0;border-radius:8px;margin:0;padding:8px 12px 12px;min-width:0}
.bp-box legend{padding:0 6px;font-size:12px;font-weight:700;color:#2E427B}
.bp-box .bp-radios,.bp-box .bp-chk{padding-top:4px}
.tp-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.tp-2>div{display:grid;gap:12px;min-width:0}
@media (max-width:900px){.tp-2{grid-template-columns:1fr}}
.tp-r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.tp-r2{grid-template-columns:1fr}}
</style>

<div class="bp-root" data-tp>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0">Paramétrage du tableau de flux de trésorerie</h1>

  <div class="bp-modele">
    <label class="bp-champ" style="flex:1;max-width:420px"><span>Modèle du TFT</span>
      <select class="bp-sel" data-tp-modele><option value="">— Sélectionner un modèle —</option></select></label>
  </div>

  <div class="no-print" data-tp-actions>
    <button type="button" data-tp-ajouter>Ajouter</button>
    <button type="button" data-tp-nouveau>Nouveau modèle</button>
    <button type="button" data-tp-dupliquer disabled>Dupliquer</button>
    <button type="button" data-tp-supprimer-modele disabled>Supprimer</button>
    <button type="button" data-tp-modifier>Modifier</button>
    <button type="button" data-tp-enregistrer>Enregistrer</button>
    <button type="button" data-tp-annuler>Annuler</button>
    <button type="button" data-tp-imprimer>Imprimer</button>
    <button type="button" data-tp-exporter>Exporter</button>
    <button type="button" data-bil-vers="tfted">Édition</button>
  </div>

  <div class="bp-tabs" role="tablist">
    <button type="button" role="tab" class="on" data-tp-tab="saisie">Saisie</button>
    <button type="button" role="tab" data-tp-tab="liste">Liste <span class="bp-n" data-tp-compte></span></button>
  </div>
  <div class="bp-grid">
    <section class="bp-pan" aria-label="Lignes du TFT" data-tp-pan="liste" hidden>
      <h2>Lignes du TFT <small>Double-clic ou « Modifier » pour ouvrir la ligne en saisie</small></h2>
      <div style="overflow:auto;max-height:560px">
        <table class="bp-tb" style="min-width:900px"><thead>
          <tr><th>Ligne</th><th>Libellé</th><th>Nature</th><th>Type</th><th>Type de mouvement</th><th>Tri</th><th>Rupture</th></tr>
          <tr class="flt">
            <th><input class="bp-in" data-fc="0" aria-label="Filtrer Ligne"></th><th><input class="bp-in" data-fc="1" aria-label="Filtrer Libellé"></th><th><input class="bp-in" data-fc="2" aria-label="Filtrer Nature"></th>
            <th><input class="bp-in" data-fc="3" aria-label="Filtrer Type"></th><th><input class="bp-in" data-fc="4" aria-label="Filtrer Type de mouvement"></th><th><input class="bp-in" data-fc="5" aria-label="Filtrer Tri"></th>
            <th><select class="bp-sel" data-fc="6" aria-label="Filtrer Rupture"><option value=""></option><option value="oui">Oui</option><option value="non">Non</option></select></th>
          </tr></thead><tbody data-tp-lignes></tbody></table>
      </div>
      <div class="bp-vide" data-tp-vide>Sélectionnez ou créez un modèle pour afficher ses lignes.</div>
    </section>

    <section class="bp-pan" aria-label="Saisie" data-tp-pan="saisie">
      <h2>Saisie <small data-tp-mode>Consultation</small></h2>
      <form class="bp-form" data-tp-form onsubmit="return false">
        <div class="tp-2">
          <div>
            <label class="bp-champ"><span>Ligne du TFT <b>*</b></span><input class="bp-in" data-f="code" maxlength="12"></label>
            <label class="bp-champ"><span>Libellé <b>*</b></span><input class="bp-in" data-f="libelle"></label>
          </div>
          <div>
            <label class="bp-champ"><span>Tri</span><input class="bp-in" data-f="tri" inputmode="numeric"></label>
          </div>
        </div>
        <div class="tp-2">
          <fieldset class="bp-box"><legend>Nature</legend>
            <div class="bp-radios">
              <label><input type="radio" name="tp-nature" value="grille">Grille</label><label><input type="radio" name="tp-nature" value="regroupement">Regroupement</label>
              <label><input type="radio" name="tp-nature" value="formule">Formule</label><label><input type="radio" name="tp-nature" value="titre">Titre</label>
            </div></fieldset>
          <fieldset class="bp-box"><legend>Style</legend>
            <div class="bp-chk"><label><input type="checkbox" data-c="gras">Gras</label><label><input type="checkbox" data-c="italique">Italique</label><label><input type="checkbox" data-c="vide">Ligne vide</label></div></fieldset>
        </div>
        <div class="tp-r2">
          <label class="bp-champ"><span>Type</span><select class="bp-sel" data-f="type"><option value=""></option><option>Flux d'exploitation</option><option>Flux d'investissement</option><option>Flux de financement</option></select></label>
          <label class="bp-champ"><span>Type de mouvement</span><select class="bp-sel" data-f="mouvement"><option value=""></option><option>Débit</option><option>Crédit</option><option>Solde</option><option>Variation</option></select></label>
        </div>
        <div class="bp-chk"><label><input type="checkbox" data-c="rupture">Ajout d'une ligne de rupture contenant le montant total du regroupement</label></div>
      </form>
    </section>
  </div>

  <div class="bp-ov" hidden data-tp-ov>
    <div class="bp-dlg" role="dialog" aria-modal="true" aria-labelledby="tp-dt">
      <h3 id="tp-dt">Nouveau modèle</h3>
      <label class="bp-champ"><span>Code <b>*</b></span><input class="bp-in" data-n="code" maxlength="12"></label>
      <label class="bp-champ"><span>Libellé <b>*</b></span><input class="bp-in" data-n="libelle"></label>
      <p class="bp-note" data-n-err style="color:#B63132" hidden></p>
      <div class="ft"><button type="button" class="bp-b" data-n-annuler>Annuler</button><button type="button" class="bp-b pri" data-n-ok>Créer</button></div>
    </div>
  </div>
  <div class="bp-toast" role="status" hidden data-tp-toast></div>
</div>

<script>
(function () {
  var root = document.querySelector('[data-tp]'); if (!root) return;
  function q(s) { return root.querySelector(s); } function qa(s) { return [].slice.call(root.querySelectorAll(s)); }
  var NAT = { grille: 'Grille', regroupement: 'Regroupement', formule: 'Formule', titre: 'Titre' };
  function L(code, tri, libelle, nature, type, mouvement, rupture) { return { code: code, tri: tri, libelle: libelle, nature: nature, type: type || '', mouvement: mouvement || '', rupture: !!rupture, gras: nature === 'titre' || nature === 'regroupement', italique: false, vide: false }; }
  var modeles = [{ id: '1', libelle: 'Modèle N° 1', lignes: [
    L('F1', 10, "Flux de trésorerie liés à l'activité", 'titre'),
    L('F11', 20, 'Encaissements reçus des clients', 'grille', "Flux d'exploitation", 'Débit'),
    L('F12', 30, 'Décaissements aux fournisseurs', 'grille', "Flux d'exploitation", 'Crédit'),
    L('FA', 40, "Total des flux liés à l'activité", 'regroupement', "Flux d'exploitation", 'Solde', true),
    L('F2', 50, "Flux de trésorerie liés à l'investissement", 'titre'),
    L('F21', 60, "Acquisitions d'immobilisations", 'grille', "Flux d'investissement", 'Crédit'),
    L('FT', 70, 'Variation de la trésorerie nette', 'formule', '', 'Variation')
  ] }, { id: '2', libelle: 'Modèle N° 2', lignes: [] }];
  var cur = null, sel = -1, mode = 'consultation';
  var sM = q('[data-tp-modele]'), tb = q('[data-tp-lignes]');
  function toast(m) { var t = q('[data-tp-toast]'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 2200); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function refModeles(g) { sM.innerHTML = '<option value="">— Sélectionner un modèle —</option>' + modeles.map(function (m) { return '<option value="' + m.id + '">' + m.id + ' - ' + m.libelle + '</option>'; }).join(''); sM.value = g || ''; }
  function modele() { return modeles.filter(function (m) { return m.id === sM.value; })[0] || null; }
  function filtrer() {
    var F = qa('[data-fc]').map(function (e) { return e.value.trim().toLowerCase(); });
    qa('[data-tp-lignes] tr').forEach(function (tr) { tr.hidden = F.some(function (v, k) { if (!v) return false; var td = tr.children[k]; var t = (td.dataset.v || td.textContent).toLowerCase(); return k === 6 ? t !== v : t.indexOf(v) < 0; }); });
  }
  qa('[data-fc]').forEach(function (e) { e.addEventListener('input', filtrer); e.addEventListener('change', filtrer); });
  function renderLignes() {
    var m = modele(); cur = m;
    q('[data-tp-dupliquer]').disabled = !m; q('[data-tp-supprimer-modele]').disabled = !m;
    q('[data-tp-vide]').hidden = !!m && m.lignes.length > 0;
    q('[data-tp-vide]').textContent = !m ? 'Sélectionnez ou créez un modèle pour afficher ses lignes.' : "Ce modèle n'a pas encore de ligne : utilisez « Ajouter ».";
    q('[data-tp-compte]').textContent = m ? m.lignes.length + ' ligne' + (m.lignes.length > 1 ? 's' : '') : '';
    tb.innerHTML = m ? m.lignes.map(function (l, i) { return { l: l, i: i }; }).sort(function (a, b) { return (+a.l.tri || 0) - (+b.l.tri || 0); }).map(function (o) {
      var l = o.l;
      return '<tr data-i="' + o.i + '" class="t-' + l.nature + (o.i === sel ? ' sel' : '') + '"><td>' + esc(l.code) + '</td><td>' + esc(l.libelle) + '</td><td>' + NAT[l.nature] + '</td><td>' + esc(l.type) + '</td><td>' + esc(l.mouvement) + '</td><td class="c">' + esc(l.tri) + '</td>' +
        '<td class="c" data-v="' + (l.rupture ? 'oui' : 'non') + '"><input type="checkbox" tabindex="-1" aria-label="Rupture"' + (l.rupture ? ' checked' : '') + '></td></tr>';
    }).join('') : '';
    filtrer();
  }
  function remplirForm(l) {
    var vide = !l; l = l || L('', '', '', '', '', '');
    qa('[data-f]').forEach(function (e) { e.value = l[e.dataset.f] == null ? '' : l[e.dataset.f]; });
    qa('[name=tp-nature]').forEach(function (r) { r.checked = !vide && r.value === l.nature; });
    qa('[data-c]').forEach(function (c) { c.checked = !!l[c.dataset.c]; });
  }
  function appliquerMode() {
    var ed = mode !== 'consultation';
    qa('[data-tp-form] input,[data-tp-form] select').forEach(function (e) { e.disabled = !ed; });
    q('[data-tp-mode]').textContent = mode === 'creation' ? 'Création' : mode === 'edition' ? 'Modification' : 'Consultation';
    var m = modele(), a = q('[data-tp-actions]');
    a.querySelector('[data-tp-ajouter]').disabled = !m || ed; a.querySelector('[data-tp-modifier]').disabled = !m || ed || sel < 0;
    a.querySelector('[data-tp-enregistrer]').disabled = !ed; a.querySelector('[data-tp-annuler]').disabled = !ed;
    a.querySelector('[data-tp-imprimer]').disabled = !m; a.querySelector('[data-tp-exporter]').disabled = !m;
  }
  function onglet(n) { qa('[data-tp-pan]').forEach(function (p) { p.hidden = p.dataset.tpPan !== n; }); qa('[data-tp-tab]').forEach(function (t) { var on = t.dataset.tpTab === n; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); }); }
  function choisir(i) { if (mode !== 'consultation') return; sel = i; renderLignes(); remplirForm(cur.lignes[i]); appliquerMode(); }
  qa('[data-tp-tab]').forEach(function (t) { t.addEventListener('click', function () { onglet(t.dataset.tpTab); }); });
  tb.addEventListener('click', function (e) { var tr = e.target.closest('tr[data-i]'); if (tr) choisir(+tr.dataset.i); });
  tb.addEventListener('dblclick', function (e) { var tr = e.target.closest('tr[data-i]'); if (tr) { choisir(+tr.dataset.i); onglet('saisie'); } });
  sM.addEventListener('change', function () { sel = -1; mode = 'consultation'; renderLignes(); remplirForm(null); appliquerMode(); });

  function enregistrer() {
    var l = {}; qa('[data-f]').forEach(function (e) { l[e.dataset.f] = e.value.trim(); }); qa('[data-c]').forEach(function (c) { l[c.dataset.c] = c.checked; });
    var n = qa('[name=tp-nature]:checked')[0]; l.nature = n && n.value; l.tri = parseInt(l.tri, 10) || '';

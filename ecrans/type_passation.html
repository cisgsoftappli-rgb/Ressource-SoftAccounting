<!--
  Écran « Type de passation » (Gestion des contrats › Paramétrages › Type de passation) — onglets Saisie / Liste : liste filtrable (Code, Libellé, Statut),
  saisie (Code *, Libellé *, case « Actif »). Boutons dans la barre d'actions (Ajouter, Modifier, Supprimer, Enregistrer, Annuler, Importer, Imprimer, PDF, Excel).
  ATTENTION : ce fichier a évolué directement (assistant d'import commun, bouton « Synchroniser avec Soft e-Procurement ») et ne correspond plus au modèle types_modele.tpl :
  ne pas relancer gen_types.cjs sans y avoir reporté ces changements (il les écraserait). Données en mémoire.
  Règles : code unique, en majuscules, non modifiable après création ; un type inactif n'est plus proposé dans les nouveaux contrats mais reste visible sur les contrats existants ;
  suppression interdite si le type est utilisé par un contrat (window.CONTRATS) ; synchronisation e-Procurement : doublons (code répété, libellé déjà présent), code modifié côté source
  (le code local est conservé, le code source est mémorisé), bilan affiché à l'écran. API pour la fiche contrat : window.TYPES_PASSATION_API { liste, actifs, trouver, lib, utilise }.
  S'appuie sur les styles bp-* de l'écran « Paramétrage du bilan ». Ne pas nommer de fonction « $$ » (build.cjs).
-->
<style>
.typa-code{font-family:ui-monospace,Consolas,monospace;font-weight:600}
.typa-help{font-size:12px;color:#5B606D}
.typa-er{display:none;font-size:12px;color:#B63132}.typa-er.show{display:block}
.bp-in.err,.bp-sel.err{border-color:#B63132}
.typa-bilan{margin:0 0 12px;padding:10px 14px;border:1px solid #A7F3D0;background:#ECFDF5;border-radius:8px;color:#065F46;font-size:13px;position:relative}.typa-bilan.att{border-color:#FED7AA;background:#FFF7ED;color:#9A3412}
.typa-bilan p{margin:0 0 4px}.typa-bilan p:last-child{margin:0}.typa-bilan button{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;color:inherit;font-size:16px}
.typa-badge{display:inline-flex;align-items:center;padding:2px 10px;border:1px solid;border-radius:6px;font-size:12px;font-weight:600}.typa-badge.on{background:#ECFDF5;border-color:#A7F3D0;color:#047857}.typa-badge.off{background:#F5F7F9;border-color:#D6D9E0;color:#5B606D}
</style>

<div class="bp-root" data-typa>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0">Type de passation</h1>

  <div class="no-print" data-typa-actions>
    <button type="button" data-typa-ajouter>Ajouter</button>
    <button type="button" data-typa-modifier>Modifier</button>
    <button type="button" data-typa-supprimer>Supprimer</button>
    <button type="button" data-typa-enregistrer>Enregistrer</button>
    <button type="button" data-typa-annuler>Annuler</button>
    <button type="button" data-typa-importer>Importer</button>
    <button type="button" data-typa-sync><i class="ti ti-refresh"></i>Synchroniser avec Soft e-Procurement</button>
    <button type="button" data-typa-imprimer>Imprimer</button>
    <button type="button" data-typa-pdf>PDF</button>
    <button type="button" data-typa-xlsx>Excel (XLSX)</button>
  </div>
  <input type="file" accept=".csv,.txt" data-typa-fichier style="display:none">

  <div class="bp-tabs" role="tablist">
    <button type="button" role="tab" class="on" data-typa-tab="saisie">Saisie</button>
    <button type="button" role="tab" data-typa-tab="liste">Liste <span class="bp-n" data-typa-compte></span></button>
  </div>

  <div class="bp-grid">
    <section class="bp-pan" aria-label="Liste des types de passation" data-typa-pan="liste" hidden>
      <div class="typa-bilan" data-typa-bilan hidden></div>
      <h2>Types de passation <small>Double-clic ou « Modifier » pour ouvrir la ligne en saisie</small></h2>
      <div style="overflow:auto;max-height:560px">
        <table class="bp-tb" style="min-width:560px"><thead>
          <tr><th>Code</th><th>Libellé</th><th>Statut</th></tr>
          <tr class="flt"><th><input class="bp-in" data-fc="0" aria-label="Filtrer Code"></th><th><input class="bp-in" data-fc="1" aria-label="Filtrer Libellé"></th>
            <th><select class="bp-sel" data-fc="2" aria-label="Filtrer Statut"><option value=""></option><option value="actif">Actif</option><option value="inactif">Inactif</option></select></th></tr>
        </thead><tbody data-typa-lignes></tbody></table>
      </div>
      <div class="bp-vide" data-typa-vide hidden>Aucun type de passation : utilisez « Ajouter ».</div>
    </section>

    <section class="bp-pan" aria-label="Saisie d'un type de passation" data-typa-pan="saisie">
      <form class="bp-form" data-typa-form onsubmit="return false" novalidate>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <label class="bp-champ"><span>Code <b>*</b></span><input class="bp-in" data-f="code" maxlength="50" autocomplete="off" placeholder="Ex : AOI"><span class="typa-help">Unique, enregistré en majuscules. Non modifiable après création.</span><span class="typa-er" data-er="code"></span><span class="typa-help" data-typa-usage hidden></span></label>
          <label class="bp-champ"><span>Libellé <b>*</b></span><input class="bp-in" data-f="lib" maxlength="150" autocomplete="off" placeholder="Ex : Appel d'offre international"><span class="typa-er" data-er="lib"></span></label>
          <div class="bp-chk" style="align-self:end"><label><input type="checkbox" data-f="actif" checked>Actif</label><span class="typa-help" style="display:block">Un type inactif n'est plus proposé dans les nouveaux contrats, mais reste visible sur les contrats existants.</span></div>
        </div>
      </form>
    </section>
  </div>
  <div class="bp-toast" role="status" hidden data-typa-toast></div>
</div>

<script>
(function () {
  var root = document.querySelector('[data-typa]'); if (!root) return;
  function q(s) { return root.querySelector(s); } function qa(s) { return [].slice.call(root.querySelectorAll(s)); }
  var data = window.typesPassation = window.typesPassation || [["AOI","Appel d'offre International"],["AON","Appel d'Offre National"],["CR","Consultation Restreinte"],["DC","Demande de Prix"],["DP","Demande de Proposition"],["ED","Entente Directe"],["SCBD","Sélection sur le Coût et le Budget Déterminé"],["SCI","Sélection des Consultants Individuels"],["SFQ","Sélection Fondée sur le Qualité"],["SFQC","Selection Fondée sur la Qualité et Coût"],["SMC","Séléction sur le Moindre Coût"],["SQC","Selection sur la Qualification des Consultants"]].map(function (r) { return { code: r[0], lib: r[1], actif: true }; });
  var sel = -1, mode = 'consultation', NOM = 'Type de passation', LC = 'type de passation', FICHIER = 'types_passation';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m, ms) { var t = q('[data-typa-toast]'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, ms || 2500); }
  function err(k, m) { var e = q('[data-er="' + k + '"]'); e.textContent = m || ''; e.classList.toggle('show', !!m); }
  // un contrat désigne son type de passation par le code (anciennes données : par le libellé) : usage = nombre de contrats qui l'utilisent
  function trouver(v) { var s = String(v == null ? '' : v); if (!s) return null; return data.filter(function (x) { return x.code === s; })[0] || data.filter(function (x) { return sansAcc(x.lib) === sansAcc(s) || x.src === s; })[0] || null; }
  function utilise(code) { return (window.CONTRATS || []).filter(function (c) { var t = trouver(c.typePassation); return t && t.code === code; }).length; }
  window.TYPES_PASSATION_API = {
    liste: function () { return data.map(function (x) { return { code: x.code, lib: x.lib, actif: x.actif !== false }; }); },
    actifs: function () { return data.filter(function (x) { return x.actif !== false; }).map(function (x) { return { code: x.code, lib: x.lib, actif: true }; }); },
    trouver: function (v) { var t = trouver(v); return t ? { code: t.code, lib: t.lib, actif: t.actif !== false } : null; },
    lib: function (v) { var t = trouver(v); return t ? t.lib : (v || ''); },
    utilise: utilise
  };
  function filtrer() {
    var F = []; qa('[data-fc]').forEach(function (e) { F[+e.dataset.fc] = e.value.trim().toLowerCase(); });
    qa('[data-typa-lignes] tr').forEach(function (tr) { tr.hidden = F.some(function (v, k) { if (!v) return false; var t = tr.children[k].textContent.trim().toLowerCase(); return k === 2 ? t !== v : t.indexOf(v) < 0; }); });
  }
  qa('[data-fc]').forEach(function (e) { e.addEventListener('input', filtrer); e.addEventListener('change', filtrer); });
  function liste() {
    q('[data-typa-compte]').textContent = data.length ? data.length + (data.length > 1 ? ' lignes' : ' ligne') : '';
    q('[data-typa-vide]').hidden = data.length > 0;
    q('[data-typa-lignes]').innerHTML = data.map(function (s, i) {
      return '<tr data-i="' + i + '"' + (i === sel ? ' class="sel"' : '') + '><td><span class="typa-code">' + esc(s.code) + '</span></td><td>' + esc(s.lib) + '</td><td class="c"><span class="typa-badge ' + (s.actif ? 'on' : 'off') + '">' + (s.actif ? 'Actif' : 'Inactif') + '</span></td></tr>';
    }).join(''); filtrer();
  }
  function form(s) {
    s = s || { code: '', lib: '', actif: true };
    q('[data-f=code]').value = s.code; q('[data-f=lib]').value = s.lib; q('[data-f=actif]').checked = s.actif !== false;
    ['code', 'lib'].forEach(function (k) { err(k); q('[data-f=' + k + ']').classList.remove('err'); });
    var n = s.code ? utilise(s.code) : 0, u = q('[data-typa-usage]'); u.hidden = !n; u.textContent = n ? 'Utilisé par ' + n + ' contrat(s) : suppression impossible (désactivez le type pour ne plus le proposer).' : '';
  }
  function etat() {
    var ed = mode !== 'consultation';
    qa('[data-typa-form] input').forEach(function (e) { e.disabled = !ed; });
    q('[data-f=code]').disabled = mode !== 'creation';
    var a = q('[data-typa-actions]');
    a.querySelector('[data-typa-ajouter]').disabled = ed; a.querySelector('[data-typa-importer]').disabled = ed; a.querySelector('[data-typa-sync]').disabled = ed;
    a.querySelector('[data-typa-modifier]').disabled = ed || sel < 0; a.querySelector('[data-typa-supprimer]').disabled = ed || sel < 0;
    a.querySelector('[data-typa-enregistrer]').disabled = !ed; a.querySelector('[data-typa-annuler]').disabled = !ed;
    ['imprimer', 'pdf', 'xlsx'].forEach(function (k) { a.querySelector('[data-typa-' + k + ']').disabled = !data.length; });
  }
  function onglet(n) { qa('[data-typa-pan]').forEach(function (p) { p.hidden = p.dataset.typaPan !== n; }); qa('[data-typa-tab]').forEach(function (t) { var on = t.dataset.typaTab === n; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); }); }
  function choisir(i) { if (mode !== 'consultation') return; sel = i; liste(); form(data[i]); etat(); }
  qa('[data-typa-tab]').forEach(function (t) { t.addEventListener('click', function () { onglet(t.dataset.typaTab); }); });
  var tb = q('[data-typa-lignes]');
  tb.addEventListener('click', function (e) { var tr = e.target.closest('tr[data-i]'); if (tr) choisir(+tr.dataset.i); });
  tb.addEventListener('dblclick', function (e) { var tr = e.target.closest('tr[data-i]'); if (tr) { choisir(+tr.dataset.i); onglet('saisie'); } });
  q('[data-f=code]').addEventListener('input', function () { var p = this.selectionStart; this.value = this.value.toUpperCase(); try { this.setSelectionRange(p, p); } catch (x) {} });
  function enregistrer() {
    var code = q('[data-f=code]').value.trim().toUpperCase(), lib = q('[data-f=lib]').value.trim(), ok = true, ancien = mode === 'edition' ? data[sel].code : null;
    ['code', 'lib'].forEach(function (k) { err(k); q('[data-f=' + k + ']').classList.remove('err'); });
    function ko(k, m) { err(k, m); q('[data-f=' + k + ']').classList.add('err'); ok = false; }
    if (!code) ko('code', 'Le code est obligatoire.'); else if (data.some(function (x) { return x.code === code && x.code !== ancien; })) ko('code', 'Ce code existe déjà.');
    if (!lib) ko('lib', 'Le libellé est obligatoire.');
    if (!ok) return;
    if (mode === 'creation') { data.push({ code: code, lib: lib, actif: q('[data-f=actif]').checked }); sel = data.length - 1; }
    else { data[sel].lib = lib; data[sel].actif = q('[data-f=actif]').checked; }   // le code (et le code source e-Procurement mémorisé) ne change pas
    mode = 'consultation'; liste(); form(data[sel]); etat(); onglet('liste'); toast(ancien ? 'Type de passation modifié.' : 'Type de passation enregistré.');
  }
  function table() { var L = data.filter(function (s, i) { var tr = tb.children[i]; return !tr || !tr.hidden; }); return { tete: ['Code', 'Libellé', 'Statut'], lignes: L.map(function (s) { return [s.code, s.lib, s.actif ? 'Actif' : 'Inactif']; }) }; }
  function exporter(k) {
    var X = window.EXPORT_TABLEAU, t = table(); if (!X) { toast('Module d’export indisponible.'); return; } if (!t.lignes.length) { toast('Rien à exporter.'); return; }
    if (k === 'pdf') X.pdf(FICHIER + '.pdf', NOM, t.lignes.length + ' ligne(s)', t.tete, t.lignes); else X.xlsx(FICHIER + '.xlsx', NOM, t.tete, t.lignes);
    toast('Export ' + (k === 'pdf' ? 'PDF' : 'Excel (XLSX)') + ' généré : ' + t.lignes.length + ' ligne(s).');
  }
  function imprimer() {
    var t = table(), w = window.open('', '_blank'); if (!w) { toast('Autorisez les fenêtres pop-up pour imprimer.'); return; }
    w.document.write('<!doctype html><meta charset="utf-8"><title>' + esc(NOM) + '</title><style>body{font:13px system-ui,sans-serif;color:#0B1332;margin:24px}h1{font-size:18px}table{border-collapse:collapse;width:100%}th{background:#2E427B;color:#fff;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}td{padding:8px 10px;border-bottom:1px solid #D6D9E0}</style><h1>' + esc(NOM) + '</h1><table><thead><tr>' +
      t.tete.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' + t.lignes.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>');
    w.document.close(); w.focus(); setTimeout(function () { w.print(); }, 300);
  }
  // importation Excel / CSV : colonnes Code, Libellé, Statut (étapes communes : voir import_assistant.js)
  function ligneImport(v) {
    var c = String(v['Code']).toUpperCase(), lb = v['Libellé'], st = String(v['Statut']).toLowerCase(), er = [];
    if (!c) er.push('Code obligatoire'); else if (c.length > 50) er.push('Code trop long (50 caractères au plus)');
    if (!lb) er.push('Libellé obligatoire'); else if (lb.length > 150) er.push('Libellé trop long (150 caractères au plus)');
    if (st && st !== 'actif' && st !== 'inactif') er.push('Statut « ' + v['Statut'] + ' » invalide (Actif ou Inactif)');
    return { cle: c, doublon: !!c && data.some(function (x) { return x.code === c; }), erreurs: er, data: { code: c, lib: lb, actif: st !== 'inactif' } };
  }
  function integrerImport(L) {
    var n = 0, m = 0;
    L.forEach(function (x) { var d = x.data, ex = data.filter(function (y) { return y.code === d.code; })[0]; if (ex) { ex.lib = d.lib; ex.actif = d.actif; m++; } else { data.push({ code: d.code, lib: d.lib, actif: d.actif }); n++; } });
    liste(); etat(); toast(n + ' ligne(s) ajoutée(s), ' + m + ' mise(s) à jour.');
  }
  q('[data-typa-fichier]').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return; var fr = new FileReader(), n = 0;
    fr.onload = function () {
      String(fr.result).replace(/^﻿/, '').split(/\r?\n/).forEach(function (l, i) {
        var p = l.split(/[;,\t]/), c = (p[0] || '').trim().toUpperCase(), lb = (p.slice(1).join(' ') || '').replace(/"/g, '').trim();
        if (i === 0 && /^code$/i.test(c)) return;
        if (c && lb && !data.some(function (x) { return x.code === c; })) { data.push({ code: c, lib: lb, actif: true }); n++; }
      });
      e.target.value = ''; liste(); etat(); toast(n + ' ligne(s) importée(s).');
    };
    fr.readAsText(f);
  });
  // synchronisation avec Soft e-Procurement : référentiel des types de passation (fenêtre partagée ecrans/eprocurement.js ; création par code, mise à jour du libellé et du statut ; rien n'est supprimé)
  function sansAcc(t) { return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function synchroniserEproc() {
    var EP = window.EPROCUREMENT; if (!EP) { toast('Soft e-Procurement indisponible.'); return; }
    // doublons : un code répété dans la source n'est retenu qu'une fois (première occurrence) ; un libellé déjà porté par un autre type de la maquette n'est pas recréé
    var vus = {}, L = EP.typesPassation().map(function (l) { l.statut = l.actif ? 'Actif' : 'Inactif'; l.dup = !!vus[l.code]; vus[l.code] = 1; return l; });
    // rapprochement : par le code (ou le code source mémorisé), sinon par l'ancien code que la source déclare (code modifié côté source)
    function rapprocher(l) {
      var x = data.filter(function (c) { return c.code === l.code || c.src === l.code; })[0], anc = false;
      if (!x && l.ancienCode) { x = data.filter(function (c) { return c.code === l.ancienCode || c.src === l.ancienCode; })[0]; anc = !!x; }
      var dupLib = !x ? data.filter(function (c) { return sansAcc(c.lib) === sansAcc(l.libelle); })[0] : null;
      return { x: x, anc: anc, dupLib: dupLib };
    }
    EP.ouvrir({
      titre: 'Synchroniser les types de passation', intro: 'Choisissez les éléments du référentiel Soft e-Procurement à créer ou à mettre à jour dans la maquette (rapprochement par le code ; un code modifié côté source est rapproché par son ancien code).',
      lignes: L, cle: function (l) { return l.code + (l.dup ? '#doublon' : ''); },
      colonnes: [{ k: 'code', l: 'Code', mono: true }, { k: 'ancienCode', l: 'Ancien code (source)', mono: true }, { k: 'libelle', l: 'Libellé' }, { k: 'statut', l: 'Statut e-Procurement' }],
      etat: function (l) {
        if (l.dup) return { txt: 'Doublon dans la source', actif: false };
        var r = rapprocher(l);
        if (!r.x) return r.dupLib ? { txt: 'Libellé déjà présent (' + r.dupLib.code + ')', actif: false } : { txt: 'Nouveau' };
        if (r.anc) return { txt: 'Code modifié' };
        return { txt: sansAcc(r.x.lib) === sansAcc(l.libelle) && r.x.actif === l.actif ? 'À jour' : 'Mise à jour' };
      },
      ok: 'Synchroniser', note: 'Rien n’est supprimé : les éléments absents d’e-Procurement sont conservés. Le code d’un type existant n’est jamais modifié.',
      onValider: function (S) {
        var cr = 0, mj = 0, ok = 0, cm = [], ign = L.filter(function (l) { return l.dup || rapprocher(l).dupLib; });
        S.forEach(function (l) {
          if (l.dup) return;
          var r = rapprocher(l), x = r.x;
          if (!x) { if (r.dupLib) return; data.push({ code: l.code, lib: l.libelle, actif: l.actif }); cr++; return; }
          var chg = sansAcc(x.lib) !== sansAcc(l.libelle) || x.actif !== l.actif;
          if (chg) { x.lib = l.libelle; x.actif = l.actif; }
          if (r.anc) { x.src = l.code; cm.push(x.code + ' → ' + l.code); } else if (chg) mj++; else ok++;
        });
        mode = 'consultation'; sel = -1; liste(); form(null); etat(); onglet('liste');
        var lignes = ['<b>Synchronisation avec Soft e-Procurement terminée</b> : ' + cr + ' créé(s), ' + mj + ' mis à jour, ' + ok + ' déjà à jour' + (cm.length ? ', ' + cm.length + ' code(s) modifié(s) côté source' : '') + '.'];
        if (cm.length) lignes.push('Codes modifiés côté source (code conservé dans la maquette, code source mémorisé pour les prochaines synchronisations) : ' + esc(cm.join(' ; ')) + '.');
        if (ign.length) lignes.push('Doublons ignorés : ' + esc(ign.map(function (l) { return l.code + (l.dup ? ' (code répété dans la source)' : ' (libellé déjà présent)'); }).join(' ; ')) + '.');
        var b = q('[data-typa-bilan]'); b.innerHTML = lignes.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '<button type="button" data-typa-bilan-x aria-label="Fermer le message">×</button>'; b.classList.toggle('att', !!(cm.length || ign.length)); b.hidden = false;
        toast('Synchronisation terminée : ' + cr + ' créé(s), ' + mj + ' mis à jour' + (cm.length ? ', ' + cm.length + ' code(s) modifié(s) côté source' : '') + (ign.length ? ', ' + ign.length + ' doublon(s) ignoré(s)' : '') + '.', 6000);
      }
    });
  }
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.hasAttribute('data-typa-bilan-x')) { q('[data-typa-bilan]').hidden = true; return; }
    if (b.hasAttribute('data-typa-sync')) { synchroniserEproc(); return; }
    if (b.hasAttribute('data-typa-ajouter')) { onglet('saisie'); mode = 'creation'; sel = -1; liste(); form(null); etat(); q('[data-f=code]').focus(); return; }
    if (b.hasAttribute('data-typa-modifier')) { onglet('saisie'); mode = 'edition'; etat(); q('[data-f=lib]').focus(); return; }
    if (b.hasAttribute('data-typa-annuler')) { mode = 'consultation'; liste(); form(sel >= 0 ? data[sel] : null); etat(); return; }
    if (b.hasAttribute('data-typa-enregistrer')) { enregistrer(); return; }
    if (b.hasAttribute('data-typa-supprimer')) {
      var s = data[sel]; if (!s) return;
      var nu = utilise(s.code);
      if (nu) { toast('Suppression impossible : le type « ' + s.code + ' » est utilisé par ' + nu + ' contrat(s). Désactivez-le (décochez « Actif ») pour ne plus le proposer dans les nouveaux contrats.', 7000); return; }
      if (!window.confirm('Supprimer le ' + LC + ' « ' + s.lib + ' » (' + s.code + ') ? Cette action est définitive.')) return;
      data.splice(sel, 1); sel = -1; liste(); form(null); etat(); toast('Type de passation supprimé.'); return;
    }
    if (b.hasAttribute('data-typa-importer')) {
      window.IMPORT_ASSISTANT.ouvrir({
        titre: NOM, fichier: 'modele_' + FICHIER + '.xlsx',
        champs: [
          { col: 'Code', oblig: true, format: 'Unique, 50 caractères au plus. Enregistré en majuscules.', exemple: 'CODE01' },
          { col: 'Libellé', oblig: true, format: 'Texte, 150 caractères au plus.', exemple: 'Libellé exemple' },
          { col: 'Statut', oblig: false, format: 'Actif ou Inactif. Par défaut : Actif.', exemple: 'Actif' }
        ],
        exemples: [['CODE01', 'Libellé exemple', 'Actif']],
        ligne: ligneImport, integrer: integrerImport
      });
      return;
    }
    if (b.hasAttribute('data-typa-imprimer')) { imprimer(); return; }
    if (b.hasAttribute('data-typa-pdf')) { exporter('pdf'); return; }
    if (b.hasAttribute('data-typa-xlsx')) { exporter('xlsx'); return; }
  });
  liste(); form(null); etat(); onglet('liste');
})();
</script>

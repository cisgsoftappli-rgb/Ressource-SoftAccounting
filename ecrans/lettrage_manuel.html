<!--
  Écran « Lettrage » (Comptabilité générale › Lettrage › Lettrage ; manuel, avec bouton Lettrage automatique) — critères (compte, tiers, période), liste des écritures du tiers
  avec case à cocher, totaux débit / crédit de la sélection et lettrage des lignes cochées. Une sélection équilibrée est lettrée ; un écart inférieur ou
  égal à l'écart toléré (écran Lettrage › Paramètre, window.LETTRAGE_CFG) est accepté et passé au compte d'écart de règlement ; au-delà, le lettrage est refusé.
  La lettre suit le format paramétré (AA, AB… ou 0001…). « Délettrer » défait le lettrage de la lettre des lignes cochées.
  Boutons Lettrer / Délettrer / Tout désélectionner relayés par la barre d'actions de page (CFG « lettmanuel »). Données d'exemple en mémoire,
  état de lettrage conservé dans localStorage (softcompta.lettrageManuel). S'appuie sur les styles bp-*. Ne pas nommer de fonction « $$ » (build.cjs).
-->

<div class="bp-root lm-root" data-lm>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0">Lettrage</h1>

  <div class="no-print" data-lm-actions>
    <button type="button" data-lm-auto>Lettrage automatique</button>
    <button type="button" data-lm-desel>Tout désélectionner</button>
    <button type="button" data-lm-delettrer>Délettrer</button>
    <button type="button" data-lm-ecart disabled title="Générer l’écriture d’écart de règlement de la sélection">Écart de règlement</button>
    <button type="button" data-lm-lettrer>Lettrer</button>
  </div>

  <div class="lm-crit">
    <label class="bp-champ lm-c1"><span>Compte</span><select class="bp-sel" data-lm-compte></select></label>
    <label class="bp-champ lm-c2"><span>Tiers</span><select class="bp-sel" data-lm-tiers></select></label>
    <label class="bp-champ lm-c3"><span>Du</span><input type="date" data-lm-du style="height:30px!important;min-height:30px!important"></label>
    <label class="bp-champ lm-c3"><span>Au</span><input type="date" data-lm-au style="height:30px!important;min-height:30px!important"></label>
    <div class="bp-champ"><span>Statut</span><div class="lm-st" role="radiogroup" aria-label="Statut de lettrage">
      <label><input type="radio" name="lm-st" value="non" data-lm-st><span>Non lettrées</span></label>
      <label><input type="radio" name="lm-st" value="let" data-lm-st><span>Lettrées</span></label>
      <label><input type="radio" name="lm-st" value="tout" data-lm-st checked><span>Toutes</span></label>
    </div></div>
    <div class="lm-go-w"><button type="button" class="lm-go" data-lm-rech><i class="ti ti-search" aria-hidden="true"></i>Rechercher</button></div>
  </div>

  <div class="lm-tb-w"><table class="lm-tb">
    <thead><tr><th class="c"><input type="checkbox" data-lm-tout aria-label="Tout sélectionner"></th><th>Date</th><th>Pièce</th><th>Journal</th><th>Libellé</th><th>Référence</th><th>Échéance</th><th class="r">Débit</th><th class="r">Crédit</th><th>Lettre</th></tr></thead>
    <tbody data-lm-corps></tbody>
  </table></div>

  <div class="lm-tot">
    <label>Total Débit<output data-lm-td>0,00</output></label>
    <label>Total Crédit<output data-lm-tc>0,00</output></label>
    <p class="lm-etat" data-lm-etat aria-live="polite"></p>
  </div>
  <div class="lm-ov" data-lm-ov hidden><div class="lm-md" role="dialog" aria-modal="true" aria-labelledby="lm-md-t">
    <div class="lm-mh"><div><h2 id="lm-md-t">Lettrage automatique</h2><p data-lm-ocrit></p></div><button type="button" class="lm-x" data-lm-ox aria-label="Fermer"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="lm-mb" data-lm-omb></div>
    <div class="lm-mf"><span data-lm-ocnt></span><span class="lm-sp"></span><button type="button" data-lm-oann>Annuler</button><button type="button" class="p" data-lm-oval>Valider le lettrage</button></div>
  </div></div>
  <div class="bp-toast" role="status" hidden data-lm-toast></div>
</div>

<script>
(function () {
  var root = document.querySelector('[data-lm]'); if (!root) return;
  function q(s) { return root.querySelector(s); }
  function qa(s) { return [].slice.call(root.querySelectorAll(s)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function nb(v, d) { return v.toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function iso(j) { var p = j.split('/'); return p[2] + '-' + p[1] + '-' + p[0]; }

  // Jeu d'exemple : [id, date, pièce, journal, libellé, référence, échéance, débit, crédit, lettre]
  var COMPTES = [['411000', 'Clients'], ['401000', 'Fournisseurs'], ['467000', 'Autres débiteurs et créditeurs']];
  var TIERS = {
    '411000': [['C0001', 'Client exemple Alpha'], ['C0002', 'Telma Madagascar'], ['C0003', 'Client exemple Bêta']],
    '401000': [['F0001', 'Fournisseur exemple A'], ['F0002', 'Fournisseur exemple B']],
    '467000': [['D0001', 'Débiteur divers exemple']]
  };
  var L = {
    '411000|C0001': [

      [102, '25/02/2026', 'BNI-2026-0071', 'BNI', 'Virement Client Alpha – F2026-0120', 'F2026-0120', '', 0, 1199800, ''],
      [103, '14/09/2026', 'VTE-2026-0238', 'VTE', 'Facture F2026-0385', 'F2026-0385', '14/10/2026', 850000, 0, '']
    ],
    '411000|C0002': [
      [201, '12/03/2026', 'VTE-2026-0101', 'VTE', 'Facture F2026-0102', 'F2026-0102', '11/04/2026', 3100000, 0, 'AA'],
      [202, '05/04/2026', 'BNI-2026-0120', 'BNI', 'Virement Telma – F2026-0102', 'F2026-0102', '', 0, 3100000, 'AA'],
      [203, '02/09/2026', 'VTE-2026-0231', 'VTE', 'Facture F2026-0380', 'F2026-0380', '02/10/2026', 2250000, 0, ''],
      [204, '19/10/2026', 'BNI-2026-0309', 'BNI', 'Virement Telma – F2026-0380', 'F2026-0380', '', 0, 2250000, ''],
      [205, '15/09/2026', 'VTE-2026-0244', 'VTE', 'Facture F2026-0393', 'F2026-0393', '15/10/2026', 2100000, 0, ''],
      [206, '23/10/2026', 'VTE-2026-0262', 'VTE', 'Facture F2026-0411', 'F2026-0411', '22/11/2026', 4350000, 0, ''],
      [207, '30/09/2026', 'VTE-2026-0252', 'VTE', 'Avoir AV2026-0012', 'AV2026-0012', '', 0, 350000, '']
    ],

      [301, '03/06/2026', 'VTE-2026-0170', 'VTE', 'Facture F2026-0255', 'F2026-0255', '03/07/2026', 640000, 0, ''],
      [302, '28/06/2026', 'CAI-2026-0033', 'CAI', 'Règlement espèces F2026-0255', 'F2026-0255', '', 0, 600000, '']
    ],
    '401000|F0001': [
      [401, '08/05/2026', 'ACH-2026-0090', 'ACH', 'Facture fournisseur FA-5521', 'FA-5521', '07/06/2026', 0, 1800000, ''],
      [402, '30/05/2026', 'BNI-2026-0140', 'BNI', 'Paiement FA-5521', 'FA-5521', '', 1800000, 0, ''],
      [403, '17/09/2026', 'ACH-2026-0211', 'ACH', 'Facture fournisseur FA-5788', 'FA-5788', '17/10/2026', 0, 920000, '']
    ],
    '401000|F0002': [
      [501, '20/07/2026', 'ACH-2026-0150', 'ACH', 'Facture fournisseur FB-310', 'FB-310', '19/08/2026', 0, 560000, '']
    ],
    '467000|D0001': [
      [601, '11/08/2026', 'OD-2026-0044', 'OD', 'Avance à régulariser', 'AV-0044', '', 300000, 0, ''],
      [602, '29/08/2026', 'OD-2026-0049', 'OD', 'Régularisation avance', 'AV-0044', '', 0, 300000, '']
    ]
  };
  var CLE = 'softcompta.lettrageManuel', etat = { lettres: {}, cnt: {}, ecarts: [] };
  try { var sv = JSON.parse(localStorage.getItem(CLE) || 'null'); if (sv && typeof sv === 'object') etat = { lettres: sv.lettres || {}, cnt: sv.cnt || {}, ecarts: sv.ecarts || [] }; } catch (e) {}
  etat.ecarts.forEach(function (e) { (L[e.k] = L[e.k] || []).push(e.l); });   // écritures d'écart de règlement déjà générées
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }
  function lettreDe(l) { return etat.lettres.hasOwnProperty(l[0]) ? etat.lettres[l[0]] : l[9]; }
  var appl = { compte: '', tiers: '', du: '', au: '', statut: 'tout' };
  function syncSaisies() {   // écritures saisies sur un compte de tiers : lettrables comme les autres
    var ES = window.ECRITURES_SAISIES; if (!ES) return;
    ES({}).forEach(function (x) { if (!x.tiers) return; var k = x.compte + '|' + x.tiers, a = L[k] = L[k] || []; if (!COMPTES.some(function (c) { return c[0] === x.compte; })) COMPTES.push([x.compte, ES.libCompte(x.compte) || 'Compte de tiers']); var TT = TIERS[x.compte] = TIERS[x.compte] || []; if (!TT.some(function (t) { return t[0] === x.tiers; })) TT.push([x.tiers, ES.nomTiers(x.tiers)]);
      if (a.some(function (l) { return l[0] === x.id; })) return; a.push([x.id, ES.fr(x.date), x.piece, x.journal, x.libelle, x.reference, ES.fr(x.echeance), x.debit, x.credit]); });
  }
  function cle() { syncSaisies(); return appl.compte + '|' + appl.tiers; }
  function statutSaisi() { var r = q('[data-lm-st]:checked'); return r ? r.value : 'tout'; }
  function saisis() { return { compte: q('[data-lm-compte]').value, tiers: q('[data-lm-tiers]').value, du: q('[data-lm-du]').value, au: q('[data-lm-au]').value, statut: statutSaisi() }; }
  function enAttente() {}   // les critères ne s'appliquent qu'au clic sur Rechercher (ou Entrée)
  function rechercher() { appl = saisis(); sel = {}; qa('[data-lm-corps] tr.let').forEach(function (r) { r.style.outline = ''; }); dessiner(); }
  // écart de règlement : débit > crédit = perte (compte de charge) ; crédit > débit = gain (compte de produit)
  function compteEcartDe(d, c) { var g = d > c; return { code: g ? (cfg().compteEcart || '658000') : (cfg().compteGain || '758000'), nature: g ? 'perte' : 'gain' }; }

  var sel = {};

  function remplirCompte() { q('[data-lm-compte]').innerHTML = COMPTES.map(function (c) { return '<option value="' + c[0] + '">' + esc(c[0] + ' — ' + c[1]) + '</option>'; }).join(''); }
  function remplirTiers() {
    var c = q('[data-lm-compte]').value;

    return (L[cle()] || []).filter(function (l) { var d = iso(l[1]), lt = !!lettreDe(l); return (!du || d >= du) && (!au || d <= au) && (appl.statut === 'tout' || (appl.statut === 'let') === lt); });
  }
  function dessiner() {
    var rows = lignes(), h = '';
    rows.forEach(function (l) {
      var lt = lettreDe(l), on = !!sel[l[0]];
      h += '<tr class="' + (lt ? 'let' : on ? 'sel' : '') + '" data-id="' + l[0] + '"><td class="c"><input type="checkbox" data-lm-ck aria-label="Sélectionner ' + esc(l[2]) + '"' + (on ? ' checked' : '') + (lt ? ' disabled' : '') + '></td>' +
        '<td>' + l[1] + '</td><td class="lm-pc">' + esc(l[2]) + '</td><td><span class="lm-jr">' + esc(l[3]) + '</span></td><td>' + esc(l[4]) + '</td><td>' + esc(l[5]) + '</td><td>' + (l[6] || '') + '</td>' +
        '<td class="r">' + (l[7] ? nb(l[7]) : '—') + '</td><td class="r">' + (l[8] ? nb(l[8]) : '—') + '</td><td>' + (lt ? '<span class="lm-lt">' + esc(lt) + '</span>' : '') + '</td></tr>';
    });
    q('[data-lm-corps]').innerHTML = h || '<tr><td colspan="10" class="lm-vide">Aucune écriture pour ce tiers sur la période.</td></tr>';
    var libres = rows.filter(function (l) { return !lettreDe(l); }), tout = q('[data-lm-tout]');

  }
  function selection() { var r = []; Object.keys(L).forEach(function (k) { L[k].forEach(function (l) { if (sel[l[0]]) r.push(l); }); }); return r; }
  function totaux() {
    var s = selection(), d = 0, c = 0; s.forEach(function (l) { d += l[7]; c += l[8]; });
    q('[data-lm-td]').textContent = nb(d, 2); q('[data-lm-tc]').textContent = nb(c, 2);
    var e = q('[data-lm-etat]'), ec = Math.abs(d - c), tol = cfg().ecart;

    else if (ec < 0.005) { e.textContent = 'Sélection équilibrée : prête à être lettrée.'; e.className = 'lm-etat ok'; }

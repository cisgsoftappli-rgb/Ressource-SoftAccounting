<!--
  Écran « Gestion des contrats › Suivi et historique › Suivi des contrats » — état de suivi des marchés, présenté comme les états comptables (charte) :
  barre d'actions (Critères, PDF, Excel), critères d'édition dans une pop-up (Critères de sélection : Exercices, Code marché, Site en choix multiples, Axe de rupture, Date d'état,
  Type de passation, Type de marché, Compte fournisseur ; Choix de la monnaie ; Axes analytiques Du / Au selon les plans activés dans l'entité et PCG), puis l'état :
  Site, Code marché, Libellé, Bénéficiaire, Statut, Montant du marché, Montant facturé, Solde, % Facturé, Montant payé, % Payé, % (Payé/Facturé), avec sous-totaux par axe de rupture et total.
  Données : contrats de « Fiche contrat » (window.CONTRATS) et marchés d'exemple fictifs ; facturé / payé simulés. Préfixe sc / data-sc. Ne pas nommer de fonction « $$ » (build.cjs).
-->

<script>

    { code: 'MP-2025-004', lib: 'Acquisition de véhicules utilitaires', benef: 'F003', statut: 'Actif', marche: 210000000, fact: 1, paye: .9, tm: 'Fournitures', tp: 'Appel d’offres ouvert', site: '01', date: '2025-04-14' },
    { code: 'MP-2025-009', lib: 'Étude de faisabilité — réhabilitation de bâtiments', benef: 'F002', statut: 'Actif', marche: 64000000, fact: .75, paye: .5, tm: 'Prestations intellectuelles', tp: 'Consultation de fournisseurs', site: '01', date: '2025-07-02' },
    { code: 'MP-2025-012', lib: 'Travaux de voirie — lot 1', benef: 'F102', statut: 'Inactif', marche: 380000000, fact: 1, paye: 1, tm: 'Travaux', tp: 'Appel d’offres restreint', site: '01', date: '2025-09-23' },
    { code: 'MP-2026-005', lib: 'Maintenance du parc informatique', benef: 'F001', statut: 'Actif', marche: 36000000, fact: .4, paye: .25, tm: 'Services courants', tp: 'Gré à gré', site: '01', date: '2026-01-19' }
  ];
  function montantC(c) { return (c.vent || []).reduce(function (a, v) { return a + (Number((v.mt || {}).MGA) || 0); }, 0); }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000; return h / 1000; }

  function nomSite(c) { var s = sites().filter(function (x) { return x[0] === c; })[0]; return s ? s[1] : c; }
  var REFPLAN = { PLAN1: 'activite', PLAN2: 'budget', PLAN4: 'geo' };
  function plansAna() {
    var act = window.PLANS_ACTIFS ? window.PLANS_ACTIFS() : ['PC', 'PLAN1', 'PLAN2', 'PLAN3', 'PLAN4'];
    var l = act.filter(function (c) { return c !== 'PC'; }).map(function (c) {
      var cfg = (window.PLANS_CFG || []).filter(function (p) { return p.code === c; })[0] || {}, L = window.PLANS_LIGNES && window.PLANS_LIGNES[c], rows;
      if (L && L.rows && L.rows.length) rows = L.rows.filter(function (x) { return x.actif !== false; }).map(function (x) { return [x.code, x.code + ' — ' + x.libelle]; });
      else rows = ((window.PLANS_REF || {})[REFPLAN[c]] || []).map(function (x) { return [x[0], x[0] + ' — ' + x[1]]; });

    });
    var pc = window.PLAN_COMPTABLE || [], rows = pc.filter(function (r) { return /^[26]/.test(r.code) && !pc.some(function (x) { return x.parent === r.code; }); }).map(function (r) { return [r.code, r.code + ' — ' + r.libelle]; });

  }
  function opts(l, vide) { return '<option value="">' + (vide || '') + '</option>' + l.map(function (x) { var c = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(c) + '">' + esc(t) + '</option>'; }).join(''); }
  function maj(s) { if (s && s.__combo && s.__combo.maj) s.__combo.maj(); }

  // ---------- listes à choix multiples
  var sel = { exercices: [], marches: [], sites: [] };
  function choix(k) {
    if (k === 'exercices') { var a = {}; marches().forEach(function (m) { if (m.exo) a[m.exo] = 1; }); a['2026'] = 1; return Object.keys(a).sort().reverse().map(function (x) { return [x, x]; }); }

  }

    sel[k] = [].slice.call(ms.querySelectorAll('input:checked')).map(function (i) { return i.value; }); var ouvert = true; msDessin(k); ms.querySelector('.sc-msp').hidden = !ouvert;
  });
  document.addEventListener('click', function (e) { if (!root.contains(e.target)) qa('.sc-msp').forEach(function (x) { x.hidden = true; }); });

  // ---------- critères
  function aujourdhui() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function init() {
    ['exercices', 'marches', 'sites'].forEach(msDessin);
    var rup = [['site', 'Site'], ['typeMarche', 'Type de marché'], ['passation', 'Type de passation'], ['benef', 'Bénéficiaire']];
    q('[data-c="rupture"]').innerHTML = opts(rup, 'Aucun');
    q('[data-c="passation"]').innerHTML = opts(PASSATIONS, 'Tous'); q('[data-c="typeMarche"]').innerHTML = opts(MARCHES, 'Tous');

  // ---------- onglets

  function c(n) { return q('[data-c="' + n + '"]').value; }
  function filtrer() {
    var de = c('dateEtat'), axes = {};
    qa('[data-an]').forEach(function (s) { var k = s.dataset.an; (axes[k] || (axes[k] = {}))[s.dataset.b] = s.value; });
    return marches().filter(function (m) {
      if (sel.exercices.length && sel.exercices.indexOf(m.exo) < 0) return false;
      if (sel.marches.length && sel.marches.indexOf(m.code) < 0) return false;
      if (sel.sites.length && sel.sites.indexOf(m.site) < 0) return false;
      if (c('passation') && m.tp !== c('passation')) return false;
      if (c('typeMarche') && m.tm !== c('typeMarche')) return false;

      return Object.keys(axes).every(function (k) {

    });
  }
  function ligne(m) { var solde = m.marche - m.fact; return [nomSite(m.site), m.code, m.lib, m.nomBenef, m.statut, m.marche, m.fact, solde, m.marche ? m.fact * 100 / m.marche : 0, m.paye, m.marche ? m.paye * 100 / m.marche : 0, m.fact ? m.paye * 100 / m.fact : 0]; }
  function somme(L) { var r = { marche: 0, fact: 0, paye: 0 }; L.forEach(function (m) { r.marche += m.marche; r.fact += m.fact; r.paye += m.paye; }); return r; }
  function cumul(lbl, s) { return [lbl, '', '', '', '', s.marche, s.fact, s.marche - s.fact, s.marche ? s.fact * 100 / s.marche : 0, s.paye, s.marche ? s.paye * 100 / s.marche : 0, s.fact ? s.paye * 100 / s.fact : 0]; }
  function consulter() {
    if (c('monnaie')) { msg('Aucun cours en vigueur pour la devise choisie : édition impossible.'); return; }
    var L = filtrer(), rup = c('rupture'), rows = [];
    if (rup) {
      var g = {}, ordre = []; L.forEach(function (m) { var k = rup === 'site' ? nomSite(m.site) : rup === 'typeMarche' ? m.tm : rup === 'passation' ? m.tp : m.nomBenef; k = k || '—'; if (!g[k]) { g[k] = []; ordre.push(k); } g[k].push(m); });
      ordre.sort().forEach(function (k) { g[k].forEach(function (m) { rows.push({ t: 'l', v: ligne(m) }); }); rows.push({ t: 's', v: cumul('Sous-total — ' + k, somme(g[k])) }); });
    } else L.forEach(function (m) { rows.push({ t: 'l', v: ligne(m) }); });
    if (L.length) rows.push({ t: 't', v: cumul('Total général', somme(L)) });

    dessiner(); fermer(); q('[data-sc-vide]').hidden = true; q('[data-sc-res]').hidden = false;
    q('[data-sc-info]').textContent = L.length + ' marché(s)';
    q('[data-sc-meta]').textContent = 'État au ' + c('dateEtat').split('-').reverse().join('/') + ' — Monnaie : MGA' + (rup ? ' — Rupture : ' + q('[data-c="rupture"] option:checked').textContent : '');
    msg(L.length + ' marché(s).');
  }
  function fmt(v, i) { return typeof v === 'number' ? (i === 8 || i === 10 || i === 11 ? pc(v) : nb(v)) : esc(v); }

    var t = q('[data-sc-table]');
    t.innerHTML = '<thead><tr>' + TETE.map(function (h, i) { return '<th' + (i >= 5 ? ' class="r"' : '') + '>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (resultat.nb ? resultat.rows.map(function (r) { return '<tr' + (r.t === 's' ? ' class="sc-sub"' : r.t === 't' ? ' class="sc-tot"' : '') + '>' + r.v.map(function (x, i) { return '<td' + (i >= 5 ? ' class="r"' : '') + '>' + fmt(x, i) + '</td>'; }).join('') + '</tr>'; }).join('') : '<tr><td colspan="12" class="sc-novide">Aucun enregistrement trouvé</td></tr>') + '</tbody>';
  }
  function exporter(k) {
    if (!resultat) { ouvrir(); msg('Lancez d\u2019abord l\u2019édition (Critères).'); return; } if (!resultat.nb) { msg('Rien à exporter.'); return; }
    var X = window.EXPORT_TABLEAU; if (!X) { msg('Module d’export indisponible.'); return; }
    var lignes = resultat.rows.map(function (r) { return r.v.map(function (x, i) { return typeof x === 'number' ? (i === 8 || i === 10 || i === 11 ? pc(x) : nb(x)) : x; }); });
    if (k === 'pdf') X.pdf('suivi_des_contrats.pdf', 'Suivi des contrats', resultat.nb + ' marché(s) — état au ' + c('dateEtat').split('-').reverse().join('/'), TETE, lignes); else X.xlsx('suivi_des_contrats.xlsx', 'Suivi des contrats', TETE, lignes);
    msg('Export ' + (k === 'pdf' ? 'PDF' : 'Excel (XLSX)') + ' généré : ' + resultat.nb + ' marché(s).');
  }

  q('[data-sc-pdf]').addEventListener('click', function () { exporter('pdf'); }); q('[data-sc-xlsx]').addEventListener('click', function () { exporter('xlsx'); });
  q('[data-sc-reset]').addEventListener('click', function () { sel = { exercices: [], marches: [], sites: [] }; init(); resultat = null; q('[data-sc-res]').hidden = true; q('[data-sc-vide]').hidden = false; msg(''); });
  window.addEventListener('contrats-changed', function () { ['exercices', 'marches', 'sites'].forEach(msDessin); });
  function auto() { if (location.hash === '#suivicontrats' && ov.hidden && !resultat) setTimeout(ouvrir, 60); }
  window.addEventListener('hashchange', auto);

  init(); auto();
})();
</script>

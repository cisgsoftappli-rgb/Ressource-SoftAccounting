<!--
  Écran « Suivi détaillé » de la procédure financière GAVI (Comptabilité Projets & Bailleurs › GAVI › Suivi détaillé).
  Même charte que les éditions des états financiers : barre d'actions (Critères, Imprimer, Exporter), fenêtre de critères, état édité dans un panneau.
  Critères : année en cours, périodicité, numéro (période calculée), budget dépenses, type de dépenses, centre de saisie, subvention, journal, milliers, monnaie.
  Résultat : Subvention / Activité / Domaine / Objectif / Catégorie / Poste, Budget et Réel par trimestre, Total annuel (fichier ExploitationGaviSuiviDetaille.xlsx).
  Données : lignes de démonstration du fichier + écritures saisies (imputation FINANCEMENT / ACTIVITE / CATEGORIE DE DEPENSE / POSTE BUDGETAIRE),
  règle « type de dépenses » (décaissement : classes 2, 4, 6 en journaux de trésorerie ; engagement : classes 2 et 6, tous journaux).
-->

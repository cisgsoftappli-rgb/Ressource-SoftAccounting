<!--
  Écran « Rapport financier » de la procédure financière GAVI (Comptabilité Projets & Bailleurs › GAVI › Rapport financier).
  Même charte que les éditions des états financiers : barre d'actions (Critères, Imprimer, Exporter), fenêtre de critères, état édité dans un panneau.
  Critères : année en cours (de … au …), périodicité, budget dépenses, type de dépenses, centre de saisie, subvention, journal, milliers, monnaie.
  Résultat (fichier rapport-financier-….xlsx) : Effets / Convention / Bénéficiaires / Géo / Activité / Domaines / Objectifs / Catégories / Postes,
  puis, par période : Budget, Dépenses, Exécution % ; en-tête : type de subvention, dates, budget, dépenses GAVI, % budget, déboursement GAVI (par période).
  Dépenses : « Engagements » = lignes du rapport de démonstration (par semestre) ; « Décaissements » = réel du Suivi détaillé (par trimestre) ; l'un et l'autre
  complétés par les écritures saisies (imputation FINANCEMENT / ACTIVITE / CATEGORIE DE DEPENSE / POSTE BUDGETAIRE, règle « type de dépenses »).
  Le déboursement GAVI est toujours le réel décaissé (Suivi détaillé). Une donnée connue par semestre ou trimestre est répartie à parts égales sur des périodes plus fines.
-->
